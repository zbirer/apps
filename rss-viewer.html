<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קורא RSS מתקדם</title>
    <style>
        :root {
            --bg-app: #0f172a;
            --bg-card: #1e293b;
            --bg-header: rgba(15, 23, 42, 0.85);
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
            --accent-dim: rgba(139, 92, 246, 0.1);
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
            --radius-lg: 12px;
            --radius-md: 8px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .light-mode {
            --bg-app: #f8fafc;
            --bg-card: #ffffff;
            --bg-header: rgba(248, 250, 252, 0.85);
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-dim: rgba(99, 102, 241, 0.08);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-app);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            direction: rtl;
            text-align: right;
            transition: var(--transition);
            min-height: 100vh;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-header);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .toolbar {
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .toolbar::-webkit-scrollbar {
            display: none;
        }

        .category-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.1);
            padding: 3px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .light-mode .category-tabs {
            background: rgba(0, 0, 0, 0.03);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #ffffff;
            box-shadow: var(--shadow);
        }

        .controls-actions-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .controls-actions-group select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 5px 8px;
            font-size: 12px;
            font-weight: 500;
            border-radius: var(--radius-md);
            cursor: pointer;
            outline: none;
            transition: var(--transition);
        }

        .controls-actions-group select:hover {
            border-color: var(--accent);
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 28px;
            height: 28px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            background-color: var(--accent-dim);
            color: var(--accent);
        }

        .icon-btn svg {
            width: 14px;
            height: 14px;
            stroke-width: 2.5;
            transition: transform 0.2s ease;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .icon-btn.loading svg {
            animation: spin 1s linear infinite;
            color: var(--accent);
        }

        .main-content {
            padding: 12px 16px;
            flex-grow: 1;
        }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            width: 100%;
        }

        .rss-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-sizing: border-box;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .rss-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 3px;
            height: 100%;
            background-color: transparent;
            transition: var(--transition);
        }

        .rss-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 6px 12px -4px rgba(0, 0, 0, 0.3);
        }

        .rss-card.read {
            opacity: 0.75;
            border-color: var(--border-color);
        }

        .rss-card.active::before {
            background-color: var(--accent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }

        .badge-source {
            background-color: var(--accent-dim);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1px;
            text-transform: uppercase;
        }

        .meta-time {
            font-size: 10px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .card-title {
            margin: 0;
            font-weight: 700;
            line-height: 1.25;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .rss-card:hover .card-title {
            color: var(--accent);
        }

        .card-expanded-content {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-description {
            margin: 0 0 10px 0;
            line-height: 1.45;
            color: var(--text-primary);
        }

        .card-description * {
            line-height: 1.45;
        }

        .card-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            gap: 8px;
        }

        .card-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: var(--transition);
        }

        .card-btn:hover {
            border-color: var(--accent);
            background-color: var(--accent-dim);
            color: var(--accent);
        }

        .card-btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .card-btn-primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #ffffff;
        }

        .skeleton-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .skeleton-block {
            background: linear-gradient(90deg, var(--border-color) 25%, var(--bg-app) 50%, var(--border-color) 75%);
            background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes skeletonLoading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .floating-to-top {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background-color: var(--accent);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--shadow);
            display: none;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            z-index: 1000;
        }

        .floating-to-top:hover {
            transform: translateY(-2px);
            background-color: var(--accent-hover);
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transform: translateY(100px);
            opacity: 0;
            animation: slideInUp 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideInUp {
            to { transform: translateY(0); opacity: 1; }
        }

        .toast.hide {
            animation: fadeOutDown 0.3s forwards ease-in;
        }

        @keyframes fadeOutDown {
            to { transform: translateY(20px); opacity: 0; }
        }

        .toast-icon {
            display: flex;
            align-items: center;
        }
        .toast-icon.success { color: #10b981; }
        .toast-icon.error { color: #ef4444; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            color: var(--border-color);
            margin-bottom: 12px;
        }

        .empty-state.error svg {
            color: #ef4444;
        }

        .empty-state h3 {
            color: var(--text-primary);
            margin: 0 0 6px;
            font-size: 18px;
        }

        .empty-state p {
            margin: 4px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .font-normal .card-title { font-size: 14px; }
        .font-big .card-title { font-size: 16px; }
        .font-biggest .card-title { font-size: 19px; }

        .inner-font-16 .card-description, 
        .inner-font-16 .card-description * { font-size: 16px !important; }

        .inner-font-18 .card-description, 
        .inner-font-18 .card-description * { font-size: 18px !important; }

        .inner-font-20 .card-description, 
        .inner-font-20 .card-description * { font-size: 20px !important; }

        .inner-font-24 .card-description, 
        .inner-font-24 .card-description * { font-size: 24px !important; }

        .inner-font-28 .card-description, 
        .inner-font-28 .card-description * { font-size: 28px !important; }
    </style>
</head>
<body class="font-biggest inner-font-20">
    <div class="app-wrapper">
        <header>
            <div class="toolbar">
                <div class="category-tabs" id="category-tabs">
                    <button class="tab-btn" data-category="news">חדשות</button>

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>
    <div class="toast-container" id="toast-container"></div>

    <script>
        // הגדרת מפתח ה-API האישי
        const RSS2JSON_API_KEY = 'p4v5ts9xc8bvu5xg2izrjjdvguolbbjy3elzgvku';

        let loadedItems = [];
        const readItems = new Set();
        let selectedCategory = 'flash';

        const feedUrls = {

            ],
            tech: [
                'https://www.askpavel.co.il/feed',
                'https://www.tgspot.co.il/feed/',
                'https://www.maariv.co.il/Rss/RssFeedsTechnologeya',
                'https://rss.walla.co.il/feed/4703',

                'https://rcs.mako.co.il/rss/31750a2610f26110VgnVCM1000005201000aRCRD.xml',
                'https://www.now14.co.il/feed/',
                'https://www.inn.co.il/Rss.aspx?act=.1',
                'https://www.makorrishon.co.il/rss',
                'https://www.israelhayom.co.il/rss'
            ]
        };

        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const refreshBtn = document.getElementById('refresh');
        const categoryTabsContainer = document.getElementById('category-tabs');
        const rssContent = document.getElementById('rss-content');
        const toTopBtn = document.getElementById('to-top-btn');
        const fontSizeSelect = document.getElementById('font-size');
        const innerFontSizeSelect = document.getElementById('inner-font-size');
        const imageSizeSelect = document.getElementById('image-size');

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            if (isLight) {
                themeIcon.innerHTML = `
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                `;
                themeBtn.title = "מעבר למצב כהה";
            } else {
                themeIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
                themeBtn.title = "מעבר למצב בהיר";
            }
        });

        categoryTabsContainer.addEventListener('click', (e) => {
            const targetBtn = e.target.closest('.tab-btn');
            if (!targetBtn) return;

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            targetBtn.classList.add('active');
            
            selectedCategory = targetBtn.dataset.category;
            loadRSS(false);
        });

        fontSizeSelect.addEventListener('change', () => {
            document.body.classList.remove('font-normal', 'font-big', 'font-biggest');
            document.body.classList.add(`font-${fontSizeSelect.value}`);
        });

        innerFontSizeSelect.addEventListener('change', () => {
            document.body.classList.remove('inner-font-16', 'inner-font-18', 'inner-font-20', 'inner-font-24', 'inner-font-28');
            document.body.classList.add(`inner-font-${innerFontSizeSelect.value}`);
        });

        imageSizeSelect.addEventListener('change', adjustImageSizes);

        setInterval(() => {
            loadRSS(true);
        }, 10 * 60 * 1000);

        refreshBtn.addEventListener('click', () => loadRSS(true));

        function getRelativeTimeString(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = Math.floor(seconds / 31536000);
            if (interval >= 1) return `לפני ${interval} שנים`;
            interval = Math.floor(seconds / 2592000);
            if (interval >= 1) return `לפני ${interval} חודשים`;
            interval = Math.floor(seconds / 86400);
            if (interval >= 1) return interval === 1 ? 'אתמול' : `לפני ${interval} ימים`;
            interval = Math.floor(seconds / 3600);
            if (interval >= 1) return `לפני ${interval} שעות`;
            interval = Math.floor(seconds / 60);
            if (interval >= 1) return `לפני ${interval} דקות`;
            return 'ממש עכשיו';
        }

        function showSkeletons() {
            rssContent.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton-card';
                skeleton.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <div class="skeleton-block" style="width: 70px; height: 14px;"></div>
                        <div class="skeleton-block" style="width: 50px; height: 12px;"></div>
                    </div>
                    <div class="skeleton-block" style="width: 100%; height: 20px; margin-top: 6px;"></div>
                    <div class="skeleton-block" style="width: 80%; height: 20px;"></div>
                    <div class="skeleton-block" style="width: 35%; height: 14px; margin-top: 8px;"></div>
                `;
                rssContent.appendChild(skeleton);
            }
        }

        function triggerToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <span class="toast-icon ${isError ? 'error' : 'success'}">
                    ${isError ? `
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                    ` : `
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    `}
                </span>
                <span>${message}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function fetchFeedsThrottled(urls, concurrency = 3, delayMs = 250) {
            const results = [];
            let rateLimitHits = 0;
            let generalErrors = 0;

            for (let i = 0; i < urls.length; i += concurrency) {
                const batch = urls.slice(i, i + concurrency);
                const batchPromises = batch.map(async (url) => {
                    try {
                        const targetUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&api_key=${RSS2JSON_API_KEY}`;
                        const response = await fetch(targetUrl);
                        
                        if (response.status === 403) {
                            rateLimitHits++;
                            return { error: '403_rate_limit', items: [] };
                        }
                        if (!response.ok) {
                            generalErrors++;
                            return { error: `HTTP ${response.status}`, items: [] };
                        }

                        const data = await response.json();
                        if (data.status !== 'ok') {
                            generalErrors++;
                            return { error: data.message || 'RSS Parse Error', items: [] };
                        }
                        return data;
                    } catch (err) {
                        rateLimitHits++;
                        return { error: 'network_or_cors', items: [] };
                    }
                });

                const batchResults = await Promise.all(batchPromises);
                results.push(...batchResults);

                if (i + concurrency < urls.length) {
                    await sleep(delayMs);
                }
            }

            return {
                feeds: results,
                rateLimitHits,
                generalErrors,
                totalFeeds: urls.length
            };
        }

        async function loadRSS(isSilent = false) {
            const urls = feedUrls[selectedCategory] || [];
            refreshBtn.classList.add('loading');

            if (!isSilent || loadedItems.length === 0) {
                showSkeletons();
            }

            const excludedWords = ['כדורגל', 'כדורסל', 'ספורט'];

            try {
                const { feeds, rateLimitHits } = await fetchFeedsThrottled(urls, 3, 250);
                refreshBtn.classList.remove('loading');

                let itemsList = feeds.flatMap(feed => feed.items || []);

                if (itemsList.length === 0 && rateLimitHits > 0) {
                    renderRateLimitError();
                    return;
                }

                if (rateLimitHits > 0) {
                    triggerToast(`התקבלו כתבות חלקיות (${rateLimitHits} מקורות לא הגיבו)`, true);
                }

                const uniqueItemsMap = new Map();
                itemsList.forEach(item => {
                    uniqueItemsMap.set(item.guid || item.link || item.title, item);
                });
                itemsList = Array.from(uniqueItemsMap.values());

                itemsList.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

                const now = new Date();
                loadedItems = itemsList.filter(item => {
                    const itemDate = new Date(item.pubDate);
                    if (itemDate > now) return false;

                    const combinedText = ((item.title || '') + ' ' + (item.description || '')).toLowerCase();
                    return !excludedWords.some(word => combinedText.includes(word));
                });

                renderFeedItems();
            } catch (err) {
                refreshBtn.classList.remove('loading');
                if (isSilent && loadedItems.length > 0) {
                    triggerToast('שגיאה בסנכרון הנתונים', true);
                } else {
                    renderGeneralError();
                }
            }
        }

        function renderRateLimitError() {
            rssContent.innerHTML = `
                <div class="empty-state error">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <h3>נחסמה הגישה לשירות ה-RSS</h3>
                    <p>שרת <code>rss2json</code> החזיר שגיאה בבקשה.</p>
                    <p style="font-size: 13px; color: var(--accent); margin-top: 8px;">
                        ודא שה-API Key פעיל והמגבלות בהגדרות החשבון מאפשרות בקשות מדומיין זה.
                    </p>
                </div>
            `;
        }

        function renderGeneralError() {
            rssContent.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <h3>שגיאה בחיבור לערוצי התוכן</h3>
                    <p>אנא ודא את חיבור הרשת שלך ונסה שוב מאוחר יותר.</p>
                </div>
            `;
        }

        function renderFeedItems() {
            const filtered = loadedItems;
            rssContent.innerHTML = '';

            if (filtered.length === 0) {
                rssContent.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <h3>לא נמצאו כתבות</h3>
                        <p>נסה להחליף קטגוריה או לרענן מאוחר יותר</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((item, index) => {
                const card = document.createElement('div');
                const itemId = item.guid || item.link || item.title;
                card.className = `rss-card${readItems.has(itemId) ? ' read' : ''}`;
                
                const rawHost = item.link ? new URL(item.link).hostname.replace('www.', '') : 'RSS';
                const parsedHost = translateHost(rawHost);
                const pubDate = new Date(item.pubDate);
                const relativeTime = getRelativeTimeString(pubDate);

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="badge-source">${parsedHost}</span>
                            <span class="meta-time" title="${pubDate.toLocaleString('he-IL')}">${relativeTime}</span>
                        </div>
                        <h2 class="card-title">${item.title}</h2>
                    </div>
                    
                    <div class="card-expanded-content" id="expanded-${index}">
                        <div class="card-description">${item.description}</div>
                        <div class="card-actions">
                            <a href="${item.link}" target="_blank" class="card-btn card-btn-primary">
                                לקריאת המאמר המלא
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <line x1="10" y1="14" x2="21" y2="3"></line>
                                </svg>
                            </a>
                        </div>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    if (e.target.closest('.card-btn') || e.target.closest('a')) return;

                    const expander = card.querySelector('.card-expanded-content');
                    const isVisible = expander.style.display === 'block';

                    if (!isVisible) {
                        document.querySelectorAll('.rss-card').forEach(otherCard => {
                            if (otherCard !== card) {
                                otherCard.classList.remove('active');
                                const otherExpander = otherCard.querySelector('.card-expanded-content');
                                if (otherExpander) otherExpander.style.display = 'none';
                            }
                        });

                        expander.style.display = 'block';
                        card.classList.add('active');
                        readItems.add(itemId);
                        card.classList.add('read');
                    } else {
                        expander.style.display = 'none';
                        card.classList.remove('active');
                    }
                });

                rssContent.appendChild(card);
            });

            adjustImageSizes();
        }

        function adjustImageSizes() {
            const size = imageSizeSelect.value;
            let maxWidth, display;
            
            switch (size) {
                case 'hide': maxWidth = '0'; display = 'none'; break;
                case 'medium': maxWidth = '65%'; display = 'block'; break;
                case 'big': maxWidth = '100%'; display = 'block'; break;
                default: maxWidth = '35%'; display = 'block'; break;
            }

            document.querySelectorAll('.rss-card img').forEach(img => {
                img.style.maxWidth = maxWidth;
                img.style.display = display;
                img.style.borderRadius = "6px";
                img.style.margin = "8px 0 0 0";
                img.style.height = "auto";
            });
        }

        function translateHost(host) {
            const hosts = {
                'walla.co.il': 'וואלה',
                'maariv.co.il': 'מעריב',
                'mako.co.il': 'מאקו',
                'rcs.mako.co.il': 'מאקו',
                'ynet.co.il': 'Ynet',
                'now14.co.il': 'ערוץ 14',
                'inn.co.il': 'ערוץ 7',
                'makorrishon.co.il': 'מקור ראשון',
                'israelhayom.co.il': 'ישראל היום',
                'askpavel.co.il': 'אסק פאבל',
                'tgspot.co.il': 'TGspot',
                'themarker.com': 'דה מרקר',
                'theverifier.co.il': 'The Verifier'
            };
            return hosts[host] || host;
        }

        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                toTopBtn.style.display = 'flex';
            } else {
                toTopBtn.style.display = 'none';
            }
        });

        toTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadRSS(false);
        });
    </script>
</body>
</html>
