<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Feed Viewer</title>
    <style>
        /* Default Dark Mode Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            direction: rtl;
            text-align: right;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #2d2d2d;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            padding: 20px;
            box-sizing: border-box;
        }

        /* Light Mode Overrides */
        body.light-mode {
            background-color: #f4f4f4;
            color: #333;
        }
        body.light-mode .container {
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .controls select, .controls button {
            font-size: 14px;
            padding: 5px;
            cursor: pointer;
        }

        .throbber {
            display: none;
            margin: 0 auto 20px;
            width: 40px;
            height: 40px;
            border: 4px solid #0066cc;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .rss-item {
            border-bottom: 1px solid #444;
            padding: 10px 0;
            text-align: right;
        }
        body.light-mode .rss-item {
            border-bottom: 1px solid #ddd;
        }

        .rss-item:last-child {
            border-bottom: none;
        }

        .rss-item h2 {
            margin: 0;
            cursor: pointer;
            color: #4da3ff;
        }
        body.light-mode .rss-item h2 {
            color: #0066cc;
        }

        .rss-item .meta {
            color: #aaa;
            margin-top: 5px;
        }
        body.light-mode .rss-item .meta {
            color: #777;
        }

        .rss-item .description {
            display: none;
            margin-top: 10px;
            font-size: 22px;
            line-height: 1.5;
        }

        .rss-item h2 a {
            color: #ff9f43;
            text-decoration: none;
            margin-right: 10px;
            font-size: 0.7em;
        }
        body.light-mode .rss-item h2 a {
            color: #e67e22;
        }

        .back-to-top {
            display: block;
            margin-top: 10px;
            text-align: center;
            color: #4da3ff;
            text-decoration: none;
            font-size: 14px;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <select id="font-size">
                <option value="normal">רגיל</option>
                <option value="big">גדול</option>
                <option value="biggest" selected>הכי גדול</option>
            </select>
            <select id="image-size">
                <option value="hide">הסתר תמונות</option>
                <option value="normal">תמונה קטנה</option>
                <option value="medium">בינוני</option>
                <option value="big">גדול</option>
            </select>
            <select id="category">
                <option value="news">חדשות</option>
                <option value="tech">טכנולוגיה</option>
                <option value="flash">מבזקים</option>
            </select>
            <button id="theme-toggle">מצב בהיר</button>
            <button id="refresh">רענן</button>
        </div>

        <div class="throbber"></div>
        <div id="rss-content"></div>
    </div>

    <script>
        const FONT_SIZE_NORMAL_TITLE = '18px';
        const FONT_SIZE_BIG_TITLE = '22px';
        const FONT_SIZE_BIGGEST_TITLE = '26px';

        const FONT_SIZE_NORMAL_DESC = '16px';
        const FONT_SIZE_BIG_DESC = '20px';
        const FONT_SIZE_BIGGEST_DESC = '24px';

        const FONT_SIZE_NORMAL_META = '12px';
        const FONT_SIZE_BIG_META = '14px';
        const FONT_SIZE_BIGGEST_META = '16px';

        const feedUrls = {
            news: [
                'https://rss.walla.co.il/feed/1?type=main',
                'https://www.maariv.co.il/Rss/RssChadashot',
                'https://rcs.mako.co.il/rss/31750a2610f26110VgnVCM1000005201000aRCRD.xml',
                'https://www.ynet.co.il/Integration/StoryRss2.xml',
                'https://www.now14.co.il/feed/',
                'https://www.inn.co.il/Rss.aspx?act=.1',
                'https://www.makorrishon.co.il/rss',
                'https://www.israelhayom.co.il/rss'
            ],
            tech: [
                'https://www.askpavel.co.il/feed',
                'https://www.tgspot.co.il/feed/',
                'https://www.maariv.co.il/Rss/RssFeedsTechnologeya',
                'https://rss.walla.co.il/feed/4703',
                'https://rss.walla.co.il/feed/6?type=main',
                'https://www.themarker.com/srv/tm-technation',
                'https://www.ynet.co.il/Integration/StoryRss544.xml',
                'https://theverifier.co.il/rss'
            ],
            flash: [
                'https://www.ynet.co.il/Integration/StoryRss1854.xml',
                'https://rss.walla.co.il/feed/22',
                'https://www.maariv.co.il/rss/rssfeedsmivzakichadashot'
            ]
        };

        // Theme Toggle Logic
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeBtn.textContent = isLight ? 'מצב כהה' : 'מצב בהיר';
        });

        // Auto Refresh (Every 10 minutes)
        setInterval(() => {
            console.log("Auto-refreshing feed...");
            loadRSS();
        }, 10 * 60 * 1000);

        document.getElementById('refresh').addEventListener('click', loadRSS);
        document.getElementById('category').addEventListener('change', loadRSS);

        function loadRSS() {
            const category = document.getElementById('category').value;
            const urls = feedUrls[category] || [];
            const rssContent = document.getElementById('rss-content');
            const throbber = document.querySelector('.throbber');
            rssContent.innerHTML = '';
            throbber.style.display = 'block';

            Promise.all(urls.map(url =>
                fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`)
                    .then(response => response.json())
                    .catch(err => ({ items: [] }))
            ))
            .then(feeds => {
                const allItems = feeds.flatMap(feed => feed.items || []);
                allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

                throbber.style.display = 'none';

                allItems.forEach(item => {
                    const rssItem = document.createElement('div');
                    rssItem.className = 'rss-item';

                    const title = document.createElement('h2');
                    title.textContent = item.title;
                    title.addEventListener('click', () => {
                        const description = rssItem.querySelector('.description');
                        const backToTopLink = rssItem.querySelector('.back-to-top');
                        const isVisible = description.style.display === 'block';

                        description.style.display = isVisible ? 'none' : 'block';
                        backToTopLink.style.display = isVisible ? 'none' : 'block';
                    });

                    const link = document.createElement('a');
                    link.href = item.link;
                    link.target = '_blank';
                    link.textContent = ' (לכתבה)';
                    title.appendChild(link);

                    const meta = document.createElement('div');
                    meta.className = 'meta';

                    const pubDate = new Date(item.pubDate);
                    const hours = String(pubDate.getHours()).padStart(2, '0');
                    const minutes = String(pubDate.getMinutes()).padStart(2, '0');

                    const host = item.link ? new URL(item.link).hostname.replace('www.', '') : 'RSS';
                    meta.textContent = `${pubDate.toLocaleDateString('he-IL')} ${hours}:${minutes} | ${host}`;

                    const description = document.createElement('p');
                    description.className = 'description';
                    description.innerHTML = item.description;

                    const backToTopLink = document.createElement('a');
                    backToTopLink.href = '#';
                    backToTopLink.className = 'back-to-top';
                    backToTopLink.textContent = '↑ חזרה למעלה';
                    backToTopLink.style.display = 'none';
                    backToTopLink.addEventListener('click', (e) => {
                        e.preventDefault();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });

                    rssItem.appendChild(title);
                    rssItem.appendChild(meta);
                    rssItem.appendChild(description);
                    rssItem.appendChild(backToTopLink);
                    rssContent.appendChild(rssItem);
                });

                adjustFontSize();
                adjustImageSize();
            })
            .catch(() => {
                throbber.style.display = 'none';
                rssContent.innerHTML = '<div class="rss-item"><h2>שגיאה בטעינת הפידים</h2></div>';
            });
        }

        document.getElementById('font-size').addEventListener('change', adjustFontSize);
        document.getElementById('image-size').addEventListener('change', adjustImageSize);

        function adjustFontSize() {
            const size = document.getElementById('font-size').value;
            let fontTitle, fontDesc, fontMeta;

            switch (size) {
                case 'big':
                    fontTitle = FONT_SIZE_BIG_TITLE; fontDesc = FONT_SIZE_BIG_DESC; fontMeta = FONT_SIZE_BIG_META;
                    break;
                case 'biggest':
                    fontTitle = FONT_SIZE_BIGGEST_TITLE; fontDesc = FONT_SIZE_BIGGEST_DESC; fontMeta = FONT_SIZE_BIGGEST_META;
                    break;
                default:
                    fontTitle = FONT_SIZE_NORMAL_TITLE; fontDesc = FONT_SIZE_NORMAL_DESC; fontMeta = FONT_SIZE_NORMAL_META;
                    break;
            }

            document.querySelectorAll('.rss-item h2').forEach(el => el.style.fontSize = fontTitle);
            document.querySelectorAll('.rss-item .description').forEach(el => el.style.fontSize = fontDesc);
            document.querySelectorAll('.rss-item .meta').forEach(el => el.style.fontSize = fontMeta);
        }

        function adjustImageSize() {
            const size = document.getElementById('image-size').value;
            let maxWidth, display;
            switch (size) {
                case 'hide': maxWidth = '0'; display = 'none'; break;
                case 'medium': maxWidth = '60%'; display = 'block'; break;
                case 'big': maxWidth = '100%'; display = 'block'; break;
                default: maxWidth = '30%'; display = 'block'; break;
            }
            document.querySelectorAll('.rss-item img').forEach(img => {
                img.style.maxWidth = maxWidth;
                img.style.display = display;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadRSS();
        });
    </script>
</body>
</html>
