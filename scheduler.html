<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>סופרים את הימים בחיוך</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Heebo', sans-serif;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f4f8;
            color: #1e293b;
        }

        .main-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
        }

        /* Countdown Card Styling */
        .flip-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1 1 0px; 
            min-width: 0;
        }

        .digit-box {
            border-radius: 8px;
            width: 100%;
            aspect-ratio: 4 / 5; 
            max-width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            overflow: hidden;
        }

        .agam-box {
            background: linear-gradient(to bottom, #3b82f6 0%, #1d4ed8 100%);
        }

        .shahaf-box {
            background: linear-gradient(to bottom, #f59e0b 0%, #c2410c 100%);
        }

        .digit-box::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            background: rgba(0,0,0,0.15);
            top: 50%;
            left: 0;
            z-index: 2;
        }

        .digit-value {
            font-size: clamp(1.1rem, 4.5vw, 2.1rem); 
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            z-index: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .label {
            font-size: clamp(0.45rem, 2.2vw, 0.65rem);
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* --- אנימציית Simple Fade --- */
        .animate-change {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        @media (max-width: 640px) {
            .countdown-row { 
                gap: 4px !important; 
                width: 100%;
                max-width: 340px;
            }
            .happy-panel {
                padding: 1rem !important;
            }
        }

        .happy-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 2px solid white;
            padding: 1.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .motivation-text {
            font-style: italic;
            color: #475569;
            min-height: 2.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.4;
        }

        /* Progress Bar Styling */
        .progress-container {
            width: 100%;
            background-color: rgba(219, 234, 254, 0.5);
            border-radius: 9999px;
            height: 10px;
            margin-top: 10px;
            overflow: hidden;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #2563eb);
            border-radius: 9999px;
            transition: width 1s ease-in-out;
            width: 0%;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="w-full max-w-lg space-y-4 sm:space-y-6 pt-4">
            
            <div class="text-center space-y-1">
                <h1 class="text-3xl sm:text-4xl font-black text-slate-800 tracking-tight">סופרים בכיף! 🥳</h1>
                <p class="text-slate-600 font-bold text-sm sm:text-base">כי כל יום שעובר לא חוזר!</p>
            </div>

            <div class="space-y-4 sm:space-y-6">
                
                <!-- Card for Agam -->
                <div class="happy-panel border-blue-50 mx-auto">
                    <div class="flex flex-col items-center gap-3">
                        <div class="text-center">
                            <h2 class="text-2xl sm:text-3xl font-black text-blue-600">אגם 🎓</h2>
                            <p class="text-blue-400 font-bold text-xs">סיום קורס: 19.03.2026</p>
                        </div>
                        
                        <div class="flex flex-row-reverse items-center justify-between w-full gap-2 countdown-row" id="agam-timer">
                            <div class="flip-card"><div class="digit-box agam-box"><span class="digit-value" id="agam-m">00</span></div><span class="label">חודשים</span></div>
                            <div class="flip-card"><div class="digit-box agam-box"><span class="digit-value" id="agam-d">00</span></div><span class="label">ימים</span></div>
                            <div class="flip-card"><div class="digit-box agam-box"><span class="digit-value" id="agam-h">00</span></div><span class="label">שעות</span></div>
                            <div class="flip-card"><div class="digit-box agam-box"><span class="digit-value" id="agam-min">00</span></div><span class="label">דקות</span></div>
                            <div class="flip-card"><div class="digit-box agam-box"><span class="digit-value" id="agam-s">00</span></div><span class="label">שניות</span></div>
                        </div>

                        <!-- Progress Bar for Agam -->
                        <div class="w-full px-2 mt-2">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] font-bold text-blue-600 uppercase">התקדמות הקורס (5 חודשים)</span>
                                <span id="agam-progress-percent" class="text-[10px] font-bold text-blue-600">0%</span>
                            </div>
                            <div class="progress-container">
                                <div id="agam-progress-bar" class="progress-bar"></div>
                            </div>
                        </div>

                        <div id="agam-motivation" class="motivation-text text-center px-2"></div>
                    </div>
                </div>

                <!-- Card for Shahaf -->
                <div class="happy-panel border-orange-50 mx-auto">
                    <div class="flex flex-col items-center gap-3">
                        <div class="text-center">
                            <h2 class="text-2xl sm:text-3xl font-black text-orange-600">שחף 🏖️</h2>
                            <p class="text-orange-400 font-bold text-xs">תאריך שחרור: 11.10.2026</p>
                        </div>
                        
                        <div class="flex flex-row-reverse items-center justify-between w-full gap-2 countdown-row" id="shahaf-timer">
                            <div class="flip-card"><div class="digit-box shahaf-box"><span class="digit-value" id="shahaf-m">00</span></div><span class="label">חודשים</span></div>
                            <div class="flip-card"><div class="digit-box shahaf-box"><span class="digit-value" id="shahaf-d">00</span></div><span class="label">ימים</span></div>
                            <div class="flip-card"><div class="digit-box shahaf-box"><span class="digit-value" id="shahaf-h">00</span></div><span class="label">שעות</span></div>
                            <div class="flip-card"><div class="digit-box shahaf-box"><span class="digit-value" id="shahaf-min">00</span></div><span class="label">דקות</span></div>
                            <div class="flip-card"><div class="digit-box shahaf-box"><span class="digit-value" id="shahaf-s">00</span></div><span class="label">שניות</span></div>
                        </div>

                        <div id="shahaf-motivation" class="motivation-text text-center px-2"></div>
                    </div>
                </div>

            </div>

            <div class="text-center text-slate-400 text-[10px] font-bold pb-4" id="debug-clock">
                --:--:--
            </div>
        </div>
    </div>

    <script>
        const agamDate = new Date('2026-03-19T00:00:00');
        // Total course duration: 5 months. Start date = March 19 minus 5 months = Oct 19, 2025
        const agamStartDate = new Date('2025-10-19T00:00:00'); 
        
        const shahafDate = new Date('2026-10-11T00:00:00');

        const agamQuotes = [
            "עוד קצת ואת שם! הידע שלך הוא הכוח שלך. 💪",
            "כל יום למידה מקרב אותך להצלחה הגדולה. 🌟",
            "הקורס הזה הוא רק ההתחלה של קריירה מדהימה! 🚀",
            "תזכרי למה התחלת, את עושה עבודה מדהימה. ✨",
            "התמדה היא המפתח לכל דלת סגורה. 🔑",
            "את בונה את העתיד שלך יום אחרי יום. 🏗️",
            "עוד מאמץ קטן וכל זה יהיה מאחורייך. 🏔️",
            "הדרך ארוכה אבל הנוף בסוף שווה הכל. 🏞️",
            "תהיי גאה בעצמך על כמה שכבר עברת! 👏",
            "הקורס קטן עלייך, את גדולה מהחיים. 💎",
            "מכל קושי את יוצאת חזקה וחכמה יותר. 🧠",
            "המטרה כבר באופק, אל תורידי את הרגל מהגז. 🏎️",
            "קפה, ריכוז, ואת כובשת את היום הזה. ☕",
            "כל שעה של השקעה תחזור אלייך פי עשרה. 📈",
            "את ההוכחה שרצון חזק מנצח הכל. 🏆",
            "תלמידה מצטיינת, אדם מדהים – את השילוב המשלים. 🎓",
            "עוד מעט תסתכלי אחורה ותחייכי על הדרך שעשית. 😊",
            "אל תפסיקי לחלום בגדול, זה מתחיל כאן. 🌌",
            "כל יום הוא הזדמנות להיות טובה יותר מאתמול. 🌈",
            "אגם, את פשוט אלופה! 👑"
        ];

        const shahafQuotes = [
            "החופש כבר מעבר לפינה, תתחילי לתכנן את הטיול! ✈️",
            "האזרחות מחכה לך בזרועות פתוחות! 🌸",
            "עוד רגע גוזרת חוגר... הסבלנות משתלמת! ✂️",
            "העולם מחכה שתכבשי אותו, עוד קצת! 🌍",
            "פז\"ם דופק, והחופש כבר דופק בדלת. 🚪",
            "מדי ב' הם זמניים, החופש הוא נצחי. 👗",
            "תדמייני את הים, את השקט, את האזרחות. 🌊",
            "את מסיימת פרק משמעותי ומתחילה את הכי טוב. 📖",
            "עוד מעט קמה מתי שבא לך, בלי שעון מעורר צבאי. ⏰",
            "את השחרור הזה כולם יזכרו, חגיגות בפתח! 🥂",
            "אין דבר שעומד בפני הרצון להשתחרר. ⛓️",
            "כל בוקר שאת קמה הוא בוקר אחד פחות במערכת. 🌞",
            "שחף, את כמעט ציפור חופשיה! 🕊️",
            "תתחילי להתרגל לבגדים צבעוניים כל יום. 🎨",
            "בקרוב ה\"כן המפקד\" יהפוך ל\"כן המלצר\". 🍔",
            "תהני מהרגעים האחרונים, הם בונים את הזיכרון. 📸",
            "היעד הסופי מעולם לא נראה קרוב יותר. 🏁",
            "תחשבי על היום הראשון של החופש הגדול באמת. 🍦",
            "את שורדת הכל, השחרור הוא הפרס שלך. 🎖️",
            "שחף, את הולכת להפציץ באזרחות! 🔥"
        ];

        function setMotivation() {
            document.getElementById('agam-motivation').innerText = agamQuotes[Math.floor(Math.random() * agamQuotes.length)];
            document.getElementById('shahaf-motivation').innerText = shahafQuotes[Math.floor(Math.random() * shahafQuotes.length)];
        }

        function formatNum(n) {
            return n.toString().padStart(2, '0');
        }

        function updateAgamProgress() {
            const now = new Date();
            const totalDuration = agamDate - agamStartDate;
            const elapsed = now - agamStartDate;
            
            let progress = (elapsed / totalDuration) * 100;
            progress = Math.min(100, Math.max(0, progress)); 
            
            document.getElementById('agam-progress-bar').style.width = progress.toFixed(1) + '%';
            document.getElementById('agam-progress-percent').innerText = Math.floor(progress) + '%';
        }

        function updateCountdown(prefix, targetDate) {
            const now = new Date();
            let diff = targetDate - now;

            if (diff <= 0) {
                const container = document.getElementById(`${prefix}-timer`);
                container.innerHTML = `<div class="text-xl font-black text-green-500 py-4 w-full text-center">הגיע הרגע הגדול! 🥂</div>`;
                return;
            }

            let tempDate = new Date(now);
            let months = 0;
            while (true) {
                let nextMonth = new Date(tempDate);
                nextMonth.setMonth(nextMonth.getMonth() + 1);
                if (nextMonth <= targetDate) {
                    tempDate = nextMonth;
                    months++;
                } else {
                    break;
                }
            }

            let diffRemaining = targetDate - tempDate;
            const days = Math.floor(diffRemaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diffRemaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diffRemaining % (1000 * 60)) / 1000);

            const values = {
                'm': formatNum(months),
                'd': formatNum(days),
                'h': formatNum(hours),
                'min': formatNum(minutes),
                's': formatNum(seconds)
            };

            for (const key in values) {
                const el = document.getElementById(`${prefix}-${key}`);
                if (el && el.innerText !== values[key]) {
                    el.innerText = values[key];
                    const parent = el.parentElement;
                    parent.classList.remove('animate-change');
                    void parent.offsetWidth; 
                    parent.classList.add('animate-change');
                }
            }
        }

        function tick() {
            updateCountdown('agam', agamDate);
            updateCountdown('shahaf', shahafDate);
            updateAgamProgress();
            
            const now = new Date();
            document.getElementById('debug-clock').innerText = now.toLocaleTimeString('he-IL');
        }

        setMotivation();
        setInterval(tick, 1000);
        tick();
    </script>
</body>
</html>
