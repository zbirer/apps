<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>סופרים את הימים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 40px 0 rgba(31, 38, 135, 0.1);
        }
        .animate-float {
            animation: float 5s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        /* Mobile specific adjustments to reduce height */
        @media (max-width: 640px) {
            .timer-text {
                font-size: 1.25rem !important;
                line-height: 1.3 !important;
            }
            .card-icon {
                width: 3rem !important;
                height: 3rem !important;
                margin-bottom: 0.5rem !important;
            }
            .card-padding {
                padding: 1rem !important;
            }
            .header-spacing {
                margin-bottom: 0.5rem !important;
            }
        }
    </style>
</head>
<body class="p-2 sm:p-6 md:p-8">

    <div class="max-w-2xl w-full space-y-3 sm:space-y-6 md:space-y-10">
        <!-- Header -->
        <div class="text-center space-y-1 sm:space-y-3 header-spacing">
            <h1 class="text-2xl sm:text-4xl md:text-6xl font-black text-slate-800 tracking-tight">סופרים את הימים 🗓️</h1>
            <p class="text-slate-500 text-sm sm:text-lg px-4">כי כל יום שעובר לא חוזר!</p>
        </div>

        <div class="grid grid-cols-1 gap-3 sm:gap-6 md:gap-8">
            
            <!-- Card for Agam -->
            <div class="glass-card rounded-2xl sm:rounded-3xl card-padding p-4 sm:p-8 flex flex-col items-center text-center transition-all duration-300 active:scale-95">
                <div class="card-icon w-12 h-12 sm:w-20 sm:h-20 bg-blue-100 rounded-xl sm:rounded-2xl flex items-center justify-center mb-2 sm:mb-6 animate-float shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-10 sm:w-10 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                    </svg>
                </div>
                <h2 class="text-lg sm:text-2xl font-bold text-slate-700 mb-0.5">אגם</h2>
                <p class="text-slate-500 text-xs sm:text-base font-medium mb-2 sm:mb-4">סיום קורס: 19.03.2026</p>
                <div id="agam-timer" class="timer-text text-xl sm:text-3xl font-black text-blue-600 leading-snug">
                    מחשב...
                </div>
            </div>

            <!-- Card for Shahaf -->
            <div class="glass-card rounded-2xl sm:rounded-3xl card-padding p-4 sm:p-8 flex flex-col items-center text-center transition-all duration-300 active:scale-95">
                <div class="card-icon w-12 h-12 sm:w-20 sm:h-20 bg-purple-100 rounded-xl sm:rounded-2xl flex items-center justify-center mb-2 sm:mb-6 animate-float shadow-inner" style="animation-delay: 1s;">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-10 sm:w-10 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </div>
                <h2 class="text-lg sm:text-2xl font-bold text-slate-700 mb-0.5">שחף</h2>
                <p class="text-slate-500 text-xs sm:text-base font-medium mb-2 sm:mb-4">תאריך שחרור: 11.10.2026</p>
                <div id="shahaf-timer" class="timer-text text-xl sm:text-3xl font-black text-purple-600 leading-snug">
                    מחשב...
                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="text-center pt-2">
            <div id="current-time" class="text-slate-400 text-xs sm:text-sm font-light"></div>
        </div>
    </div>

    <script>
        const agamDate = new Date('2026-03-19T00:00:00');
        const shahafDate = new Date('2026-10-11T00:00:00');

        function calculateCountdownData(name, targetDate) {
            const now = new Date();
            if (targetDate <= now) return "מזל טוב! הגיע הרגע! 🎉";

            let tempDate = new Date(now);
            let months = 0;

            while (true) {
                let nextMonth = new Date(tempDate);
                nextMonth.setMonth(nextMonth.getMonth() + 1);
                if (nextMonth <= targetDate) {
                    tempDate = nextMonth;
                    months++;
                } else {
                    break;
                }
            }

            const diffInMs = targetDate - tempDate;
            const remainingDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));
            
            const weeks = Math.floor(remainingDays / 7);
            const days = remainingDays % 7;

            console.log(`--- Calculation for ${name} ---`);
            console.log(`Full Months: ${months}`);
            console.log(`Full Weeks: ${weeks}`);
            console.log(`Final Days remainder: ${days}`);

            let parts = [];
            
            if (months > 0) {
                parts.push(months === 1 ? 'חודש' : `${months} חודשים`);
            }
            if (weeks > 0) {
                parts.push(weeks === 1 ? 'שבוע' : `${weeks} שבועות`);
            }
            if (days > 0 || (months === 0 && weeks === 0)) {
                parts.push(days === 1 ? 'יום' : `${days} ימים`);
            }

            let finalStr = "נשארו רק ";
            if (parts.length === 3) {
                // Removed hyphen before the last part
                finalStr += `${parts[0]}, ${parts[1]} ו ${parts[2]}`;
            } else if (parts.length === 2) {
                // Removed hyphen before the last part
                finalStr += `${parts[0]} ו ${parts[1]}`;
            } else if (parts.length === 1) {
                finalStr += parts[0];
            }

            return finalStr;
        }

        function updateTimers() {
            document.getElementById('agam-timer').innerText = calculateCountdownData('Agam', agamDate);
            document.getElementById('shahaf-timer').innerText = calculateCountdownData('Shahaf', shahafDate);
            
            const now = new Date();
            document.getElementById('current-time').innerText = `${now.toLocaleDateString('he-IL')} | ${now.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'})}`;
        }

        updateTimers();
        setInterval(updateTimers, 60000);
    </script>
</body>
</html>
