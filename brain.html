            const a = input.toLowerCase().trim();
            const b = target.toLowerCase().trim();
            if (a === b || a.includes(b) || b.includes(a)) return true;
            
            const matrix = Array(b.length + 1).fill(null).map(() => Array(a.length + 1).fill(null));
            for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
            for (let j = 0; j <= b.length; j++) matrix[j][0] = j;
            for (let j = 1; j <= b.length; j++) {
                for (let i = 1; i <= a.length; i++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[j][i] = Math.min(matrix[j][i - 1] + 1, matrix[j - 1][i] + 1, matrix[j - 1][i - 1] + cost);
                }
            }
            return matrix[b.length][a.length] <= Math.floor(b.length * 0.35);
        };

                { level: 3, text: "Drug class targeting GABA to calm anxiety?", answer: "Benzodiazepines", options: ["SSRI", "Benzodiazepines", "Opioids", "Stimulants"], correct: 1, fact: "Diazepam (Valium) is a standard medication." },
                { level: 3, text: "Protein hallmark of Parkinson's and Lewy Body?", answer: "Alpha-synuclein", options: ["Tau", "Amyloid", "Alpha-synuclein", "SOD1"], correct: 2, fact: "Entangles with other proteins in neuron bodies." },
                { level: 2, text: "Leading cause of preventable death in US?", answer: "Tobacco", options: ["Alcohol", "Opioids", "Tobacco", "Sedentary"], correct: 2, fact: "Tobacco use leads to heart disease and stroke." },
                { level: 3, text: "Drug used for heroin withdrawal treatment?", answer: "Methadone", options: ["Naloxone", "Methadone", "L-Dopa", "Ritalin"], correct: 1, fact: "Stimulates opioid receptors with limited high." }
            ],
            research: [
                { level: 1, text: "Radio waves and magnets brain mapping?", answer: "MRI", options: ["EEG", "MRI", "PET", "NIRS"], correct: 1, fact: "Maps water distribution in tissues." },
                { level: 2, text: "Magnetic pulse stimulator for PFC?", answer: "TMS", options: ["DBS", "TMS", "tDCS", "BMI"], correct: 1, fact: "Transcranial magnetic stimulation." },
                { level: 2, text: "Method using light to control neurons?", answer: "Optogenetics", options: ["TMS", "Optogenetics", "CRISPR", "fMRI"], correct: 1, fact: "Requires genetic modification." },
                { level: 3, text: "Modeling brain mathematically?", answer: "Computational Neuroscience", options: ["Neurolaw", "Computational Neuroscience", "BMI", "NIRS"], correct: 1, fact: "Tests models against biological data." },
                { level: 2, text: "Tracing radioactive blood flow?", answer: "PET", options: ["MRI", "fMRI", "EEG", "PET"], correct: 3, fact: "Detects labeled markers like oxygen." },
                { level: 3, text: "Tool measuring oxygen surface levels via laser?", answer: "NIRS", options: ["fMRI", "NIRS", "PET", "EEG"], correct: 1, fact: "Near-infrared spectroscopy is portable." },
                { level: 2, text: "Field studying financial choices?", answer: "Neuroeconomics", options: ["Math", "Neuroeconomics", "Social", "Ethics"], correct: 1, fact: "Explores risk and reward mechanisms." },
                { level: 1, text: "Gene editing tool from bacteria?", answer: "CRISPR", options: ["Lentivirus", "CRISPR", "RNAi", "DBS"], correct: 1, fact: "Clustered Regularly Interspaced Short Palindromic Repeats." },
                { level: 2, text: "Magnetic field detection imaging tool?", answer: "MEG", options: ["EEG", "MEG", "fMRI", "PET"], correct: 1, fact: "Magnetoencephalography resolution is high." },
                { level: 3, text: "Method for monitoring action via thin tubes?", answer: "Microdialysis", options: ["Mass spec", "Microdialysis", "Opto", "TMS"], correct: 1, fact: "Collects liquid outside neurons." },
                // PLUS 5 NEW
                { level: 2, text: "Technology using scalp electrodes for epilepsy?", answer: "EEG", options: ["fMRI", "PET", "EEG", "DBS"], correct: 2, fact: "Records net electrical activity of cortical cells." },
                { level: 3, text: "Tool using lasers to see living neurons in animals?", answer: "Two-photon imaging", options: ["EEG", "Two-photon imaging", "MRI", "NIRS"], correct: 1, fact: "Enables observation of neuron growth after experience." },
                { level: 2, text: "Study of organism structure mapping landmarks?", answer: "Anatomy", options: ["Physiology", "Anatomy", "Genetics", "Pharmacology"], correct: 1, fact: "In the brain, it starts with the neuron structure." },
                { level: 3, text: "Branch analyzing samples via mass spectrometry?", answer: "Mass spectrometry", options: ["MRI", "PET", "Mass spectrometry", "EEG"], correct: 2, fact: "Ionizes compounds to identify them by mass." },
                { level: 3, text: "Generic model template averaged from MRI scans?", answer: "Brain template", options: ["Brain template", "Neural grid", "fMRI map", "Cortex model"], correct: 0, fact: "Used as a baseline for predictive neuroimaging." }
            ]
        };

        const MISSION_TYPES = [
            { id: 'basics', title: 'Brain Basics', icon: 'zap', color: 'yellow' },
            { id: 'senses', title: 'Senses & perception', icon: 'eye', color: 'purple' },
            { id: 'movement', title: 'Action & Control', icon: 'activity', color: 'green' },
            { id: 'cognition', title: 'Mind & Memory', icon: 'target', color: 'rose' },
            { id: 'development', title: 'Neural Growth', icon: 'baby', color: 'blue' },
            { id: 'clinical', title: 'Clinical Suite', icon: 'stethoscope', color: 'red' },
            { id: 'research', title: 'Future Tech', icon: 'microscope', color: 'cyan' },
            { id: 'mixed', title: 'Grand Finals', icon: 'shuffle', color: 'indigo' }
        ];

        const App = () => {
            const [view, setView] = useState('menu');
            const [score, setScore] = useState(0);
            const [level, setLevel] = useState(1);
            const [currentMission, setCurrentMission] = useState(null);
            const [questions, setQuestions] = useState([]);
            const [qIdx, setQIdx] = useState(0);
            const [input, setInput] = useState('');
            const [showOptions, setShowOptions] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const xpPerLevel = 1000;
            const progress = ((score % xpPerLevel) / xpPerLevel) * 100;
            const rank = ["Cadet", "Scholar", "Researcher", "Expert", "Legend"][Math.min(level-1, 4)];

            useEffect(() => {
                const newLvl = Math.floor(score / xpPerLevel) + 1;
                if (newLvl > level) setLevel(newLvl);
            }, [score]);

            const startMission = (id) => {
                const pool = id === 'mixed' ? Object.values(DATA_BANK).flat() : DATA_BANK[id];
                setQuestions(shuffle(pool).slice(0, 10));
                setCurrentMission(MISSION_TYPES.find(m => m.id === id) || { title: 'GRAND MIXED FINALS' });
                setQIdx(0);
                setShowOptions(false);
                setFeedback(null);
                setInput('');
                setView('play');
            };

            const submit = (choiceIdx = null) => {
                if (feedback) return;
                const q = questions[qIdx];
                let isCorrect = false;

                if (choiceIdx !== null) {
                    isCorrect = choiceIdx === q.correct;
                } else {
                    isCorrect = getSimilarity(input, q.answer);
                }

                if (isCorrect) {
                    setScore(s => s + (showOptions ? 100 : 350));
                }

                setFeedback({ correct: isCorrect, fact: q.fact, answer: q.answer });
            };

            const handleNext = () => {
                if (qIdx < questions.length - 1) {
                    setQIdx(i => i + 1);
                    setInput('');
                    setShowOptions(false);
                    setFeedback(null);
                    window.scrollTo(0, 0);
                } else {
                    setView('menu');
                }
            };

            const getLevelColor = (lvl) => {
                if (lvl === 1) return "bg-green-600/30 text-green-400 border-green-500/50";
                if (lvl === 2) return "bg-blue-600/30 text-blue-400 border-blue-500/50";
                return "bg-rose-600/30 text-rose-400 border-rose-500/50";
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col pb-12">
                    
                    {/* FIXED HUD */}
                    <div className="fixed-hud p-5 shadow-2xl">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 bg-blue-600 rounded-xl shadow-lg">
                                    <Icon name="award" className="text-white" />
                                </div>
                                <div>
                                    <h1 className="font-black text-xs uppercase tracking-tight leading-none mb-1 text-white">Brain Bee <span className="text-blue-500 italic">Israel</span></h1>
                                    <p className="text-[10px] text-blue-400 font-bold uppercase tracking-widest leading-none">{rank}</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-[8px] text-slate-500 font-black uppercase mb-0.5 tracking-widest">Mastery Intel</p>
                                <p className="text-2xl font-black text-white leading-none tabular-nums">{score.toLocaleString()}</p>
                            </div>
                        </div>
                        <div className="space-y-1.5">
                            <div className="flex justify-between text-[8px] font-black uppercase text-slate-500 tracking-tighter">
                                <span>Mastery Progress</span>
                                <span>{score % xpPerLevel} / {xpPerLevel} XP</span>
                            </div>
                            <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div className="progress-fill h-full bg-blue-500 shadow-[0_0_10px_#3b82f6]" style={{ width: `${progress}%` }} />
                            </div>
                        </div>
                    </div>

                    <main className="flex-1 p-5 md:p-8">
                        {view === 'menu' && (
                            <div className="space-y-6 animate-in fade-in duration-500">
                                <div className="neuro-card p-6 rounded-[2rem] border border-white/5">
                                    <h2 className="text-xl font-black mb-3 tracking-tighter italic text-center">Elite Study Mode</h2>
                                    <p className="text-slate-400 text-xs leading-relaxed text-center">
                                        Active recall sequences extracted from <span className="text-white">Brain Facts 8th Ed</span>. 
                                        Categorized by <span className="text-blue-400 font-bold">Intel Levels</span>.
                                    </p>
                                </div>

                                <div className="space-y-3">
                                    <p className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-2">Sequences</p>
                                    {MISSION_TYPES.map(m => (
                                        <button key={m.id} onClick={() => startMission(m.id)} className="w-full flex items-center gap-4 bg-slate-900/40 border border-white/10 p-5 rounded-2xl hover:border-blue-500/30 active:scale-[0.98] text-left transition-all">
                                            <div className={`p-3 rounded-2xl bg-slate-950 text-${m.color}-500 shadow-inner`}>
                                                <Icon name={m.icon} />
                                            </div>
                                            <div className="flex-1">
                                                <h3 className="text-xs font-black uppercase tracking-tight text-slate-100">{m.title}</h3>
                                                <p className="text-[9px] text-slate-500 font-medium italic">Verified Granularity Packs</p>
                                            </div>
                                            <Icon name="chevron-right" className="text-slate-700" />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'play' && (
                            <div className="animate-in zoom-in-95 duration-500 pb-20">
                                <div className="flex justify-between items-center mb-6">
                                    <button onClick={() => setView('menu')} className="text-slate-500 text-[10px] font-black uppercase tracking-widest hover:text-red-400 transition-colors">Abort</button>
                                    <div className="flex gap-2">
                                        <span className="px-3 py-1 bg-blue-600/10 rounded-lg border border-blue-500/20 text-[9px] font-black text-blue-400 uppercase tracking-widest truncate max-w-[120px]">{currentMission.title}</span>
                                        <span className="px-3 py-1 bg-slate-900 rounded-lg border border-white/5 text-[9px] font-black text-slate-500 uppercase">Unit {qIdx+1}/10</span>
                                    </div>
                                </div>

                                <div className="bg-[#0b0f1a] border border-white/5 rounded-[2.5rem] overflow-hidden shadow-2xl p-8 sm:p-12 relative">
                                    <div className="flex items-center justify-between mb-10">
                                        <div className="flex items-center gap-2">
                                            <span className="h-1.5 w-1.5 bg-blue-500 rounded-full animate-pulse"></span>
                                            <span className="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em]">Signal Active</span>
                                        </div>
                                        <div className={`level-badge border ${getLevelColor(questions[qIdx].level)}`}>
                                            INTEL LVL {questions[qIdx].level}
                                        </div>
                                    </div>

                                    <h2 className="text-2xl sm:text-3xl font-black leading-tight text-white italic mb-12 tracking-tight">
                                        {questions[qIdx].text}
                                    </h2>

                                    {!feedback && (
                                        <div className="space-y-6">
                                            {!showOptions ? (
                                                <div className="space-y-6">
                                                    <div className="relative">
                                                        <input 
                                                            type="text" autoFocus value={input} 
                                                            onChange={e => setInput(e.target.value)} 
                                                            onKeyDown={e => e.key === 'Enter' && input.length > 0 && submit()} 
                                                            placeholder="Enter Nomenclature..." 
                                                            className="w-full bg-slate-900/50 border-2 border-slate-800 p-6 rounded-2xl outline-none focus:border-blue-500 font-bold text-lg input-active transition-all" 
                                                        />
                                                        {input.length > 0 && (
                                                            <button onClick={() => submit()} className="absolute right-3 top-3 bottom-3 aspect-square bg-blue-600 rounded-xl flex items-center justify-center hover:bg-blue-500 transition-all active:scale-90 shadow-lg"><Icon name="send" className="text-white" /></button>
                                                        )}
                                                    </div>
                                                    <button onClick={() => setShowOptions(true)} className="w-full py-4 text-[10px] font-black text-slate-500 uppercase tracking-widest hover:text-blue-400 transition-all bg-slate-900/20 rounded-xl border border-white/5 flex items-center justify-center gap-2">
                                                        <Icon name="help-circle" /> Stuck? Reveal choices (150 XP)
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-1 gap-3 animate-in slide-in-from-bottom-2">
                                                    {questions[qIdx].options.map((opt, i) => (
                                                        <button key={i} onClick={() => submit(i)} className="w-full p-5 rounded-2xl text-left text-sm font-bold border-2 border-slate-800 bg-slate-900/40 hover:border-blue-500/50 active:scale-[0.98] transition-all">
                                                            {opt}
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {feedback && (
                                        <div className="mt-10 pt-10 border-t border-white/5 animate-in slide-in-from-bottom-4 duration-500">
                                            <div className="flex gap-5 mb-8">
                                                <div className={`p-4 h-fit rounded-2xl shadow-xl ${feedback.correct ? 'bg-green-500/20 text-green-500' : 'bg-red-500/20 text-red-500'}`}>
                                                    <Icon name={feedback.correct ? 'check-circle' : 'alert-triangle'} className="w-8 h-8" />
                                                </div>
                                                <div className="flex-1">
                                                    <p className={`text-xl font-black uppercase tracking-tight mb-2 ${feedback.correct ? 'text-green-400' : 'text-red-400'}`}>
                                                        {feedback.correct ? 'Verified Intel' : 'Sync Error'}
                                                    </p>
                                                    {!feedback.correct && (
                                                        <p className="text-[10px] text-slate-500 uppercase font-black tracking-widest mb-2 italic text-white bg-red-900/30 inline-block px-2 rounded">Target: <span className="text-white italic bg-slate-800 px-2 py-0.5 rounded ml-1">{feedback.answer}</span></p>
                                                    )}
                                                    <p className="text-[10px] font-black text-slate-500 uppercase">
                                                        Intel Reward: <span className="text-blue-400">+{feedback.correct ? (showOptions ? 150 : 350) : 0}</span>
                                                    </p>
                                                </div>
                                            </div>
                                            
                                            <div className="bg-black/50 p-6 rounded-3xl border border-white/5 mb-10 shadow-inner">
                                                <p className="text-slate-300 text-xs sm:text-base leading-relaxed font-medium italic">
                                                    <span className="text-blue-500 font-black not-italic mr-3 tracking-widest text-[9px] uppercase underline underline-offset-4">Lab_Note_Ref:</span>
                                                    "{feedback.fact}"
                                                </p>
                                            </div>

                                            <button onClick={handleNext} className="w-full bg-white text-black py-5 rounded-3xl font-black text-[11px] tracking-[0.2em] uppercase active:scale-95 transition-all shadow-2xl hover:bg-blue-600 hover:text-white">
                                                Next Sequence <Icon name="chevron-right" className="inline ml-1 w-4 h-4" />
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* AMBIENT FOOTER */}
                    <footer className="fixed bottom-0 left-0 w-full p-4 flex justify-between items-center opacity-40 px-10 pointer-events-none bg-black/20 backdrop-blur-sm">
                        <div className="text-[8px] font-black uppercase tracking-widest flex items-center gap-2"><Icon name="cpu" size={10} /> Neural_Net v10.5</div>
                        <div className="text-[8px] font-black uppercase tracking-widest flex items-center gap-2">Data_Source: Brain Facts 8th Ed</div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
