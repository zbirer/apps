        const getSimilarity = (input, target) => {
            const a = input.toLowerCase().trim();
            const b = target.toLowerCase().trim();
            if (a === b || a.includes(b) || b.includes(a)) return true;
            
            const matrix = Array(b.length + 1).fill(null).map(() => Array(a.length + 1).fill(null));
            for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
            for (let j = 0; j <= b.length; j++) matrix[j][0] = j;
            for (let j = 1; j <= b.length; j++) {
                for (let i = 1; i <= a.length; i++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[j][i] = Math.min(matrix[j][i - 1] + 1, matrix[j - 1][i] + 1, matrix[j - 1][i - 1] + cost);
                }
            }
            const sim = matrix[b.length][a.length] <= Math.floor(b.length * 0.35);
            if (sim && a !== b) log(`Fuzzy Match: Input "${a}" matched Target "${b}"`);
            return sim;
        };

                if (user && db) {
                    const userDoc = db.doc(`artifacts/${appId}/users/${user.uid}/profile/userData`);
                    await userDoc.set({ score: 0, level: 1 });
                }
                setScore(0);
                setLevel(1);
                setShowResetConfirm(false);
                setView('menu');
            };

            const startMission = (id) => {
                log(`Sequence ${id} selected. Shuffling data units...`);
                const pool = id === 'mixed' ? Object.values(DATA_BANK).flat() : DATA_BANK[id];
                setQuestions(shuffle(pool).slice(0, 10));
                setCurrentMission(MISSION_TYPES.find(m => m.id === id) || { title: 'GRAND MIXED FINALS' });
                setQIdx(0);
                setShowOptions(false);
                setFeedback(null);
                setInput('');
                setView('play');
            };

            const submit = (choiceIdx = null) => {
                if (feedback) return;
                const q = questions[qIdx];
                let isCorrect = false;

                if (choiceIdx !== null) {
                    isCorrect = choiceIdx === q.correct;
                    log(`Mode: Multiple Choice. Result: ${isCorrect}`);
                } else {
                    isCorrect = getSimilarity(input, q.answer);
                    log(`Mode: Open Recall. Result: ${isCorrect}`);
                }

                if (isCorrect) {
                    const gain = showOptions ? 100 : 350;
                    const newScore = score + gain;
                    const newLvl = Math.floor(newScore / xpPerLevel) + 1;
                    setScore(newScore);
                    saveProgress(newScore, newLvl);
                }
                setFeedback({ correct: isCorrect, fact: q.fact, answer: q.answer });
            };

            const handleNext = () => {
                if (qIdx < questions.length - 1) {
                    setQIdx(qIdx + 1);
                    setInput('');
                    setShowOptions(false);
                    setFeedback(null);
                    window.scrollTo(0, 0);
                } else {
                    log("Final unit reached. Returning to Terminal.");
                    setView('menu');
                }
            };

            const getLevelColor = (lvl) => {
                if (lvl === 1) return "bg-green-600/30 text-green-400 border-green-500/50";
                if (lvl === 2) return "bg-blue-600/30 text-blue-400 border-blue-500/50";
                return "bg-rose-600/30 text-rose-400 border-rose-500/50";
            };

            if (loadingData) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#020408]">
                        <div className="flex flex-col items-center gap-4 text-center">
                            <Icon name="loader" className="w-10 h-10 text-blue-500 animate-spin" />
                            <p className="text-[10px] font-black uppercase tracking-widest text-slate-500 italic">Accessing Neural Database...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col pb-12">
                    <div className="fixed-hud p-5 shadow-2xl">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 bg-blue-600 rounded-xl shadow-lg">
                                    <Icon name="award" className="text-white" />
                                </div>
                                <div>
                                    <h1 className="font-black text-xs uppercase tracking-tight leading-none mb-1 text-white">Brain Bee <span className="text-blue-500 italic">Israel</span></h1>
                                    <p className="text-[10px] text-blue-400 font-bold uppercase tracking-widest leading-none">{rank}</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-[8px] text-slate-500 font-black uppercase mb-0.5 tracking-widest">Mastery Intel</p>
                                <p className="text-2xl font-black text-white leading-none tabular-nums">{score.toLocaleString()}</p>
                            </div>
                        </div>
                        <div className="space-y-1.5">
                            <div className="flex justify-between text-[8px] font-black uppercase text-slate-500 tracking-tighter">
                                <span>Clearance Progress</span>
                                <span>{score % xpPerLevel} / {xpPerLevel} XP</span>
                            </div>
                            <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div className="progress-fill h-full bg-blue-500 shadow-[0_0_10px_#3b82f6]" style={{ width: `${progress}%` }} />
                            </div>
                        </div>
                    </div>

                    <main className="flex-1 p-5 md:p-8">
                        {view === 'menu' && (
                            <div className="space-y-6 animate-in fade-in duration-500">
                                <div className="neuro-card p-6 rounded-[2rem] border border-white/5">
                                    <h2 className="text-xl font-black mb-3 tracking-tighter italic">Terminal Synchronized.</h2>
                                    <p className="text-slate-400 text-xs leading-relaxed">
                                        Data units Categorized by <span className="text-blue-400 font-bold uppercase tracking-widest text-[9px]">Intel Levels</span>. 
                                        Manual input grants <span className="text-yellow-500 font-bold">350 XP</span> reward.
                                    </p>
                                </div>
                                <div className="space-y-3">
                                    <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-2">Available Sequences</p>
                                    {MISSION_TYPES.map(m => (
                                        <button key={m.id} onClick={() => startMission(m.id)} className="w-full flex items-center gap-4 bg-slate-900/40 border border-white/10 p-5 rounded-2xl hover:border-blue-500/30 active:scale-[0.98] text-left transition-all">
                                            <div className={`p-3 rounded-2xl bg-slate-950 text-${m.color}-500 shadow-inner`}>
                                                <Icon name={m.icon} />
                                            </div>
                                            <div className="flex-1">
                                                <h3 className="text-xs font-black uppercase tracking-tight text-slate-100">{m.title}</h3>
                                                <p className="text-[9px] text-slate-500 font-medium italic">Intel Pack Loaded</p>
                                            </div>
                                            <Icon name="chevron-right" className="text-slate-700" />
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setShowResetConfirm(true)} className="w-full py-4 text-[9px] font-black text-red-500/60 uppercase tracking-[0.2em] hover:text-red-500 transition-colors mt-8">Reset Neural Progress</button>
                            </div>
                        )}

                        {view === 'play' && (
                            <div className="animate-in zoom-in-95 duration-500 pb-20">
                                <div className="flex justify-between items-center mb-6">
                                    <button onClick={() => setView('menu')} className="text-slate-500 text-[10px] font-black uppercase tracking-widest hover:text-red-400 transition-colors italic">Abort Signal</button>
                                    <div className="flex gap-2">
                                        <span className="px-3 py-1 bg-blue-600/10 rounded-lg border border-blue-500/20 text-[9px] font-black text-blue-400 uppercase tracking-widest truncate max-w-[120px]">{currentMission.title}</span>
                                        <span className="px-3 py-1 bg-slate-900 rounded-lg border border-white/5 text-[9px] font-black text-slate-500 uppercase">Unit {qIdx+1}/10</span>
                                    </div>
                                </div>

                                <div className="bg-[#0b0f1a] border border-white/5 rounded-[2.5rem] overflow-hidden shadow-2xl p-8 sm:p-12 relative">
                                    <div className="flex items-center justify-between mb-10 text-slate-500">
                                        <div className="flex items-center gap-2">
                                            <span className="h-1.5 w-1.5 bg-blue-500 rounded-full animate-pulse shadow-[0_0_8px_#3b82f6]"></span>
                                            <span className="text-[10px] font-black uppercase tracking-[0.3em]">Signal Active</span>
                                        </div>
                                        <div className={`level-badge border ${getLevelColor(questions[qIdx].level)}`}>INTEL LVL {questions[qIdx].level}</div>
                                    </div>

                                    <h2 className="text-2xl sm:text-3xl font-black leading-tight text-white italic mb-12 tracking-tight">{questions[qIdx].text}</h2>

                                    {!feedback && (
                                        <div className="space-y-6">
                                            {!showOptions ? (
                                                <div className="space-y-6">
                                                    <div className="relative">
                                                        <input type="text" autoFocus value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && input.length > 0 && submit()} placeholder="Type Nomenclature..." className="w-full bg-slate-900/50 border-2 border-slate-800 p-6 rounded-2xl outline-none focus:border-blue-500 font-bold text-lg input-active transition-all" />
                                                        {input.length > 0 && (
                                                            <button onClick={() => submit()} className="absolute right-3 top-3 bottom-3 aspect-square bg-blue-600 hover:bg-blue-500 rounded-xl flex items-center justify-center transition-all active:scale-90 shadow-lg"><Icon name="send" className="text-white" /></button>
                                                        )}
                                                    </div>
                                                    <button onClick={() => setShowOptions(true)} className="w-full py-4 text-[10px] font-black text-slate-500 uppercase tracking-widest hover:text-blue-400 transition-all bg-slate-900/20 rounded-xl border border-white/5 flex items-center justify-center gap-2">
                                                        <Icon name="help-circle" /> Use Multiple Choice (150 XP)
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-1 gap-3 animate-in slide-in-from-bottom-2">
                                                    {questions[qIdx].options.map((opt, i) => (
                                                        <button key={i} onClick={() => submit(i)} className="w-full p-5 rounded-2xl text-left text-sm font-bold border-2 border-slate-800 bg-slate-900/40 hover:border-blue-500/50 active:scale-[0.98] transition-all italic">{opt}</button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {feedback && (
                                        <div className="mt-10 pt-10 border-t border-white/5 animate-in slide-in-from-bottom-4 duration-500">
                                            <div className="flex gap-5 mb-8">
                                                <div className={`p-4 h-fit rounded-2xl shadow-xl ${feedback.correct ? 'bg-green-500/20 text-green-500' : 'bg-red-500/20 text-red-500'}`}>
                                                    <Icon name={feedback.correct ? 'check-circle' : 'alert-triangle'} className="w-8 h-8" />
                                                </div>
                                                <div className="flex-1">
                                                    <p className={`text-xl font-black uppercase tracking-tight mb-2 ${feedback.correct ? 'text-green-400' : 'text-red-400'}`}>{feedback.correct ? 'Verified Intel' : 'Sync Error'}</p>
                                                    {!feedback.correct && <p className="text-[10px] text-slate-500 uppercase font-black tracking-widest mb-2 italic text-white bg-red-900/30 inline-block px-2 rounded">Target Data: {feedback.answer}</p>}
                                                    <p className="text-[10px] font-black text-slate-500 uppercase">Intel Reward: <span className="text-blue-400">+{feedback.correct ? (showOptions ? 100 : 350) : 0}</span></p>
                                                </div>
                                            </div>
                                            <div className="bg-black/50 p-6 rounded-3xl border border-white/5 mb-10 shadow-inner">
                                                <p className="text-slate-300 text-xs sm:text-base leading-relaxed font-medium italic">
                                                    <span className="text-blue-500 font-black not-italic mr-3 tracking-widest text-[9px] uppercase underline underline-offset-4">Ref_Note:</span>
                                                    "{feedback.fact}"
                                                </p>
                                            </div>
                                            <button onClick={handleNext} className="w-full bg-white text-black py-5 rounded-3xl font-black text-[11px] tracking-[0.2em] uppercase active:scale-95 transition-all shadow-2xl hover:bg-blue-600 hover:text-white">Synchronize Next <Icon name="chevron-right" className="inline ml-1 w-4 h-4" /></button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {showResetConfirm && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-6 modal-overlay animate-in fade-in duration-300">
                            <div className="bg-[#0b0f1a] border border-red-500/30 p-8 rounded-[2rem] w-full max-w-xs shadow-2xl">
                                <h3 className="text-lg font-black uppercase text-red-500 mb-4 tracking-tighter">Wipe Neural Progress?</h3>
                                <p className="text-slate-400 text-xs leading-relaxed mb-8">This will permanently delete your score and levels. This action is irreversible.</p>
                                <div className="flex flex-col gap-3">
                                    <button onClick={resetProgress} className="w-full bg-red-600 py-4 rounded-xl font-black text-[10px] uppercase tracking-widest text-white shadow-lg active:scale-95 transition-all">Confirm Wipe</button>
                                    <button onClick={() => setShowResetConfirm(false)} className="w-full bg-slate-900 py-4 rounded-xl font-black text-[10px] uppercase tracking-widest text-slate-500 border border-white/5 active:scale-95 transition-all">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="fixed bottom-0 left-0 w-full p-4 flex justify-between items-center opacity-40 px-10 pointer-events-none bg-black/20 backdrop-blur-sm">
                        <div className="text-[8px] font-black uppercase tracking-widest flex items-center gap-2"><Icon name="cpu" size={10} /> Neural_Net v11.3</div>
                        <div className="text-[8px] font-black uppercase tracking-widest flex items-center gap-2">Source: Brain Facts 8th Ed</div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
