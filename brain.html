                { text: "Inflammatory myelin attack in CNS?", answer: "Multiple Sclerosis", options: ["ALS", "Multiple Sclerosis", "Parkinson's", "AD"], correct: 1, fact: "Patches of scar tissue are called sclerosis." },
                { text: "Losing touch with reality and delusions?", answer: "Schizophrenia", options: ["Panic", "PTSD", "Schizophrenia", "ADHD"], correct: 2, fact: "Usually appears between ages 15 and 25." },
                { text: "Most common primary brain tumor?", answer: "Meningioma", options: ["Glioblastoma", "Meningioma", "Glioma", "Astroblastoma"], correct: 1, fact: "A benign tumor in the meninges." },
                { text: "Harrowing event psychiatric trigger?", answer: "PTSD", options: ["OCD", "PTSD", "Depression", "Bipolar"], correct: 1, fact: "HALLMARK: Flashbacks, nightmares, hyperarousal." },
                { text: "Mood swings between extreme highs and lows?", answer: "Bipolar disorder", options: ["Major depression", "Bipolar disorder", "Panic", "OCD"], correct: 1, fact: "Episodes last from hours to months." },
                { text: "Leading cause of preventable deaths in US?", answer: "Tobacco", options: ["Alcohol", "Opioids", "Tobacco", "Marijuana"], correct: 2, fact: "About 20 percent of Americans still smoke." },
                { text: "Most common learning disability?", answer: "Dyslexia", options: ["Autism", "Dyslexia", "ADHD", "Down"], correct: 1, fact: "Difficulty with reading despite normal intelligence." },
                { text: "Irregular activity in brain cells for 5+ mins?", answer: "Epilepsy", options: ["Stroke", "Epilepsy", "Aphasia", "Atonia"], correct: 1, fact: "Seizures result from irregular electrical activity." },
                { text: "Brain shrinkage seen in advanced AIDS?", answer: "HAND", options: ["ALS", "HAND", "MS", "CTE"], correct: 1, fact: "HIV-associated neurocognitive disorders." },
                { text: "Progressive degeneration from repeated head trauma?", answer: "CTE", options: ["CTE", "TBI", "HAND", "SCI"], correct: 0, fact: "Chronic Traumatic Encephalopathy seen in athletes." },
                { text: "Gene associated with early Alzheimer's risk?", answer: "APOE", options: ["HTT", "SOD1", "APOE", "FOXP2"], correct: 2, fact: "ApoE4 variant is a major genetic risk factor." },
                { text: "Hormone often elevated in major depression?", answer: "Cortisol", options: ["Melatonin", "Cortisol", "Leptin", "Insulin"], correct: 1, fact: "Disrupts the hypothalamus-pituitary axis." }
            ],
            research: [
                { text: "Radio waves and magnets brain mapping tool?", answer: "MRI", options: ["EEG", "PET", "MRI", "NIRS"], correct: 2, fact: "Maps water distribution in tissues." },
                { text: "Light flashes controlling modified neurons?", answer: "Optogenetics", options: ["TMS", "Optogenetics", "CRISPR", "fMRI"], correct: 1, fact: "Allows millisecond-scale circuit control." },
                { text: "Precise gene editing tool from bacteria?", answer: "CRISPR", options: ["Lentivirus", "CRISPR", "RNAi", "DBS"], correct: 1, fact: "Derived from a bacterial immune system." },
                { text: "Measuring net electrical charge of cortical cells?", answer: "EEG", options: ["fMRI", "EEG", "PET", "MRI"], correct: 1, fact: "Electroencephalography uses sensors on the scalp." },
                { text: "Imaging magnetic fields from electrical currents?", answer: "MEG", options: ["EEG", "MEG", "fMRI", "PET"], correct: 1, fact: "Magnetoencephalography has millisecond resolution." },
                { text: "Focused electrical treatment for Parkinson's?", answer: "Deep Brain Stimulation", options: ["DBS", "TMS", "MRI", "EEG"], correct: 0, fact: "Implanted electrodes send electrical currents." },
                { text: "Tracing blood flow via radioactive markers?", answer: "PET", options: ["MRI", "fMRI", "EEG", "PET"], correct: 3, fact: "Positron emission tomography detects radioactive tracers." },
                { text: "Measuring oxygen levels near surface via laser?", answer: "NIRS", options: ["fMRI", "NIRS", "PET", "EEG"], correct: 1, fact: "Near-infrared spectroscopy is portable and cheap." },
                { text: "Magnetic field focused on the cortex?", answer: "TMS", options: ["DBS", "TMS", "tDCS", "BMI"], correct: 1, fact: "Transcranial magnetic stimulation treats depression." },
                { text: "Modeling the brain mathematically?", answer: "Computational Neuroscience", options: ["Neurolaw", "Neuroethics", "Computational Neuroscience", "BMI"], correct: 2, fact: "Tests theories against real-world biological data." },
                { text: "Field studying financial choices in the brain?", answer: "Neuroeconomics", options: ["Math Neuro", "Neuroeconomics", "Social Neuro", "Bio-finance"], correct: 1, fact: "Explores risk, reward, and the insular cortex." },
                { text: "Interface bypassing paralysis via thought?", answer: "Brain-Machine Interface", options: ["BMI", "DBS", "TMS", "PET"], correct: 0, fact: "Translates behavioral intent to robotic/computer action." },
                { text: "Bypassing blood-brain barrier via engineering?", answer: "Nanoparticles", options: ["Nanoparticles", "Vesicles", "Microglia", "Ions"], correct: 0, fact: "Tiny particles shuttle drugs into the fortress-like brain." },
                { text: "Method able to record human activity without holes?", answer: "EEG", options: ["Electrophysiology", "EEG", "DBS", "Microdialysis"], correct: 1, fact: "Non-invasive and widely used for sleep studies." },
                { text: "Study of how cells form tissues?", answer: "Histology", options: ["Histology", "Physiology", "Genomics", "Anatomy"], correct: 0, fact: "Uses thin slices and chemical stains." },
                { text: "Analysis identifying DNA copy repeats?", answer: "Microarrays", options: ["Mass spectrometry", "Microarrays", "PET", "NIRS"], correct: 1, fact: "Used to detect chromosomal translocations." },
                { text: "Tool ionizing compounds to find mass?", answer: "Mass spectrometry", options: ["Mass spectrometry", "MRI", "PET", "EEG"], correct: 0, fact: "Helps identify molecules in samples like CSF." },
                { text: "Targeting DNA segments with RNA-guided enzymes?", answer: "CRISPR", options: ["CRISPR", "Viral vectors", "Lentivirus", "PET"], correct: 0, fact: "Repairing toxic protein aggregates in HD models." },
                { text: "Generic model of healthy brain imaging?", answer: "Brain template", options: ["Brain map", "Brain template", "Neural grid", "fMRI model"], correct: 1, fact: "Used as baseline for predictive neuroimaging." },
                { text: "Branch dedicated to identifying new drugs?", answer: "Pharmacology", options: ["Genomics", "Pharmacology", "Anatomy", "Pathology"], correct: 1, fact: "Focuses on drug effects and mechanisms." }
            ]
        };

        const MISSION_TYPES = [
            { id: 'basics', title: 'Brain Basics', icon: 'zap', color: 'yellow' },
            { id: 'senses', title: 'Senses & Motion', icon: 'eye', color: 'purple' },
            { id: 'movement', title: 'Control & Action', icon: 'activity', color: 'green' },
            { id: 'cognition', title: 'Mind & Memory', icon: 'target', color: 'rose' },
            { id: 'development', title: 'Neural Growth', icon: 'baby', color: 'blue' },
            { id: 'clinical', title: 'Neuropathology', icon: 'stethoscope', color: 'red' },
            { id: 'research', title: 'Future Tech', icon: 'microscope', color: 'cyan' },
            { id: 'mixed', title: 'Grand Finals', icon: 'shuffle', color: 'indigo' }
        ];

        const ACHIEVEMENTS = [
            { id: 'active', name: 'Intel Elite', desc: 'Recall without help.', icon: 'shield-check' },
            { id: 'legend', name: 'Neuro Legend', desc: 'Lvl 5 reached.', icon: 'trophy' },
            { id: 'perfect', name: 'Perfect Sync', desc: '100% mission accuracy.', icon: 'check-circle' }
        ];

        const App = () => {
            const [view, setView] = useState('menu');
            const [score, setScore] = useState(0);
            const [level, setLevel] = useState(1);
            const [unlocked, setUnlocked] = useState([]);
            const [currentMission, setCurrentMission] = useState(null);
            const [questions, setQuestions] = useState([]);
            const [qIdx, setQIdx] = useState(0);
            const [input, setInput] = useState('');
            const [showOptions, setShowOptions] = useState(false);
            const [feedback, setFeedback] = useState(null);
            const [perfectRun, setPerfectRun] = useState(true);

            const xpPerLevel = 1000;
            const progress = ((score % xpPerLevel) / xpPerLevel) * 100;
            const rank = ["Cadet", "Scholar", "Researcher", "Specialist", "Legend"][Math.min(level-1, 4)];

            useEffect(() => {
                const newLvl = Math.floor(score / xpPerLevel) + 1;
                if (newLvl > level) setLevel(newLvl);
                if (newLvl >= 5) triggerUnlock('legend');
            }, [score]);

            const triggerUnlock = (id) => {
                if (!unlocked.includes(id)) setUnlocked(prev => [...prev, id]);
            };

            const startMission = (id) => {
                const pool = id === 'mixed' ? Object.values(DATA_BANK).flat() : DATA_BANK[id];
                // Select 10 random questions
                setQuestions(shuffle(pool).slice(0, 10));
                setCurrentMission(MISSION_TYPES.find(m => m.id === id) || { title: 'GRAND MIXED FINALS' });
                setIdx(0);
                setPerfectRun(true);
                setShowOptions(false);
                setFeedback(null);
                setInput('');
                setView('play');
            };

            const setIdx = (v) => setQIdx(v);

            const submit = (choiceIdx = null) => {
                if (feedback) return;
                const q = questions[qIdx];
                let isCorrect = false;

                if (choiceIdx !== null) {
                    isCorrect = choiceIdx === q.correct;
                } else {
                    isCorrect = getSimilarity(input, q.answer);
                }

                if (isCorrect) {
                    const points = showOptions ? 100 : 250;
                    setScore(s => s + points);
                    if (!showOptions) triggerUnlock('active');
                } else {
                    setPerfectRun(false);
                }
                setFeedback({ correct: isCorrect, fact: q.fact, answer: q.answer });
            };

            const handleNext = () => {
                if (qIdx < questions.length - 1) {
                    setQIdx(i => i + 1);
                    setInput('');
                    setShowOptions(false);
                    setFeedback(null);
                    window.scrollTo(0, 0);
                } else {
                    if (perfectRun) triggerUnlock('perfect');
                    setView('menu');
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col pb-12">
                    
                    {/* FIXED HUD */}
                    <div className="fixed-hud p-5 shadow-2xl">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 bg-blue-600 rounded-xl shadow-lg shadow-blue-500/20">
                                    <Icon name="award" className="text-white" />
                                </div>
                                <div>
                                    <h1 className="font-black text-xs uppercase tracking-tight leading-none mb-1 text-white">Brain Bee <span className="text-blue-500 italic">Israel</span></h1>
                                    <p className="text-[10px] text-blue-400 font-bold uppercase tracking-widest leading-none">{rank}</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-[8px] text-slate-500 font-black uppercase mb-0.5 tracking-widest">Mastery Intel</p>
                                <p className="text-2xl font-black text-white leading-none tabular-nums">{score.toLocaleString()}</p>
                            </div>
                        </div>
                        <div className="space-y-1.5">
                            <div className="flex justify-between text-[8px] font-black uppercase text-slate-500 tracking-tighter">
                                <span>Mastery Progress</span>
                                <span>{score % xpPerLevel} / {xpPerLevel} XP</span>
                            </div>
                            <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div className="progress-fill h-full bg-blue-500 shadow-[0_0_10px_#3b82f6]" style={{ width: `${progress}%` }} />
                            </div>
                        </div>
                    </div>

                    <main className="flex-1 p-5 md:p-8">
                        {view === 'menu' && (
                            <div className="space-y-6 animate-in fade-in duration-500">
                                <div className="neuro-card p-6 rounded-[2rem] border border-white/5">
                                    <div className="flex justify-between items-start mb-4">
                                        <h2 className="text-xl font-black tracking-tighter italic">Research Terminal Alpha.</h2>
                                        <button onClick={() => setView('rewards')} className="p-2 bg-slate-900 rounded-xl border border-white/5 text-yellow-500"><Icon name="medal"/></button>
                                    </div>
                                    <p className="text-slate-400 text-xs leading-relaxed">
                                        Intel synced with <span className="text-white font-bold">Brain Facts 8th Ed</span>. 
                                        Recall units for <span className="text-yellow-500">250 XP</span>.
                                    </p>
                                </div>

                                <div className="space-y-3">
                                    <p className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-2">Sequences</p>
                                    {MISSION_TYPES.map(m => (
                                        <button key={m.id} onClick={() => startMission(m.id)} className="w-full flex items-center gap-4 bg-slate-900/40 border border-white/10 p-5 rounded-2xl hover:border-blue-500/30 active:scale-[0.98] text-left transition-all">
                                            <div className={`p-3 rounded-2xl bg-slate-950 text-${m.color}-500 shadow-inner`}>
                                                <Icon name={m.icon} />
                                            </div>
                                            <div className="flex-1">
                                                <h3 className="text-xs font-black uppercase tracking-tight text-slate-100">{m.title}</h3>
                                                <p className="text-[9px] text-slate-500 font-medium italic">Verified Data Pack</p>
                                            </div>
                                            <Icon name="chevron-right" className="text-slate-700" />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'rewards' && (
                            <div className="animate-in slide-in-from-right-4 duration-500 pb-12">
                                <button onClick={() => setView('menu')} className="text-slate-500 text-[9px] font-black uppercase tracking-widest flex items-center gap-2 mb-8 hover:text-white">
                                    <Icon name="chevron-left" /> Back
                                </button>
                                <div className="neuro-card p-6 rounded-[2.5rem]">
                                    <h2 className="text-[10px] font-black uppercase tracking-[0.4em] text-blue-500 mb-8 border-b border-white/5 pb-5 text-center">Achievements</h2>
                                    <div className="space-y-4">
                                        {ACHIEVEMENTS.map(a => {
                                            const has = unlocked.includes(a.id);
                                            return (
                                                <div key={a.id} className={`flex items-center gap-5 p-5 rounded-3xl border transition-all ${has ? 'bg-blue-600/5 border-blue-500/20' : 'bg-slate-950/50 border-white/5 opacity-40'}`}>
                                                    <div className={`p-3.5 rounded-2xl ${has ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-800 text-slate-600'}`}>
                                                        <Icon name={has ? a.icon : 'lock'} />
                                                    </div>
                                                    <div className="flex-1">
                                                        <p className="text-xs font-black uppercase text-white mb-1">{a.name}</p>
                                                        <p className="text-[10px] text-slate-500 font-medium leading-tight">{a.desc}</p>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'play' && (
                            <div className="animate-in zoom-in-95 duration-500">
                                <div className="flex justify-between items-center mb-6">
                                    <button onClick={() => setView('menu')} className="text-slate-500 text-[10px] font-black uppercase tracking-widest hover:text-red-400 transition-colors">Abort</button>
                                    <div className="flex gap-2">
                                        <span className="px-3 py-1 bg-blue-600/10 rounded-lg border border-blue-500/20 text-[9px] font-black text-blue-400 uppercase tracking-widest truncate max-w-[120px]">{currentMission.title}</span>
                                        <span className="px-3 py-1 bg-slate-900 rounded-lg border border-white/5 text-[9px] font-black text-slate-500 uppercase">Unit {qIdx+1}/10</span>
                                    </div>
                                </div>

                                <div className="bg-[#0b0f1a] border border-white/5 rounded-[2.5rem] overflow-hidden shadow-2xl p-8 sm:p-12 relative">
                                    <div className="flex items-center gap-2 mb-10 text-slate-500">
                                        <span className="h-1.5 w-1.5 bg-blue-500 rounded-full"></span>
                                        <span className="text-[10px] font-black uppercase tracking-[0.3em]">Signal Active</span>
                                    </div>

                                    <h2 className="text-2xl sm:text-3xl font-black leading-tight text-white italic mb-12 tracking-tight">
                                        {questions[qIdx].text}
                                    </h2>

                                    {!feedback && (
                                        <div className="space-y-6">
                                            {!showOptions ? (
                                                <div className="space-y-6">
                                                    <div className="relative">
                                                        <input 
                                                            type="text" autoFocus value={input} 
                                                            onChange={e => setInput(e.target.value)} 
                                                            onKeyDown={e => e.key === 'Enter' && input.length > 0 && submit()} 
                                                            placeholder="Intel entry..." 
                                                            className="w-full bg-slate-900/50 border-2 border-slate-800 p-6 rounded-2xl outline-none focus:border-blue-500 font-bold text-lg input-active transition-all" 
                                                        />
                                                        {input.length > 0 && (
                                                            <button onClick={() => submit()} className="absolute right-3 top-3 bottom-3 aspect-square bg-blue-600 rounded-xl flex items-center justify-center hover:bg-blue-500 transition-all active:scale-90 shadow-lg"><Icon name="send" className="text-white" /></button>
                                                        )}
                                                    </div>
                                                    <button onClick={() => setShowOptions(true)} className="w-full py-4 text-[10px] font-black text-slate-500 uppercase tracking-widest hover:text-blue-400 transition-all bg-slate-900/20 rounded-xl border border-white/5 flex items-center justify-center gap-2">
                                                        <Icon name="help-circle" /> Stuck? Reveal choices (100 XP)
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-1 gap-3 animate-in slide-in-from-bottom-2">
                                                    {questions[qIdx].options.map((opt, i) => (
                                                        <button key={i} onClick={() => submit(i)} className="w-full p-5 rounded-2xl text-left text-sm font-bold border-2 border-slate-800 bg-slate-900/40 hover:border-blue-500/50 active:scale-[0.98] transition-all">
                                                            {opt}
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {feedback && (
                                        <div className="mt-10 pt-10 border-t border-white/5 animate-in slide-in-from-bottom-4 duration-500">
                                            <div className="flex gap-5 mb-8">
                                                <div className={`p-4 h-fit rounded-2xl shadow-xl ${feedback.correct ? 'bg-green-500/20 text-green-500' : 'bg-red-500/20 text-red-500'}`}>
                                                    <Icon name={feedback.correct ? 'check-circle' : 'alert-triangle'} className="w-8 h-8" />
                                                </div>
                                                <div className="flex-1">
                                                    <p className={`text-xl font-black uppercase tracking-tight mb-2 ${feedback.correct ? 'text-green-400' : 'text-red-400'}`}>
                                                        {feedback.correct ? 'Intel Verified' : 'Sync Error'}
                                                    </p>
                                                    {!feedback.correct && (
                                                        <p className="text-[10px] text-slate-500 uppercase font-black tracking-widest mb-2 italic">Target Data: {feedback.answer}</p>
                                                    )}
                                                    <p className="text-[10px] font-black text-slate-500 uppercase">
                                                        Intel Reward: <span className="text-blue-400">+{feedback.correct ? (showOptions ? 100 : 250) : 0}</span>
                                                    </p>
                                                </div>
                                            </div>
                                            
                                            <div className="bg-black/50 p-6 rounded-3xl border border-white/5 mb-10 shadow-inner">
                                                <p className="text-slate-300 text-xs sm:text-sm leading-relaxed font-medium italic">
                                                    <span className="text-blue-500 font-black not-italic mr-3 tracking-widest text-[9px] uppercase underline underline-offset-4">Research_Note:</span>
                                                    "{feedback.fact}"
                                                </p>
                                            </div>

                                            <button onClick={handleNext} className="w-full bg-white text-black py-5 rounded-3xl font-black text-[11px] tracking-[0.2em] uppercase active:scale-95 transition-all shadow-2xl hover:bg-blue-600 hover:text-white">
                                                Synchronize Next <Icon name="chevron-right" className="inline ml-1 w-4 h-4" />
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* AMBIENT FOOTER */}
                    <footer className="fixed bottom-0 left-0 w-full p-4 flex justify-between items-center opacity-40 px-10 pointer-events-none bg-black/20 backdrop-blur-sm">
                        <div className="text-[8px] font-black uppercase tracking-widest flex items-center gap-2"><Icon name="cpu" size={10} /> Neural_Net active</div>
                        <div className="text-[8px] font-black uppercase tracking-widest flex items-center gap-2">Source: Brain Facts 8th Ed</div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
