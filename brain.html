<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroExplorer Pro: Research Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #05070a;
            color: #f1f5f9;
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICON WRAPPERS ---
        const Icon = ({ name, className = "w-5 h-5", size = 20 }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- FUZZY MATCHING LOGIC ---
        const getLevenshteinDistance = (a, b) => {
            const matrix = Array.from({ length: a.length + 1 }, () => 
                Array.from({ length: b.length + 1 }, (_, i) => i)
            );
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            return matrix[a.length][b.length];
        };

        const isCloseEnough = (input, target) => {
            const cleanInput = input.toLowerCase().trim();
            const cleanTarget = target.toLowerCase().trim();
            if (cleanInput.includes(cleanTarget) || cleanTarget.includes(cleanInput)) return true;
            const distance = getLevenshteinDistance(cleanInput, cleanTarget);
            const threshold = Math.floor(cleanTarget.length * 0.35); 
            return distance <= threshold;
        };

        const shuffleArray = (array) => [...array].sort(() => Math.random() - 0.5);

        // --- DATA POOL ---
        const QUESTION_POOL = {
            anatomy: [
                { type: 'choice', text: "Which lobe is responsible for processing auditory information?", options: ["Frontal", "Parietal", "Occipital", "Temporal"], correct: 3, fact: "The temporal lobes sit on the sides of the brain, near your ears." },
                { type: 'open', text: "What is the name of the thin, folded outer layer of the cerebrum?", answer: "Cerebral Cortex", fact: "Its folds increase the surface area to pack in more neurons." },
                { type: 'choice', text: "What connects the two cerebral hemispheres?", options: ["Amygdala", "Corpus Callosum", "Pons", "Thalamus"], correct: 1, fact: "The corpus callosum is the largest bundle of nerve fibers in the brain." },
                { type: 'open', text: "Which almond-shaped structure integrates memory and emotion?", answer: "Amygdala", fact: "It is critical for processing fear and social rewards." },
                { type: 'choice', text: "What comprises the brainstem?", options: ["Midbrain, Pons, Medulla", "Thalamus, Cortex, Amygdala", "Cerebellum, Pons, Medulla", "Frontal, Parietal, Temporal"], correct: 0, fact: "The brainstem controls basic survival functions like breathing." }
            ],
            signaling: [
                { type: 'open', text: "What is the brain's most common excitatory neurotransmitter?", answer: "Glutamate", fact: "It is used by roughly half of all excitatory synapses." },
                { type: 'choice', text: "Which cells provide nutrients and regulate ion concentrations around neurons?", options: ["Microglia", "Astrocytes", "Oligodendrocytes", "Neurons"], correct: 1, fact: "Astrocytes are star-shaped glial cells that support neural health." },
                { type: 'open', text: "The junction where neurons communicate via chemicals is called a...", answer: "Synapse", fact: "Signals travel across the synaptic cleft via neurotransmission." },
                { type: 'choice', text: "What charge describes a resting neuron?", options: ["+70 mV", "-70 mV", "0 mV", "-10 mV"], correct: 1, fact: "Resting membrane potential is more negative inside the cell." },
                { type: 'open', text: "Which chemical acts as a brake, inhibiting neural firing?", answer: "GABA", fact: "GABA is the primary inhibitory neurotransmitter." }
            ],
            senses: [
                { type: 'choice', text: "Which cells pick up fine detail and color in the eye?", options: ["Rods", "Cones", "Ganglion", "Lens"], correct: 1, fact: "Cones are concentrated in the fovea for maximum acuity." },
                { type: 'open', text: "The sense of taste is also known as...", answer: "Gustation", fact: "We have 5,000 to 10,000 taste buds." },
                { type: 'choice', text: "Which sense bypasses the Thalamus to go directly to the Cortex?", options: ["Sight", "Hearing", "Smell", "Touch"], correct: 2, fact: "Olfaction (smell) is the only sense with this direct pathway." },
                { type: 'open', text: "What are the specialized sensory fibers that respond to tissue damage (pain)?", answer: "Nociceptors", fact: "Nociceptors respond to thermal, mechanical, or chemical danger." }
            ],
            development: [
                { type: 'choice', text: "The elimination of unused neurons and synapses is called...", options: ["Neurogenesis", "Proliferation", "Synaptic Pruning", "Apoptosis"], correct: 2, fact: "Pruning allows the brain to become more specialized based on experience." },
                { type: 'open', text: "The ability of the brain to adapt and rewire itself is called...", answer: "Neuroplasticity", fact: "Learning a new skill creates and strengthens neural connections." },
                { type: 'choice', text: "Until what age does the brain continue to mature?", options: ["18", "21", "25", "30"], correct: 3, fact: "The prefrontal cortex is one of the last areas to fully mature." }
            ],
            clinical: [
                { type: 'choice', text: "Which disease is marked by amyloid plaques and tau tangles?", options: ["Parkinson's", "ALS", "Alzheimer's", "Huntington's"], correct: 2, fact: "These protein clumps disrupt and eventually kill brain cells." },
                { type: 'open', text: "What neurotransmitter is lost in Parkinson's disease?", answer: "Dopamine", fact: "Loss occurs specifically in the substantia nigra." },
                { type: 'choice', text: "Which condition involves possessing an extra copy of chromosome 21?", options: ["Autism", "Down Syndrome", "Dyslexia", "Epilepsy"], correct: 1, fact: "This is also known as Trisomy 21." },
                { type: 'open', text: "What is the medical term for a 'brain attack' or blockage of blood?", answer: "Stroke", fact: "Rapid treatment with tPA can prevent permanent damage." }
            ],
            society: [
                { type: 'choice', text: "Which tech uses radio waves to see brain structure?", options: ["MRI", "EEG", "PET", "TMS"], correct: 0, fact: "MRI maps water distribution in tissues." },
                { type: 'open', text: "The field combining neuroscience and economic decision-making is...", answer: "Neuroeconomics", fact: "It studies how the brain calculates risk and reward." },
                { type: 'choice', text: "Which tool can temporarily silence a specific brain region using magnets?", options: ["PET", "EEG", "TMS", "MRI"], correct: 2, fact: "Transcranial Magnetic Stimulation is used for both research and therapy." }
            ]
        };

        const MISSIONS = [
            { id: 'anatomy', title: 'Anatomy Hub', icon: 'brain', color: 'blue' },
            { id: 'signaling', title: 'Synaptic Fire', icon: 'zap', color: 'yellow' },
            { id: 'senses', title: 'Senses', icon: 'eye', color: 'purple' },
            { id: 'development', title: 'Growth', icon: 'baby', color: 'green' },
            { id: 'clinical', title: 'Diagnostic', icon: 'stethoscope', color: 'red' },
            { id: 'society', title: 'Society', icon: 'users', color: 'cyan' }
        ];

        const ACHIEVEMENTS = [
            { id: 'first_step', name: 'First Spark', desc: 'Answered your first question.', icon: 'zap' },
            { id: 'fuzzy', name: 'Flexible Mind', desc: 'Used fuzzy matching logic.', icon: 'refresh-cw' },
            { id: 'perfect', name: 'Precision', desc: '100% mission accuracy.', icon: 'target' },
            { id: 'master', name: 'Grand Master', desc: 'Reached Level 5.', icon: 'trophy' }
        ];

        const App = () => {
            const [view, setView] = useState('menu');
            const [score, setScore] = useState(0);
            const [level, setLevel] = useState(1);
            const [unlockedAchievements, setUnlockedAchievements] = useState([]);
            const [currentMission, setCurrentMission] = useState(null);
            const [questions, setQuestions] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [userInput, setUserInput] = useState('');
            const [showFeedback, setShowFeedback] = useState(null);
            const [correctCount, setCorrectCount] = useState(0);

            const xpPerLevel = 1000;
            const progress = ((score % xpPerLevel) / xpPerLevel) * 100;
            const ranks = ["Cadet", "Scout", "Investigator", "Architect", "Legend"];
            const currentRank = ranks[Math.min(level - 1, ranks.length - 1)];

            useEffect(() => {
                const newLevel = Math.floor(score / xpPerLevel) + 1;
                if (newLevel > level) {
                    setLevel(newLevel);
                    if (newLevel >= 5) unlock('master');
                }
            }, [score]);

            const unlock = (id) => {
                if (!unlockedAchievements.includes(id)) {
                    setUnlockedAchievements(prev => [...prev, id]);
                }
            };

            const startMission = (id) => {
                let qs = [];
                if (id === 'mixed') {
                    qs = shuffleArray(Object.values(QUESTION_POOL).flat()).slice(0, 10);
                    setCurrentMission({ title: 'MASTER MIXED' });
                } else {
                    qs = shuffleArray(QUESTION_POOL[id]).slice(0, 5);
                    setCurrentMission(MISSIONS.find(m => m.id === id));
                }
                setQuestions(qs);
                setCurrentIdx(0);
                setCorrectCount(0);
                setView('play');
            };

            const handleAnswer = (choiceIdx) => {
                if (showFeedback) return;
                const q = questions[currentIdx];
                let isCorrect = false;
                let usedFuzzy = false;

                if (q.type === 'choice') {
                    isCorrect = choiceIdx === q.correct;
                } else {
                    isCorrect = isCloseEnough(userInput, q.answer);
                    if (isCorrect && userInput.toLowerCase().trim() !== q.answer.toLowerCase().trim()) {
                        usedFuzzy = true;
                    }
                }

                if (isCorrect) {
                    setScore(s => s + (q.type === 'open' ? 250 : 150));
                    setCorrectCount(c => c + 1);
                    unlock('first_step');
                    if (usedFuzzy) unlock('fuzzy');
                }
                setShowFeedback({ correct: isCorrect, fact: q.fact, answer: q.type === 'open' ? q.answer : null });
            };

            const nextStep = () => {
                setShowFeedback(null);
                setUserInput('');
                if (currentIdx < questions.length - 1) {
                    setCurrentIdx(i => i + 1);
                } else {
                    if (correctCount >= questions.length - 1) unlock('perfect');
                    setView('menu');
                }
            };

            return (
                <div className="max-w-xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col">
                    {/* HUD */}
                    <div className="bg-slate-900/80 border border-white/5 p-4 rounded-2xl mb-6 backdrop-blur-md">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-blue-600 rounded-lg">
                                    <Icon name="brain" className="text-white" />
                                </div>
                                <div>
                                    <h1 className="font-black text-sm tracking-tight uppercase">Neuro-Pro</h1>
                                    <p className="text-[10px] text-blue-400 font-bold tracking-widest">{currentRank}</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-[8px] text-slate-500 font-black uppercase">Intel Score</p>
                                <p className="text-xl font-black text-white">{score.toLocaleString()}</p>
                            </div>
                        </div>
                        <div className="space-y-1.5">
                            <div className="flex justify-between text-[8px] font-black text-slate-500 uppercase tracking-widest">
                                <span>Lvl {level}</span>
                                <span>{score % xpPerLevel} / {xpPerLevel} XP</span>
                            </div>
                            <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div className="h-full bg-blue-500 transition-all duration-700" style={{ width: `${progress}%` }} />
                            </div>
                        </div>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className="flex-1">
                        {view === 'menu' && (
                            <div className="space-y-4 animate-in fade-in duration-500">
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => setView('achievements')} className="flex items-center justify-center gap-2 bg-slate-900 border border-white/5 p-4 rounded-xl active:scale-95">
                                        <Icon name="trophy" className="text-yellow-500" size={16} />
                                        <span className="text-[10px] font-black uppercase tracking-widest">Rewards</span>
                                    </button>
                                    <button onClick={() => startMission('mixed')} className="flex items-center justify-center gap-2 bg-blue-600 p-4 rounded-xl active:scale-95 shadow-lg shadow-blue-500/20">
                                        <Icon name="shuffle" className="text-white" size={16} />
                                        <span className="text-[10px] font-black uppercase tracking-widest">Mixed Master</span>
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {MISSIONS.map(m => (
                                        <button key={m.id} onClick={() => startMission(m.id)} className="flex items-center gap-4 bg-slate-900/40 border border-white/5 p-4 rounded-xl hover:border-blue-500/30 active:scale-[0.98] text-left">
                                            <div className={`p-2.5 rounded-lg bg-slate-950 text-${m.color}-500 shadow-inner`}>
                                                <Icon name={m.icon} size={18} />
                                            </div>
                                            <div>
                                                <h3 className="text-xs font-black uppercase tracking-tight">{m.title}</h3>
                                                <p className="text-[9px] text-slate-500">5 Unit Sequence</p>
                                            </div>
                                            <Icon name="chevron-right" className="ml-auto text-slate-700" size={14} />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'achievements' && (
                            <div className="animate-in slide-in-from-right-4 duration-500">
                                <button onClick={() => setView('menu')} className="text-slate-500 text-[10px] font-black uppercase tracking-widest flex items-center gap-1 mb-6">
                                    <Icon name="chevron-left" size={12} /> Back
                                </button>
                                <div className="bg-slate-900/50 border border-white/5 p-6 rounded-2xl">
                                    <h2 className="text-sm font-black uppercase tracking-tighter italic mb-6">Unlocked intel</h2>
                                    <div className="space-y-3">
                                        {ACHIEVEMENTS.map(a => {
                                            const active = unlockedAchievements.includes(a.id);
                                            return (
                                                <div key={a.id} className={`flex items-center gap-4 p-4 rounded-xl border ${active ? 'bg-blue-600/5 border-blue-500/20' : 'bg-slate-950/50 border-white/5 opacity-40'}`}>
                                                    <div className={`p-2 rounded-lg ${active ? 'bg-blue-600' : 'bg-slate-800'}`}>
                                                        <Icon name={active ? a.icon : 'lock'} size={16} />
                                                    </div>
                                                    <div className="flex-1">
                                                        <p className="text-[10px] font-black uppercase">{a.name}</p>
                                                        <p className="text-[9px] text-slate-500 font-medium">{a.desc}</p>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'play' && (
                            <div className="animate-in zoom-in-95 duration-500">
                                <div className="flex justify-between items-center mb-4">
                                    <button onClick={() => setView('menu')} className="text-slate-600 text-[9px] font-black uppercase tracking-widest">Abort</button>
                                    <span className="text-[9px] font-black text-blue-400 uppercase tracking-widest">{currentMission.title} // Unit {currentIdx+1}</span>
                                </div>
                                <div className="bg-[#0b0f1a] border border-white/5 rounded-3xl overflow-hidden p-6 sm:p-10 shadow-2xl">
                                    <h2 className="text-lg sm:text-2xl font-black leading-tight text-white italic mb-10">
                                        {questions[currentIdx].text}
                                    </h2>

                                    {questions[currentIdx].type === 'choice' ? (
                                        <div className="space-y-3">
                                            {questions[currentIdx].options.map((opt, i) => (
                                                <button key={i} onClick={() => handleAnswer(i)} disabled={showFeedback} className={`w-full p-4 rounded-xl text-left text-sm font-bold border-2 transition-all ${showFeedback ? (i === questions[currentIdx].correct ? 'bg-green-500/10 border-green-500 text-green-400' : 'bg-slate-900/50 border-slate-800 opacity-30') : 'bg-slate-900/40 border-slate-800 active:scale-[0.98]'}`}>
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="relative">
                                            <input type="text" autoFocus value={userInput} onChange={e => setUserInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleAnswer()} disabled={showFeedback} placeholder="Type intel..." className="w-full bg-slate-900/50 border-2 border-slate-800 p-5 rounded-xl outline-none focus:border-blue-500 font-bold text-lg" />
                                            {!showFeedback && <button onClick={() => handleAnswer()} className="absolute right-2 top-2 bottom-2 aspect-square bg-blue-600 rounded-lg flex items-center justify-center"><Icon name="send" size={14} /></button>}
                                        </div>
                                    )}

                                    {showFeedback && (
                                        <div className="mt-8 pt-8 border-t border-white/5 animate-in slide-in-from-bottom-4 duration-500">
                                            <div className="flex gap-4 mb-6">
                                                <div className={`p-2 rounded-lg ${showFeedback.correct ? 'bg-green-500/20 text-green-500' : 'bg-red-500/20 text-red-500'}`}>
                                                    <Icon name={showFeedback.correct ? 'check-circle-2' : 'x-circle'} size={20} />
                                                </div>
                                                <div className="flex-1">
                                                    <p className={`text-sm font-black uppercase mb-1 ${showFeedback.correct ? 'text-green-400' : 'text-red-400'}`}>{showFeedback.correct ? 'Sync Confirmed' : 'Sync Error'}</p>
                                                    {showFeedback.answer && !showFeedback.correct && <p className="text-[10px] text-slate-500 uppercase font-black">Target: <span className="text-white italic">{showFeedback.answer}</span></p>}
                                                </div>
                                            </div>
                                            <div className="bg-black/40 p-4 rounded-xl border border-white/5 mb-6 shadow-inner text-[11px] text-slate-300 font-medium leading-relaxed italic">
                                                "{showFeedback.fact}"
                                            </div>
                                            <button onClick={nextStep} className="w-full bg-white text-black py-4 rounded-xl font-black text-[10px] tracking-widest uppercase active:scale-95 transition-all">Continue sequence</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    <footer className="mt-8 grid grid-cols-2 gap-4 opacity-50">
                        <div className="text-[8px] font-black text-slate-500 uppercase flex items-center gap-2"><Icon name="bar-chart-3" size={10}/> Rewards: {unlockedAchievements.length}/4</div>
                        <div className="text-[8px] font-black text-slate-500 uppercase flex items-center gap-2 text-right justify-end"><Icon name="medal" size={10}/> 18 Chapters Loaded</div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
