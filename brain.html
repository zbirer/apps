            const matrix = Array(b.length + 1).fill(null).map(() => Array(a.length + 1).fill(null));
            for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
            for (let j = 0; j <= b.length; j++) matrix[j][0] = j;
            for (let j = 1; j <= b.length; j++) {
                for (let i = 1; i <= a.length; i++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[j][i] = Math.min(matrix[j][i - 1] + 1, matrix[j - 1][i] + 1, matrix[j - 1][i - 1] + cost);
                }
            }
            return matrix[b.length][a.length] <= Math.floor(b.length * 0.35);
        };

                { text: "Financial choice brain field?", answer: "Neuroeconomics", options: ["Neurolaw", "Neuroeconomics", "Social Neuro", "Bio-math"], correct: 1, fact: "Combines economics and neuroscience." },
                { text: "Bypass paralysis interface type?", answer: "Brain-Machine Interface", options: ["BMI", "DBS", "TMS", "PET"], correct: 0, fact: "Translates intent into robotic action." },
                { text: "Cortical cells net charge sensor tool?", answer: "EEG", options: ["fMRI", "EEG", "PET", "MEG"], correct: 1, fact: "Scalp electrodes record oscillations." },
                { text: "Magnetic field detection imaging tool?", answer: "MEG", options: ["EEG", "MEG", "fMRI", "PET"], correct: 1, fact: "Magnetoencephalography resolution is high." },
                { text: "Modeling brain mathematically field?", answer: "Computational Neuroscience", options: ["Neurolaw", "Ethics", "Computational Neuroscience", "BMI"], correct: 2, fact: "Tests models against biological data." },
                { text: "Radioactive marker plaque detection scan?", answer: "PET", options: ["MRI", "NIRS", "PET", "TMS"], correct: 2, fact: "Positron emission tomography tracers." },
                { text: "Magnetic pulse PFC treatment tool?", answer: "TMS", options: ["DBS", "TMS", "tDCS", "BMI"], correct: 1, fact: "Transcranial magnetic stimulation." },
                { text: "Oxygen flow measuring laser tool?", answer: "NIRS", options: ["fMRI", "NIRS", "PET", "EEG"], correct: 1, fact: "Near-infrared spectroscopy is portable." },
                { text: "Transmitter tubes monitoring method?", answer: "Microdialysis", options: ["Mass spec", "Microdialysis", "Opto", "TMS"], correct: 1, fact: "Collects liquid outside neurons." },
                { text: "DNA copy repeat comparison analysis?", answer: "Microarrays", options: ["Mass spec", "Microarrays", "PET", "NIRS"], correct: 1, fact: "Identifies translocations and repeats." },
                { text: "Ionizing compounds weight finder tool?", answer: "Mass spectrometry", options: ["Mass spectrometry", "MRI", "PET", "EEG"], correct: 0, fact: "Identifies mass of molecules." },
                { text: "Drug effect identification branch?", answer: "Pharmacology", options: ["Genomics", "Pharmacology", "Pathology", "Anatomy"], correct: 1, fact: "Drug actions and mechanisms study." },
                { text: "Tissue formation study via slices?", answer: "Histology", options: ["Histology", "Physiology", "Genomics", "Math"], correct: 0, fact: "Uses chemical stains and microscopes." },
                { text: "Recording activity without invasive holes?", answer: "EEG", options: ["Electrophy", "EEG", "DBS", "Dialysis"], correct: 1, fact: "Non-invasive surface recordings." },
                { text: "Study of structure of organisms?", answer: "Anatomy", options: ["Anatomy", "Physiology", "Biochem", "Genetics"], correct: 0, fact: "Basic mapping of landmarcks." },
                { text: "Engineered drug shuttles into brain?", answer: "Nanoparticles", options: ["Nanoparticles", "Vesicles", "Ions", "Ips"], correct: 0, fact: "Bypasses the blood-brain barrier." },
                { text: "Averaging MRI for model baseline?", answer: "Brain template", options: ["Map", "Brain template", "Grid", "fMRI"], correct: 1, fact: "Used in predictive neuroimaging." }
            ]
        };

        const MISSION_TYPES = [
            { id: 'basics', title: 'Brain Basics', icon: 'zap', color: 'yellow' },
            { id: 'senses', title: 'Senses & Motion', icon: 'eye', color: 'purple' },
            { id: 'movement', title: 'Action & Control', icon: 'activity', color: 'green' },
            { id: 'cognition', title: 'Memory/Mind', icon: 'target', color: 'rose' },
            { id: 'development', title: 'Neural Growth', icon: 'baby', color: 'blue' },
            { id: 'clinical', title: 'Clinical Suite', icon: 'stethoscope', color: 'red' },
            { id: 'research', title: 'Future Tech', icon: 'microscope', color: 'cyan' },
            { id: 'mixed', title: 'Grand Finals', icon: 'shuffle', color: 'indigo' }
        ];

        const App = () => {
            const [view, setView] = useState('menu');
            const [score, setScore] = useState(0);
            const [level, setLevel] = useState(1);
            const [unlocked, setUnlocked] = useState([]);
            const [currentMission, setCurrentMission] = useState(null);
            const [questions, setQuestions] = useState([]);
            const [qIdx, setQIdx] = useState(0);
            const [input, setInput] = useState('');
            const [showOptions, setShowOptions] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const xpPerLevel = 1000;
            const progress = ((score % xpPerLevel) / xpPerLevel) * 100;
            const rank = ["Cadet", "Scholar", "Researcher", "Specialist", "Legend"][Math.min(level-1, 4)];

            useEffect(() => {
                const newLvl = Math.floor(score / xpPerLevel) + 1;
                if (newLvl > level) setLevel(newLvl);
            }, [score]);

            const startMission = (id) => {
                const pool = id === 'mixed' ? Object.values(FULL_BANK).flat() : FULL_BANK[id];
                setQuestions(shuffle(pool).slice(0, 10));
                setCurrentMission(MISSION_TYPES.find(m => m.id === id) || { title: 'GRAND MIXED FINALS' });
                setQIdx(0);
                setShowOptions(false);
                setFeedback(null);
                setInput('');
                setView('play');
            };

            const submit = (choiceIdx = null) => {
                if (feedback) return;
                const q = questions[qIdx];
                let isCorrect = false;

                if (choiceIdx !== null) {
                    isCorrect = choiceIdx === q.correct;
                } else {
                    isCorrect = getSimilarity(input, q.answer);
                }

                if (isCorrect) {
                    setScore(s => s + (showOptions ? 100 : 250));
                }

                setFeedback({ correct: isCorrect, fact: q.fact, answer: q.answer });
            };

            const handleNext = () => {
                if (qIdx < questions.length - 1) {
                    setQIdx(i => i + 1);
                    setInput('');
                    setShowOptions(false);
                    setFeedback(null);
                    window.scrollTo(0, 0);
                } else {
                    setView('menu');
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col pb-12">
                    
                    {/* FIXED HUD */}
                    <div className="fixed-hud p-5 shadow-2xl">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 bg-blue-600 rounded-xl shadow-lg shadow-blue-500/20">
                                    <Icon name="award" className="text-white" />
                                </div>
                                <div>
                                    <h1 className="font-black text-xs uppercase tracking-tight leading-none mb-1 text-white">Brain Bee <span className="text-blue-500 italic">Israel</span></h1>
                                    <p className="text-[10px] text-blue-400 font-bold uppercase tracking-widest leading-none">{rank}</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-[8px] text-slate-500 font-black uppercase mb-0.5 tracking-widest">Mastery Intel</p>
                                <p className="text-2xl font-black text-white leading-none tabular-nums">{score.toLocaleString()}</p>
                            </div>
                        </div>
                        <div className="space-y-1.5">
                            <div className="flex justify-between text-[8px] font-black uppercase text-slate-500 tracking-tighter">
                                <span>Clearance Progress</span>
                                <span>{score % xpPerLevel} / {xpPerLevel} XP</span>
                            </div>
                            <div className="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div className="progress-fill h-full bg-blue-500 shadow-[0_0_10px_#3b82f6]" style={{ width: `${progress}%` }} />
                            </div>
                        </div>
                    </div>

                    <main className="flex-1 p-5 md:p-8">
                        {view === 'menu' && (
                            <div className="space-y-6 animate-in fade-in duration-500">
                                <div className="neuro-card p-6 rounded-[2rem] border border-white/5">
                                    <h2 className="text-xl font-black mb-3 tracking-tighter italic text-center">Finals Study Mode</h2>
                                    <p className="text-slate-400 text-xs leading-relaxed text-center">
                                        Data synced with <span className="text-white">Brain Facts 8th Ed</span>. 
                                        Input nomenclature manually for <span className="text-yellow-500">250 XP</span>.
                                    </p>
                                </div>

                                <div className="space-y-3">
                                    <p className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-2">Sequences</p>
                                    {MISSION_TYPES.map(m => (
                                        <button key={m.id} onClick={() => startMission(m.id)} className="w-full flex items-center gap-4 bg-slate-900/40 border border-white/10 p-5 rounded-2xl hover:border-blue-500/30 active:scale-[0.98] text-left transition-all">
                                            <div className={`p-3 rounded-2xl bg-slate-950 text-${m.color}-500 shadow-inner`}>
                                                <Icon name={m.icon} />
                                            </div>
                                            <div className="flex-1">
                                                <h3 className="text-xs font-black uppercase tracking-tight text-slate-100">{m.title}</h3>
                                                <p className="text-[9px] text-slate-500 font-medium italic">Intel Bundle Locked</p>
                                            </div>
                                            <Icon name="chevron-right" className="text-slate-700" />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'play' && (
                            <div className="animate-in zoom-in-95 duration-500">
                                <div className="flex justify-between items-center mb-6">
                                    <button onClick={() => setView('menu')} className="text-slate-500 text-[10px] font-black uppercase tracking-widest hover:text-red-400 transition-colors">Abort</button>
                                    <div className="flex gap-2">
                                        <span className="px-3 py-1 bg-blue-600/10 rounded-lg border border-blue-500/20 text-[9px] font-black text-blue-400 uppercase tracking-widest truncate max-w-[120px]">{currentMission.title}</span>
                                        <span className="px-3 py-1 bg-slate-900 rounded-lg border border-white/5 text-[9px] font-black text-slate-500 uppercase">Unit {qIdx+1}/10</span>
                                    </div>
                                </div>

                                <div className="bg-[#0b0f1a] border border-white/5 rounded-[2.5rem] overflow-hidden shadow-2xl p-8 sm:p-12 relative">
                                    <div className="flex items-center gap-2 mb-10 text-slate-500">
                                        <span className="h-1.5 w-1.5 bg-blue-500 rounded-full animate-pulse"></span>
                                        <span className="text-[10px] font-black uppercase tracking-[0.3em]">Signal Active</span>
                                    </div>

                                    <h2 className="text-2xl sm:text-3xl font-black leading-tight text-white italic mb-12 tracking-tight">
                                        {questions[qIdx].text}
                                    </h2>

                                    {!feedback && (
                                        <div className="space-y-6">
                                            {!showOptions ? (
                                                <div className="space-y-6">
                                                    <div className="relative">
                                                        <input 
                                                            type="text" autoFocus value={input} 
                                                            onChange={e => setInput(e.target.value)} 
                                                            onKeyDown={e => e.key === 'Enter' && input.length > 0 && submit()} 
                                                            placeholder="Type intel..." 
                                                            className="w-full bg-slate-900/50 border-2 border-slate-800 p-6 rounded-2xl outline-none focus:border-blue-500 font-bold text-lg input-active transition-all" 
                                                        />
                                                        {input.length > 0 && (
                                                            <button onClick={() => submit()} className="absolute right-3 top-3 bottom-3 aspect-square bg-blue-600 rounded-xl flex items-center justify-center hover:bg-blue-500 active:scale-90 shadow-lg"><Icon name="send" className="text-white" /></button>
                                                        )}
                                                    </div>
                                                    <button onClick={() => setShowOptions(true)} className="w-full py-4 text-[10px] font-black text-slate-500 uppercase tracking-widest hover:text-blue-400 transition-all bg-slate-900/20 rounded-xl border border-white/5 flex items-center justify-center gap-2">
                                                        <Icon name="help-circle" /> Stuck? Reveal choices (100 XP)
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-1 gap-3 animate-in slide-in-from-bottom-2">
                                                    {questions[qIdx].options.map((opt, i) => (
                                                        <button key={i} onClick={() => submit(i)} className="w-full p-5 rounded-2xl text-left text-sm font-bold border-2 border-slate-800 bg-slate-900/40 hover:border-blue-500/50 active:scale-[0.98] transition-all">
                                                            {opt}
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {feedback && (
                                        <div className="mt-10 pt-10 border-t border-white/5 animate-in slide-in-from-bottom-4 duration-500">
                                            <div className="flex gap-5 mb-8">
                                                <div className={`p-4 h-fit rounded-2xl shadow-xl ${feedback.correct ? 'bg-green-500/20 text-green-500' : 'bg-red-500/20 text-red-500'}`}>
                                                    <Icon name={feedback.correct ? 'check-circle' : 'alert-triangle'} className="w-8 h-8" />
                                                </div>
                                                <div className="flex-1">
                                                    <p className={`text-xl font-black uppercase tracking-tight mb-2 ${feedback.correct ? 'text-green-400' : 'text-red-400'}`}>
                                                        {feedback.correct ? 'Verified Intel' : 'Sync Error'}
                                                    </p>
                                                    {!feedback.correct && (
                                                        <p className="text-[10px] text-slate-500 uppercase font-black tracking-widest mb-2 italic text-white bg-red-900/30 inline-block px-2 rounded">Target: {feedback.answer}</p>
                                                    )}
                                                    <p className="text-[10px] font-black text-slate-500 uppercase">
                                                        Intel Reward: <span className="text-blue-400">+{feedback.correct ? (showOptions ? 100 : 250) : 0}</span>
                                                    </p>
                                                </div>
                                            </div>
                                            
                                            <div className="bg-black/50 p-6 rounded-3xl border border-white/5 mb-10 shadow-inner">
                                                <p className="text-slate-300 text-xs sm:text-sm leading-relaxed font-medium italic">
                                                    <span className="text-blue-500 font-black not-italic mr-3 tracking-widest text-[9px] uppercase underline underline-offset-4">Ref_Note:</span>
                                                    "{feedback.fact}"
                                                </p>
                                            </div>

                                            <button onClick={handleNext} className="w-full bg-white text-black py-5 rounded-3xl font-black text-[11px] tracking-[0.2em] uppercase active:scale-95 transition-all shadow-2xl hover:bg-blue-600 hover:text-white">
                                                Synchronize Next <Icon name="chevron-right" className="inline ml-1 w-4 h-4" />
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* AMBIENT FOOTER */}
                    <footer className="fixed bottom-0 left-0 w-full p-4 flex justify-between items-center opacity-40 px-10 pointer-events-none bg-black/20 backdrop-blur-sm">
                        <div className="text-[8px] font-black uppercase tracking-widest flex items-center gap-2"><Icon name="cpu" size={10} /> Neural_Net v9.5.1</div>
                        <div className="text-[8px] font-black uppercase tracking-widest flex items-center gap-2">Dataset: Brain Facts 8th Ed</div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
