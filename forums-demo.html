    answer: 'This sounds like something your care team needs to know about right away. Please call your care team now, or if this is an emergency, call 911. If you are having thoughts of harming yourself, call or text 988 to reach the Suicide & Crisis Lifeline. You don’t have to handle this alone.' },
  { name: 'fever', re: /fever|temperature|100\.4|chills/, articleId: 'kb-fever',
    answer: 'A temperature of 100.4°F (38°C) or higher during cancer treatment is considered a fever and needs a call to your care team the same day — even at night. Don’t wait to see if it passes, and don’t take fever reducers before speaking with your team. Keep a working thermometer at home and check your temperature whenever you feel warm, flushed, or shivery.',
    peerReply: { author: 'Robert P.', delaySeconds: 10, body: 'Call them NOW, please. I posted this exact question at 9pm with 100.6 and this community pushed me to call — the after-hours nurse had me come in, and I’m so glad I didn’t wait until morning.' } },
  { name: 'missed-dose', re: /missed|forgot.*dose|skipped.*dose|double up/, articleId: 'kb-missed-dose',
    answer: 'Don’t take a double dose to make up for a missed one. In general, if it’s close to your next scheduled dose, skip the missed one and continue as normal — but the right answer depends on your specific medication, so check with your care team or pharmacist. A daily phone alarm and a weekly pill organizer help most people stay on track.',
    peerReply: { author: 'Karen B.', delaySeconds: 9, body: 'Been there! Whatever you do, don’t take two. A recurring phone alarm plus a weekly pill organizer ended my missed doses completely — one glance and I know if today’s slot is empty.' } },
  { name: 'nausea', re: /nausea|vomit|throwing up|queasy|feel(ing)? (so )?sick|so sick/, articleId: 'kb-nausea',
    answer: 'Nausea after treatment is very common and very treatable. Take your anti-nausea medication on the schedule you were given — before you feel sick, not after — and try small, bland meals every 2–3 hours instead of large ones. If you can’t keep fluids down for more than 24 hours, contact your care team.',
    peerReply: { author: 'Tom R.', delaySeconds: 10, body: 'Day 3 used to flatten me too. Ginger tea, something small every couple of hours even when you don’t feel like it, and taking the anti-nausea pills on schedule instead of waiting — that combo turned it around for me.' } },
  { name: 'mouth-sores', re: /mouth sore|mucositis|sores? in my mouth/, articleId: 'kb-mouth-sores',
    answer: 'Mouth sores are a known side effect of several cancer treatments. Rinse several times a day with a solution of 1 tsp baking soda and 1 tsp salt in 4 cups of water, and avoid alcohol-based mouthwashes, spicy food, and very hot drinks. Tell your care team — they can prescribe rinses that ease the pain, and they need to know if sores keep you from eating or drinking.',
    peerReply: { author: 'Angela M.', delaySeconds: 11, body: 'Baking soda + salt rinse several times a day, and nothing acidic. And ask your team about a numbing rinse to use before meals — mine gave me my dinners back.' } },
  { name: 'appetite', re: /appetite|taste|metal|eating|weight loss/, articleId: 'kb-appetite',
    answer: 'Appetite and taste changes are among the most common treatment side effects. Small frequent meals, high-protein shakes, plastic utensils (for metallic taste), and adding marinades or citrus can all help. Mention any ongoing weight loss to your care team — many practices can refer you to an oncology dietitian.',
    peerReply: { author: 'Lena W.', delaySeconds: 9, body: 'Smoothies saved me — banana, protein powder, peanut butter, whole milk. Drinking calories is so much easier than chewing them. And plastic forks if it’s the metallic thing!' } },
  { name: 'fatigue', re: /fatigue|tired|exhausted|no energy/, articleId: 'kb-fatigue',
    answer: 'Cancer-related fatigue is real — it’s a side effect of treatment, not a lack of willpower. Pace your day around your best hours, take short planned rests instead of long naps, and try light activity like a short walk, which actually improves energy over time. Tell your care team if fatigue keeps you from daily activities; sometimes it has treatable causes like anemia.',
    peerReply: { author: 'Frank M.', delaySeconds: 12, body: 'A nurse once told me “rest is part of the treatment, not a break from it.” Pace around your best hours and try a tiny daily walk — sounds backwards, but it slowly gave me energy back.' } },
  { name: 'infection', re: /infection|germs|immune|sushi|\braw\b|unpasteurized/, articleId: 'kb-infection',
    answer: 'Treatment can lower your white blood cell count, which makes infections easier to catch and harder to fight. Wash hands often, avoid raw or undercooked foods (sushi, runny eggs, unpasteurized cheese) when your counts are low, and stay away from people who are actively sick. Call your care team at the first sign of infection — fever, chills, or a new cough.',
    peerReply: { author: 'Priya S.', delaySeconds: 10, body: 'I got strict about hand-washing and skipped sushi and soft cheese while my counts were low — my nurse said that window is when it matters most. Ask your team where your counts are this week.' } },
  { name: 'mood', re: /anxious|anxiety|worried|scared|can't sleep|cant sleep|scanxiety|depress|feeling down|\bsad\b/, articleId: 'kb-mood',
    answer: 'What you’re feeling is common, and it matters. Many patients find relief in breathing exercises, counseling, and simply telling their care team — practices have social workers and mental-health resources ready to help. If low mood lasts more than two weeks or you have thoughts of harming yourself, reach out to your care team today or call/text 988.',
    peerReply: { author: 'Nicole D.', delaySeconds: 11, body: 'What you’re feeling has company here. Asking my team for a counselor referral was the best call I made all year. And for the 2am spirals: in-for-4, hold-7, out-8 breathing, on repeat.' } },
  { name: 'appointments', re: /appointment|reschedul|follow-?up|\bvisit\b|results|\blabs\b/, articleId: 'kb-appointments',
    answer: 'For scheduling changes, the fastest route is a secure message or a call to your clinic’s scheduling line. Before visits, jot down your questions and current symptoms — your Canopy check-in history is a great memory aid — and consider bringing someone with you. Flagged lab values are often expected during treatment, so ask your team before worrying.',
    peerReply: { author: 'Ben O.', delaySeconds: 9, body: 'I keep a running question list on my phone and hand it over at the START of the visit. And my personal rule: no interpreting my own labs after 9pm — a two-line message to the nurse next morning beats a spiral.' } },
  { name: 'refills', re: /refill|pharmacy|insurance|copay|\bcost\b|afford/, articleId: 'kb-refills',
    answer: 'Request refills about 7 days before you run out — specialty pharmacies often need extra time. If cost is a barrier, ask your clinic about a financial counselor: manufacturer copay cards, foundation grants, and assistance programs cover many oncology medications. You should never skip doses because of cost without talking to your team first.',
    peerReply: { author: 'Diane F.', delaySeconds: 10, body: 'A foundation grant covered almost all of mine — the clinic’s financial counselor did the application with me in one phone call. Ask for that person by name; it’s their whole job.' } },
  { name: 'expect', experience: true,
    re: /what should i expect|what to expect|starting (chemo|radiation|brukinsa|immunotherapy|treatment)|first (cycle|infusion)|about to start/,
    answer: 'Every treatment feels different for every person, but hearing from patients who’ve already been through it helps more than almost anything. Here are first-person experiences from this community — real timelines of how it felt, week by week. Your care team can tell you what to expect for your specific plan.',
    peerReply: { author: 'Maria G.', delaySeconds: 10, body: 'I wrote up my first infusion hour by hour in this forum — go read it, and ask me anything. The fear of the unknown was worse than the actual day, I promise.' } },
  { name: 'fallback', re: /[\s\S]*/, kbHome: true,
    answer: 'That’s a great question to bring to your care team — you can send them a secure message anytime, and they’ll usually respond within one business day. In the meantime, our Knowledge Base has plain-language guides on side effects, medications, nutrition, and more.',
    peerReply: { author: 'Grace H.', delaySeconds: 10, body: 'No direct experience with this exact thing, but following — someone here will know. Sending support \u{1F49A} (And your care team answers secure messages within a day, in my experience.)' } }
];

/* ============================= State & persistence ============================= */

const STORAGE_KEY = 'canopy-forums-demo';
const NOW = Date.now();
let state = null;
let userStore = null;
const pendingTimers = [];

function loadUserStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { return JSON.parse(raw); }
  } catch (e) { /* corrupted store: start fresh */ }
  return { messages: [], replies: [], aiShown: {} };
}

function saveUserStore() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(userStore));
}

function buildState() {
  state = { forums: SEED_FORUMS.map((f) => ({
    ...f,
    messages: f.messages.map((m) => ({
      ...m,
      ts: NOW - m.hoursAgo * 3600 * 1000,
      replies: m.replies.map((r) => ({ ...r, ts: NOW - r.hoursAgo * 3600 * 1000 }))
    }))
  })) };
  userStore.messages.forEach((rec) => {
    const forum = state.forums.find((f) => f.id === rec.forumId);
    if (forum) { forum.messages.unshift({ ...rec.message, replies: [] }); }
  });
  userStore.replies.forEach((rec) => {
    const forum = state.forums.find((f) => f.id === rec.forumId);
    const msg = forum && forum.messages.find((m) => m.id === rec.messageId);
    if (msg) { msg.replies.push({ ...rec.reply }); }
  });
}

function findForum(forumId) { return state.forums.find((f) => f.id === forumId); }
function findMessage(forumId, messageId) {
  const forum = findForum(forumId);
  return forum ? forum.messages.find((m) => m.id === messageId) : null;
}

/* ============================= Helpers ============================= */

let uidCounter = 0;
function newId(prefix) { return prefix + Date.now().toString(36) + '-' + (++uidCounter); }

function esc(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function relTime(ts) {
  const mins = Math.round((Date.now() - ts) / 60000);
  if (mins < 1) { return 'Just now'; }
  if (mins < 60) { return mins + 'm ago'; }
  const hours = Math.round(mins / 60);
  if (hours < 24) { return hours + 'h ago'; }
  return Math.round(hours / 24) + 'd ago';
}

const AVATAR_COLORS = ['#37AE9A', '#4D60C9', '#CE569E', '#317ACE', '#895CD3', '#496F5D', '#C4713A'];
function avatarHtml(name, isCareTeam) {
  if (isCareTeam) {
    return '<span class="avatar" style="background:#1C614C" aria-hidden="true">CC</span>';
  }
  const initials = name.split(' ').map((p) => p[0]).join('').slice(0, 2).toUpperCase();
  let hash = 0;
  for (let i = 0; i < name.length; i += 1) { hash = (hash * 31 + name.charCodeAt(i)) % 997; }
  const color = AVATAR_COLORS[hash % AVATAR_COLORS.length];
  return '<span class="avatar" style="background:' + color + '" aria-hidden="true">' + esc(initials) + '</span>';
}

function matchRule(text) {
  const normalized = text.toLowerCase().replace(/[’‘]/g, "'");
  return AI_RULES.find((rule) => rule.re.test(normalized));
}

function experienceLinksFor(text) {
  const normalized = text.toLowerCase();
  const hits = EXPERIENCE_LINKS.filter((link) => link.re.test(normalized));
  if (hits.length === 0) { return null; }
  return hits.map((link) => {
    const msg = findMessage('f5', link.messageId);
    return { messageId: link.messageId, author: msg.author, title: msg.title };
  });
}

/* ============================= AI panel ============================= */

function linkifySecureMessage(escapedText) {
  return escapedText.replace(/secure messages?/gi, (match) =>
    '<a href="https://canopycare.us/" target="_blank" rel="noopener">' + match + '</a>');
}

function aiPanelContentHtml(rule, sourceText, auto) {
  const urgentClass = rule.urgent ? ' urgent' : '';
  let chips = '';
  if (rule.articleId) {
    const article = ARTICLES.find((a) => a.id === rule.articleId);
    chips = '<a class="chip" href="#/kb/' + article.id + '">\u{1F4C4} ' + esc(article.title) + '</a>';
  } else if (rule.experience) {
    const links = experienceLinksFor(sourceText);
    if (links) {
      chips = links.map((l) =>
        '<a class="chip" href="#/forum/f5/' + l.messageId + '">\u{1F4AC} Read how ' + esc(l.author) + ' felt — ' + esc(l.title) + '</a>'
      ).join('');
    } else {
      chips = '<a class="chip" href="#/forum/f5">\u{1F4AC} Browse Treatment Experiences</a>';
    }
  } else if (rule.kbHome) {
    chips = '<a class="chip" href="#/kb">\u{1F4DA} Browse the Knowledge Base</a>';
  }
  const header = auto
    ? '✨ Canopy Assistant — while you wait for others to reply'
    : '✨ Canopy Assistant';
  return '<div class="ai-label' + urgentClass + '">' + header + '</div>' +
    '<p>' + linkifySecureMessage(esc(rule.answer)) + '</p>' + chips +
    '<div class="ai-disclaimer">AI-generated — always confirm with your care team.</div>';
}

function showAiPanel(forumId, msg, opts) {
  const container = document.getElementById('ai-' + msg.id);
  if (!container) { return; }
  const shown = userStore.aiShown[msg.id];
  const rule = matchRule(msg.title + ' ' + msg.body);
  const panelClass = rule.urgent ? 'ai-panel urgent' : 'ai-panel';
  if (shown && !opts.animate) {
    container.innerHTML = '<div class="' + panelClass + '">' +
      aiPanelContentHtml(rule, msg.title + ' ' + msg.body, shown.auto) + '</div>';
    return;
  }
  container.innerHTML = '<div class="' + panelClass + '">' +
    '<div class="ai-label">✨ Canopy Assistant</div>' +
    '<div class="dots" aria-label="Canopy Assistant is thinking"><span></span><span></span><span></span></div></div>';
  const timer = setTimeout(() => {
    userStore.aiShown[msg.id] = { auto: !!opts.auto };
    saveUserStore();
    const el = document.getElementById('ai-' + msg.id);
    if (el) {
      el.innerHTML = '<div class="' + panelClass + '">' +
        aiPanelContentHtml(rule, msg.title + ' ' + msg.body, !!opts.auto) + '</div>';
    }
  }, 1500);
  pendingTimers.push(timer);
}

function schedulePeerReply(forumId, msg) {
  const rule = matchRule(msg.title + ' ' + msg.body);
  if (!rule.peerReply) { return; }
  const peer = rule.peerReply;
  pendingTimers.push(setTimeout(() => {
    const list = document.getElementById('replies-' + msg.id);
    if (list) {
      const typing = document.createElement('div');
      typing.className = 'typing-indicator';
      typing.id = 'typing-' + msg.id;
      typing.innerHTML = '<span class="dots"><span></span><span></span><span></span></span> ' + esc(peer.author) + ' is typing…';
      list.appendChild(typing);
    }
  }, 4000));
  pendingTimers.push(setTimeout(() => {
    const reply = { id: newId('r'), author: peer.author, body: peer.body, ts: Date.now() };
    const target = findMessage(forumId, msg.id);
    if (target) { target.replies.push(reply); }
    userStore.replies.push({ forumId: forumId, messageId: msg.id, reply: reply });
    saveUserStore();
    const typing = document.getElementById('typing-' + msg.id);
    if (typing) { typing.remove(); }
    const list = document.getElementById('replies-' + msg.id);
    if (list) { list.insertAdjacentHTML('beforeend', replyHtml(reply)); }
  }, peer.delaySeconds * 1000));
}

/* ============================= Rendering ============================= */

const app = document.getElementById('app');
const hero = document.getElementById('hero');

function safetyBannerHtml() {
  return '<div class="safety-banner" role="note">⚠️ This community doesn’t replace medical advice. ' +
    'For urgent concerns, contact your care team right away.</div>';
}

function setNav(active) {
  document.getElementById('nav-forums').classList.toggle('active', active === 'forums');
  document.getElementById('nav-kb').classList.toggle('active', active === 'kb');
}

function renderHome() {
  setNav('forums');
  hero.innerHTML = '<div class="hero"><div class="container">' +
    '<h1>Community Forums</h1>' +
    '<p>Patients helping patients. Share what works, tell others what treatment really felt like, and get instant AI-suggested answers while you wait.</p>' +
    '</div></div>';
  const cards = state.forums.map((f) => {
    const topicCount = f.messages.length;
    const replyCount = f.messages.reduce((sum, m) => sum + m.replies.length, 0);
    const lastTs = Math.max(...f.messages.map((m) => Math.max(m.ts, ...m.replies.map((r) => r.ts), 0)));
    return '<div class="card forum-card" role="link" tabindex="0" data-forum="' + f.id + '">' +
      '<div class="forum-icon" aria-hidden="true">' + f.icon + '</div>' +
      '<div><h3>' + esc(f.name) + '</h3>' +
      '<div class="desc">' + esc(f.description) + '</div>' +
      '<div class="meta">' + topicCount + ' topics · ' + replyCount + ' replies · last activity ' + relTime(lastTs) + '</div>' +
      '</div></div>';
  }).join('');
  app.innerHTML = safetyBannerHtml() + cards;
  app.querySelectorAll('.forum-card').forEach((card) => {
    const go = () => { location.hash = '#/forum/' + card.dataset.forum; };
    card.addEventListener('click', go);
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter') { go(); } });
  });
}

function tagChipHtml(label) {
  if (!label) { return ''; }
  const color = TAG_COLORS[label] || TAG_COLORS.Other;
  return '<span class="tag-chip" style="background:' + color + '">' + esc(label) + '</span>';
}

function replyHtml(reply) {
  const cls = reply.isCareTeam ? 'reply careteam' : 'reply';
  const badge = reply.isCareTeam ? '<span class="badge-careteam">Canopy Care Team ✓</span>' : '';
  return '<div class="' + cls + '">' +
    '<div class="msg-head">' + avatarHtml(reply.author, reply.isCareTeam) +
    '<span class="author">' + esc(reply.author) + '</span>' + badge +
    '<span class="timestamp">' + relTime(reply.ts) + '</span></div>' +
    '<div>' + esc(reply.body) + '</div></div>';
}

function messageHtml(forum, msg) {
  return '<article class="card" id="msg-' + msg.id + '">' +
    '<div class="msg-head">' + avatarHtml(msg.author, msg.isCareTeam) +
    '<span class="author">' + esc(msg.author) + '</span>' +
    tagChipHtml(msg.treatmentTag) +
    '<span class="timestamp">' + relTime(msg.ts) + '</span></div>' +
    '<div class="msg-title">' + esc(msg.title) + '</div>' +
    '<div class="msg-body">' + esc(msg.body) + '</div>' +
    '<div class="msg-actions">' +
    '<button type="button" class="btn btn-secondary btn-small" data-action="reply" data-msg="' + msg.id + '">Reply</button>' +
    '<button type="button" class="btn btn-secondary btn-small" data-action="ai" data-msg="' + msg.id + '">✨ AI answer</button>' +
    '</div>' +
    '<div id="ai-' + msg.id + '"></div>' +
    '<div class="replies" id="replies-' + msg.id + '">' + msg.replies.map(replyHtml).join('') + '</div>' +
    '<div class="reply-composer" id="reply-composer-' + msg.id + '">' +
    '<textarea placeholder="Write a supportive reply…" aria-label="Reply text"></textarea>' +
    '<button type="button" class="btn btn-primary btn-small" data-action="post-reply" data-msg="' + msg.id + '" disabled>Post reply</button>' +
    '</div></article>';
}

function composerHtml(forum) {
  const treatmentRow = forum.isExperiences
    ? '<div class="row"><label for="composer-tag">Treatment (optional)</label>' +
      '<select id="composer-tag"><option value="">Choose a treatment…</option>' +
      Object.keys(TAG_COLORS).map((t) => '<option value="' + esc(t) + '">' + esc(t) + '</option>').join('') +
      '</select></div>'
    : '';
  return '<div class="composer" id="composer" hidden>' +
    '<div class="row"><label for="composer-title">Title</label>' +
    '<input type="text" id="composer-title" placeholder="What’s your question or story?"></div>' +
    treatmentRow +
    '<div class="row"><label for="composer-body">Message</label>' +
    '<textarea id="composer-body" placeholder="Share as much detail as you’re comfortable with…"></textarea></div>' +
    '<button type="button" class="btn btn-primary" id="composer-post" disabled>Post</button>' +
    '</div>';
}

function renderForum(forumId, highlightId) {
  const forum = findForum(forumId);
  if (!forum) { location.hash = '#/'; return; }
  setNav('forums');
  hero.innerHTML = '';
  app.innerHTML =
    '<div class="breadcrumb"><a href="#/">← All forums</a></div>' +
    '<div class="forum-header"><div class="forum-icon" aria-hidden="true">' + forum.icon + '</div>' +
    '<div><h2>' + esc(forum.name) + '</h2><div class="desc">' + esc(forum.description) + '</div></div></div>' +
    safetyBannerHtml() +
    '<p style="margin-bottom:12px"><button type="button" class="btn btn-primary" id="new-message-btn">+ New message</button></p>' +
    composerHtml(forum) +
    forum.messages.map((m) => messageHtml(forum, m)).join('');

  document.getElementById('new-message-btn').addEventListener('click', () => {
    const composer = document.getElementById('composer');
    composer.hidden = !composer.hidden;
    if (!composer.hidden) { document.getElementById('composer-title').focus(); }
  });

  const titleInput = document.getElementById('composer-title');
  const bodyInput = document.getElementById('composer-body');
  const postBtn = document.getElementById('composer-post');
  const validate = () => {
    postBtn.disabled = !(titleInput.value.trim() && bodyInput.value.trim());
  };
  titleInput.addEventListener('input', validate);
  bodyInput.addEventListener('input', validate);
  postBtn.addEventListener('click', () => postMessage(forum));

  app.onclick = onMessageAction;

  // Restore cached AI panels
  forum.messages.forEach((m) => {
    if (userStore.aiShown[m.id]) { showAiPanel(forum.id, m, { animate: false }); }
  });

  if (highlightId) {
    const el = document.getElementById('msg-' + highlightId);
    if (el) {
      el.classList.add('highlighted');
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      pendingTimers.push(setTimeout(() => el.classList.remove('highlighted'), 3000));
    }
  }
}

function onMessageAction(event) {
  const btn = event.target.closest('button[data-action]');
  if (!btn) { return; }
  const msgId = btn.dataset.msg;
  const forumId = currentForumId();
  const msg = findMessage(forumId, msgId);
  if (!msg) { return; }
  if (btn.dataset.action === 'reply') {
    const composer = document.getElementById('reply-composer-' + msgId);
    composer.classList.toggle('open');
    if (composer.classList.contains('open')) {
      const area = composer.querySelector('textarea');
      area.focus();
      area.addEventListener('input', () => {
        composer.querySelector('button').disabled = !area.value.trim();
      });
    }
  } else if (btn.dataset.action === 'ai') {
    showAiPanel(forumId, msg, { animate: true, auto: false });
  } else if (btn.dataset.action === 'post-reply') {
    const composer = document.getElementById('reply-composer-' + msgId);
    const area = composer.querySelector('textarea');
    const text = area.value.trim();
    if (!text) { return; }
    const reply = { id: newId('r'), author: 'You', body: text, ts: Date.now() };
    msg.replies.push(reply);
    userStore.replies.push({ forumId: forumId, messageId: msgId, reply: reply });
    saveUserStore();
    area.value = '';
    composer.classList.remove('open');
    document.getElementById('replies-' + msgId).insertAdjacentHTML('beforeend', replyHtml(reply));
  }
}

function postMessage(forum) {
  const titleInput = document.getElementById('composer-title');
  const bodyInput = document.getElementById('composer-body');
  const tagSelect = document.getElementById('composer-tag');
  const title = titleInput.value.trim();
  const body = bodyInput.value.trim();
  if (!title || !body) { return; }
  const msg = {
    id: newId('m'), author: 'You', title: title, body: body, ts: Date.now(),
    treatmentTag: tagSelect && tagSelect.value ? tagSelect.value : undefined,
    replies: []
  };
  forum.messages.unshift(msg);
  userStore.messages.push({ forumId: forum.id, message: { id: msg.id, author: msg.author, title: msg.title, body: msg.body, ts: msg.ts, treatmentTag: msg.treatmentTag } });
  saveUserStore();
  titleInput.value = '';
  bodyInput.value = '';
  if (tagSelect) { tagSelect.value = ''; }
  document.getElementById('composer').hidden = true;
  document.getElementById('composer').insertAdjacentHTML('afterend', messageHtml(forum, msg));
  // Auto AI assist + simulated peer reply (once per message)
  showAiPanel(forum.id, msg, { animate: true, auto: true });
  schedulePeerReply(forum.id, msg);
}

/* ============================= Knowledge base ============================= */

const KB_CATEGORIES = ['All', 'Side Effects', 'Medications', 'Nutrition', 'Wellbeing', 'Care Logistics'];
let kbFilter = { category: 'All', search: '' };

function renderKb() {
  setNav('kb');
  hero.innerHTML = '';
  app.innerHTML =
    '<div style="margin-top:20px"><h1>Knowledge Base</h1>' +
    '<div class="byline">Plain-language guides reviewed by the Canopy clinical team.</div></div>' +
    safetyBannerHtml() +
    '<div class="kb-toolbar">' +
    '<input type="text" id="kb-search" placeholder="Search articles…" aria-label="Search articles" value="' + esc(kbFilter.search) + '">' +
    '<div class="kb-chips" role="group" aria-label="Filter by category">' +
    KB_CATEGORIES.map((cat) =>
      '<button type="button" class="kb-cat' + (kbFilter.category === cat ? ' active' : '') + '" data-cat="' + esc(cat) + '">' + esc(cat) + '</button>'
    ).join('') +
    '</div></div>' +
    '<div id="kb-list"></div>';
  document.getElementById('kb-search').addEventListener('input', (e) => {
    kbFilter.search = e.target.value;
    renderKbList();
  });
  app.querySelectorAll('.kb-cat').forEach((chip) => {
    chip.addEventListener('click', () => {
      kbFilter.category = chip.dataset.cat;
      app.querySelectorAll('.kb-cat').forEach((c) => c.classList.toggle('active', c === chip));
      renderKbList();
    });
  });
  renderKbList();
}

function renderKbList() {
  const search = kbFilter.search.trim().toLowerCase();
  const items = ARTICLES.filter((a) => {
    const inCategory = kbFilter.category === 'All' || a.category === kbFilter.category;
    const inSearch = !search || (a.title + ' ' + a.summary).toLowerCase().includes(search);
    return inCategory && inSearch;
  });
  const list = document.getElementById('kb-list');
  if (items.length === 0) {
    list.innerHTML = '<p style="color:var(--text-secondary)">No articles match your search.</p>';
    return;
  }
  list.innerHTML = items.map((a) =>
    '<div class="card article-card" role="link" tabindex="0" data-article="' + a.id + '">' +
    '<span class="cat-chip">' + esc(a.category) + '</span>' +
    '<h3>' + esc(a.title) + '</h3>' +
    '<div class="summary">' + esc(a.summary) + '</div>' +
    '<div class="read-time">' + a.minutes + ' min read</div></div>'
  ).join('');
  list.querySelectorAll('.article-card').forEach((card) => {
    const go = () => { location.hash = '#/kb/' + card.dataset.article; };
    card.addEventListener('click', go);
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter') { go(); } });
  });
}

function renderArticle(articleId) {
  const article = ARTICLES.find((a) => a.id === articleId);
  if (!article) { location.hash = '#/kb'; return; }
  setNav('kb');
  hero.innerHTML = '';
  const relatedForum = article.relatedForumId ? findForum(article.relatedForumId) : null;
  const relatedLink = relatedForum
    ? '<p style="margin-top:20px"><a href="#/forum/' + relatedForum.id + '">Discuss this in the ' + esc(relatedForum.name) + ' forum →</a></p>'
    : '';
  app.innerHTML =
    '<div class="breadcrumb"><a href="#/kb">← Knowledge Base</a></div>' +
    '<div class="card" style="margin-top:8px">' +
    '<span class="cat-chip">' + esc(article.category) + '</span>' +
    '<h1 style="font-size:26px">' + esc(article.title) + '</h1>' +
    '<div class="byline">Reviewed by the Canopy clinical team · ' + article.minutes + ' min read</div>' +
    '<div class="article-body">' + article.body + '</div>' +
    relatedLink +
    '</div>' + safetyBannerHtml();
}

/* ============================= Router ============================= */

let currentRoute = '';
function currentForumId() {
  const match = location.hash.match(/^#\/forum\/([^/]+)/);
  return match ? match[1] : null;
}

function route() {
  const hash = location.hash || '#/';
  currentRoute = hash;
  const forumMatch = hash.match(/^#\/forum\/([^/]+)(?:\/([^/]+))?$/);
  const articleMatch = hash.match(/^#\/kb\/([^/]+)$/);
  if (forumMatch) {
    renderForum(forumMatch[1], forumMatch[2] || null);
  } else if (articleMatch) {
    renderArticle(articleMatch[1]);
  } else if (hash === '#/kb') {
    renderKb();
  } else {
    renderHome();
  }
  window.scrollTo(0, 0);
}

document.getElementById('reset-demo').addEventListener('click', () => {
  localStorage.removeItem(STORAGE_KEY);
  userStore = loadUserStore();
  buildState();
  location.hash = '#/';
  route();
});

window.addEventListener('hashchange', route);

userStore = loadUserStore();
buildState();
route();
</script>
</body>
</html>
