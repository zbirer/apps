<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SolidStack - עולם פיזיקלי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            overflow: hidden;
            touch-action: none;
            background-color: #f0f2f5;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .shape {
            position: absolute;
            /* Force origin to top-left regardless of RTL/LTR to sync with physics engine */
            left: 0;
            top: 0;
            cursor: grab;
            will-change: transform;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transform-origin: center;
        }
        .shape:active {
            cursor: grabbing;
        }
        .shape-triangle {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border: none !important;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: #ef4444;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        #modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Header UI -->
    <header class="fixed top-0 left-0 right-0 z-50 p-4 flex flex-col sm:flex-row items-center justify-between gap-4 pointer-events-none">
        <div class="flex items-center gap-4 pointer-events-auto bg-white/80 backdrop-blur-md p-3 rounded-2xl shadow-lg border border-white">
            <h1 class="text-xl font-extrabold text-blue-600 ml-2">SolidStack</h1>
            <div class="flex flex-col border-r pr-4">
                <span class="text-xs text-gray-500 font-bold uppercase tracking-wider">אובייקטים</span>
                <span id="obj-count" class="text-lg font-mono font-bold leading-tight">0</span>
            </div>
            <button id="add-btn" class="bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>

        <div class="flex items-center gap-4 pointer-events-auto bg-white/80 backdrop-blur-md p-3 rounded-2xl shadow-lg border border-white">
            <div class="flex flex-col min-w-[120px]">
                <label class="text-xs text-gray-500 font-bold uppercase tracking-wider">כבידה: <span id="gravity-val">0.45</span></label>
                <input type="range" id="gravity-slider" min="0" max="1.5" step="0.05" value="0.45" class="w-full h-2 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600">
            </div>
            <button id="reset-btn" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl font-bold transition-colors border border-red-100">
                איפוס
            </button>
        </div>
    </header>

    <div id="game-container"></div>

    <!-- Toast Message -->
    <div id="toast" class="toast">אין מקום פנוי כרגע!</div>

    <!-- Context Modal -->
    <div id="modal-overlay">
        <div class="bg-white rounded-3xl p-6 w-80 shadow-2xl scale-110 border border-gray-100">
            <h3 class="text-xl font-bold mb-4 text-center text-gray-800">פעולות צורה</h3>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="modifyActiveShape('scale', 1.05)" class="flex flex-col items-center justify-center p-4 bg-gray-50 hover:bg-blue-50 hover:text-blue-600 rounded-2xl transition-all border border-gray-100">
                    <span class="text-2xl mb-1">➕</span>
                    <span class="text-sm font-bold">הגדל</span>
                </button>
                <button onclick="modifyActiveShape('scale', 0.95)" class="flex flex-col items-center justify-center p-4 bg-gray-50 hover:bg-blue-50 hover:text-blue-600 rounded-2xl transition-all border border-gray-100">
                    <span class="text-2xl mb-1">➖</span>
                    <span class="text-sm font-bold">הקטן</span>
                </button>
                <button onclick="modifyActiveShape('delete')" class="col-span-2 flex items-center justify-center gap-2 p-4 bg-red-50 hover:bg-red-100 text-red-600 rounded-2xl transition-all border border-red-100">
                    <span class="text-xl">🗑️</span>
                    <span class="font-bold">מחק צורה</span>
                </button>
            </div>
            <button onclick="closeModal()" class="w-full py-3 text-gray-500 font-bold hover:text-gray-700 transition-colors">ביטול</button>
        </div>
    </div>

    <script>
        /** PHYSICS CONSTANTS **/
        let GRAVITY = 0.45;
        const FRICTION = 0.97;          
        const ANGULAR_FRICTION = 0.92;  
        const ITERATIONS = 3;           
        const BOUNCE = 0.15;            
        const SLEEP_THRESHOLD = 0.05;   
        const MAX_VA = 10;              
        const SLOP = 0.5;               

        const container = document.getElementById('game-container');
        const objCountEl = document.getElementById('obj-count');
        const gravitySlider = document.getElementById('gravity-slider');
        const gravityVal = document.getElementById('gravity-val');
        const addBtn = document.getElementById('add-btn');
        const resetBtn = document.getElementById('reset-btn');
        const toast = document.getElementById('toast');
        const modalOverlay = document.getElementById('modal-overlay');

        let shapes = [];
        let activeShape = null; 
        let draggingShape = null;
        let dragOffset = { x: 0, y: 0 };
        let lastMousePos = { x: 0, y: 0 };
        let longPressTimer = null;
        let frameCount = 0;

        /** DEBUG LOGGER **/
        function debugLog(tag, message, level = 'log') {
            const styles = {
                'PHYSICS': 'color: #3b82f6; font-weight: bold;',
                'COLLISION': 'color: #ef4444; font-weight: bold;',
                'INTERACTION': 'color: #10b981; font-weight: bold;',
                'LIFECYCLE': 'color: #8b5cf6; font-weight: bold;'
            };
            if (level === 'warn' || frameCount % 600 === 0) {
                console[level](`%c[${tag}]`, styles[tag] || '', message);
            }
        }

        /** UTILS **/
        const randomColor = () => {
            const colors = ['bg-blue-500', 'bg-red-500', 'bg-green-500', 'bg-yellow-500', 'bg-purple-500', 'bg-pink-500', 'bg-indigo-500', 'bg-orange-500', 'bg-teal-500', 'bg-cyan-500'];
            return colors[Math.floor(Math.random() * colors.length)];
        };

        const showToast = () => {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        };

        /** SHAPE FACTORY **/
        function createShape() {
            const types = ['rect', 'circle', 'triangle'];
            const type = types[Math.floor(Math.random() * types.length)];
            const size = 60 + Math.random() * 40;
            const width = type === 'rect' ? size * (0.8 + Math.random() * 0.4) : size;
            const height = size;
            const color = randomColor();

            let startX, startY;
            let attempts = 0;
            let overlap = true;

            while (overlap && attempts < 200) {
                startX = Math.random() * (window.innerWidth - width);
                startY = 50 + Math.random() * 150;
                overlap = false;
                for (let s of shapes) {
                    const dx = (s.x + s.width/2) - (startX + width/2);
                    const dy = (s.y + s.height/2) - (startY + height/2);
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < (size + s.size) / 1.5) {
                        overlap = true;
                        break;
                    }
                }
                attempts++;
            }

            if (attempts >= 200) {
                showToast();
                return;
            }

            const el = document.createElement('div');
            el.className = `shape ${color} ${type === 'circle' ? 'rounded-full' : (type === 'rect' ? 'rounded-2xl' : 'shape-triangle')}`;
            el.style.width = `${width}px`;
            el.style.height = `${height}px`;
            container.appendChild(el);

            const shape = {
                id: Math.random().toString(36).substr(2, 5),
                el, type, x: startX, y: startY,
                vx: 0, vy: 0, va: 0, angle: 0,
                width, height, size: (width + height) / 2,
                mass: (width * height) / 100,
                isDragging: false
            };

            el.addEventListener('mousedown', (e) => startDrag(e, shape));
            el.addEventListener('touchstart', (e) => startDrag(e, shape), {passive: false});

            shapes.push(shape);
            updateObjCount();
        }

        /** INTERACTION **/
        function startDrag(e, shape) {
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            draggingShape = shape;
            shape.isDragging = true;
            
            // Calculate offset based on current x, y which are absolute from top-left
            dragOffset.x = clientX - shape.x;
            dragOffset.y = clientY - shape.y;
            lastMousePos = { x: clientX, y: clientY };

            clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
                if (draggingShape === shape) {
                    stopDrag();
                    openModal(shape);
                }
            }, 500);
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, {passive: false});

        function handleMove(e) {
            if (!draggingShape) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            // Update velocity based on mouse delta
            draggingShape.vx = (clientX - lastMousePos.x);
            draggingShape.vy = (clientY - lastMousePos.y);

            // Directly update position
            draggingShape.x = clientX - dragOffset.x;
            draggingShape.y = clientY - dragOffset.y;

            lastMousePos = { x: clientX, y: clientY };

            if (Math.abs(draggingShape.vx) > 3 || Math.abs(draggingShape.vy) > 3) {
                clearTimeout(longPressTimer);
            }
        }

        window.addEventListener('mouseup', stopDrag);
        window.addEventListener('touchend', stopDrag);

        function stopDrag() {
            if (draggingShape) {
                draggingShape.isDragging = false;
                draggingShape = null;
            }
            clearTimeout(longPressTimer);
        }

        function openModal(shape) { activeShape = shape; modalOverlay.style.display = 'flex'; }
        function closeModal() { modalOverlay.style.display = 'none'; activeShape = null; }

        function modifyActiveShape(action, value) {
            if (!activeShape) return;
            if (action === 'delete') {
                container.removeChild(activeShape.el);
                shapes = shapes.filter(s => s !== activeShape);
                updateObjCount();
            } else if (action === 'scale') {
                activeShape.width *= value;
                activeShape.height *= value;
                activeShape.size = (activeShape.width + activeShape.height) / 2;
                activeShape.el.style.width = `${activeShape.width}px`;
                activeShape.el.style.height = `${activeShape.height}px`;
            }
            closeModal();
        }

        /** PHYSICS ENGINE **/
        function resolveCollisions() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            for (let i = 0; i < ITERATIONS; i++) {
                for (let j = 0; j < shapes.length; j++) {
                    const s1 = shapes[j];

                    // Floor & Walls clamping
                    if (s1.x < 0) { s1.x = 0; s1.vx *= -BOUNCE; }
                    if (s1.x + s1.width > screenW) { s1.x = screenW - s1.width; s1.vx *= -BOUNCE; }
                    if (s1.y + s1.height > screenH) { 
                        s1.y = screenH - s1.height; 
                        s1.vy *= -BOUNCE; 
                        s1.vx *= FRICTION; 
                        s1.va *= 0.8; 
                    }

                    for (let k = j + 1; k < shapes.length; k++) {
                        const s2 = shapes[k];
                        const dx = (s1.x + s1.width / 2) - (s2.x + s2.width / 2);
                        const dy = (s1.y + s1.height / 2) - (s2.y + s2.height / 2);
                        const minWidth = (s1.width + s2.width) / 2;
                        const minHeight = (s1.height + s2.height) / 2;

                        if (Math.abs(dx) < minWidth && Math.abs(dy) < minHeight) {
                            const overlapX = minWidth - Math.abs(dx);
                            const overlapY = minHeight - Math.abs(dy);

                            if (overlapX > SLOP || overlapY > SLOP) {
                                if (overlapX < overlapY) {
                                    const dir = dx > 0 ? 1 : -1;
                                    const sep = overlapX / (s1.isDragging || s2.isDragging ? 1 : 2);
                                    if (!s1.isDragging) s1.x += sep * dir;
                                    if (!s2.isDragging) s2.x -= sep * dir;
                                    
                                    const avgVx = (s1.vx + s2.vx) / 2;
                                    s1.vx = avgVx + dir * BOUNCE;
                                    s2.vx = avgVx - dir * BOUNCE;

                                    const torque = (dy / minHeight) * (s1.vx - s2.vx) * 0.05;
                                    s1.va = Math.max(-MAX_VA, Math.min(MAX_VA, s1.va + torque));
                                    s2.va = Math.max(-MAX_VA, Math.min(MAX_VA, s2.va - torque));
                                } else {
                                    const dir = dy > 0 ? 1 : -1;
                                    const sep = overlapY / (s1.isDragging || s2.isDragging ? 1 : 2);
                                    if (!s1.isDragging) s1.y += sep * dir;
                                    if (!s2.isDragging) s2.y -= sep * dir;

                                    const avgVy = (s1.vy + s2.vy) / 2;
                                    s1.vy = avgVy + dir * BOUNCE;
                                    s2.vy = avgVy - dir * BOUNCE;

                                    const torque = (dx / minWidth) * (s1.vy - s2.vy) * 0.05;
                                    s1.va = Math.max(-MAX_VA, Math.min(MAX_VA, s1.va + torque));
                                    s2.va = Math.max(-MAX_VA, Math.min(MAX_VA, s2.va - torque));
                                }
                            }
                        }
                    }
                }
            }
        }

        function update() {
            frameCount++;

            shapes.forEach(s => {
                if (s.isDragging) return;

                s.vy += GRAVITY;
                s.vx *= FRICTION;
                s.vy *= FRICTION;
                s.va *= ANGULAR_FRICTION;

                if (Math.abs(s.vx) < SLEEP_THRESHOLD) s.vx = 0;
                if (Math.abs(s.vy) < SLEEP_THRESHOLD && Math.abs(s.vy) < GRAVITY * 2) s.vy = 0;
                if (Math.abs(s.va) < 0.01) s.va = 0;

                s.x += s.vx;
                s.y += s.vy;
                s.angle += s.va;
            });

            resolveCollisions();

            // Apply calculated x, y to CSS transform
            shapes.forEach(s => {
                s.el.style.transform = `translate3d(${s.x}px, ${s.y}px, 0) rotate(${s.angle}deg)`;
            });

            requestAnimationFrame(update);
        }

        /** UI LOGIC **/
        function updateObjCount() { objCountEl.textContent = shapes.length; }
        gravitySlider.addEventListener('input', (e) => {
            GRAVITY = parseFloat(e.target.value);
            gravityVal.textContent = GRAVITY.toFixed(2);
        });
        addBtn.addEventListener('click', createShape);
        resetBtn.addEventListener('click', () => {
            shapes.forEach(s => container.removeChild(s.el));
            shapes = [];
            updateObjCount();
        });

        updateObjCount();
        requestAnimationFrame(update);
        for(let i=0; i<3; i++) setTimeout(createShape, i * 200);

    </script>
</body>
</html>
