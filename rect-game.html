<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SolidStack - מלבנים מוצקים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            position: relative;
            width: 100vw;
            height: calc(100vh - 80px);
            overflow: hidden;
            background-image: 
                linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .rectangle {
            position: absolute;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            user-select: none;
            touch-action: none;
            cursor: grab;
            border: 2px solid rgba(255,255,255,0.25);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, width 0.2s ease, height 0.2s ease;
            will-change: left, top, width, height;
        }
        .rectangle.dragging {
            cursor: grabbing;
            z-index: 50;
            box-shadow: 0 25px 30px -5px rgb(0 0 0 / 0.2);
            transform: scale(1.05);
            border-color: rgba(255,255,255,0.9);
        }
        #message-toast {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.85rem 1.5rem;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            color: white;
            border-radius: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
            font-size: 0.95rem;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            min-width: 220px;
        }
        /* Modal Styles */
        #action-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 90vw;
            width: 280px;
            text-align: center;
        }
        @media (max-width: 640px) {
            header { padding: 0 1.25rem; height: 70px; }
            #canvas-container { height: calc(100vh - 70px); }
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- ממשק כותרת -->
    <header class="bg-white border-b flex items-center justify-between shadow-sm z-50">
        <div class="flex flex-col items-start px-4">
            <h1 class="text-xl font-black text-slate-800 uppercase tracking-tighter">Solid<span class="text-indigo-600">Stack</span></h1>
            <span id="counter" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">0 אובייקטים</span>
        </div>
        
        <div class="flex items-center gap-3 px-4">
            <button id="clear-btn" class="text-xs font-bold text-slate-400 hover:text-red-500 transition-colors uppercase tracking-widest p-2">
                איפוס
            </button>
            <button id="add-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg transform active:scale-90 transition-all text-3xl font-bold">
                +
            </button>
        </div>
    </header>

    <!-- אזור המשחק -->
    <main id="canvas-container">
        <!-- המלבנים ייווצרו כאן -->
    </main>

    <!-- הודעות טוסט -->
    <div id="message-toast"></div>

    <!-- מודל אפשרויות -->
    <div id="action-modal">
        <div class="modal-content">
            <div class="grid grid-cols-1 gap-2">
                <button id="enlarge-btn" class="w-full py-3 rounded-xl font-bold bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-colors">
                    הגדל
                </button>
                <button id="shrink-btn" class="w-full py-3 rounded-xl font-bold bg-slate-50 text-slate-600 hover:bg-slate-100 transition-colors">
                    הקטן
                </button>
                <button id="confirm-delete" class="w-full py-3 rounded-xl font-bold bg-red-50 text-red-500 hover:bg-red-100 transition-colors">
                    מחק
                </button>
                <div class="h-px bg-slate-100 my-1"></div>
                <button id="close-modal" class="w-full py-3 rounded-xl font-bold text-slate-400 hover:text-slate-600 transition-colors">
                    ביטול
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas-container');
        const addBtn = document.getElementById('add-btn');
        const clearBtn = document.getElementById('clear-btn');
        const counterEl = document.getElementById('counter');
        const toast = document.getElementById('message-toast');
        const actionModal = document.getElementById('action-modal');
        const confirmDeleteBtn = document.getElementById('confirm-delete');
        const enlargeBtn = document.getElementById('enlarge-btn');
        const shrinkBtn = document.getElementById('shrink-btn');
        const closeModalBtn = document.getElementById('close-modal');

        let rectangles = [];
        const MIN_SIZE = 70;
        const MAX_SIZE = 140;
        const PLACEMENT_ATTEMPTS = 200;
        const FRICTION = 0.90; 
        const MIN_VELOCITY = 0.3;
        const LONG_PRESS_DURATION = 600; 
        
        let activeRect = null;
        let selectedRect = null;
        let offset = { x: 0, y: 0 };
        let longPressTimer = null;
        
        let lastMoveTime = 0;
        let lastX = 0;
        let lastY = 0;
        let dragDistance = 0;

        function updateCounter() {
            counterEl.textContent = `${rectangles.length} ${rectangles.length === 1 ? 'אובייקט' : 'אובייקטים'}`;
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        function hasOverlap(r1, r2) {
            return (
                r1.x < r2.x + r2.w - 0.5 &&
                r1.x + r1.w > r2.x + 0.5 &&
                r1.y < r2.y + r2.h - 0.5 &&
                r1.y + r1.h > r2.y + 0.5
            );
        }

        function isStateInvalid(all) {
            const canvasW = canvas.clientWidth;
            const canvasH = canvas.clientHeight;

            for (let i = 0; i < all.length; i++) {
                const r = all[i];
                if (r.x < 0 || 
                    r.y < 0 || 
                    Math.ceil(r.x + r.w) > canvasW || 
                    Math.ceil(r.y + r.h) > canvasH) {
                    return true;
                }
                for (let j = i + 1; j < all.length; j++) {
                    if (hasOverlap(r, all[j])) return true;
                }
            }
            return false;
        }

        function getIntersection(r1, r2) {
            const overlapX = Math.min(r1.x + r1.w, r2.x + r2.w) - Math.max(r1.x, r2.x);
            const overlapY = Math.min(r1.y + r1.h, r2.y + r2.h) - Math.max(r1.y, r2.y);
            return (overlapX > 0.5 && overlapY > 0.5) ? { x: overlapX, y: overlapY } : null;
        }

        function resolvePush(mover, all, movedSet = new Set()) {
            movedSet.add(mover);
            all.forEach(target => {
                if (target === mover || movedSet.has(target)) return;
                const inter = getIntersection(mover, target);
                if (inter) {
                    if (inter.x < inter.y) {
                        const dir = (mover.x + mover.w / 2) < (target.x + target.w / 2) ? 1 : -1;
                        target.x += inter.x * dir;
                    } else {
                        const dir = (mover.y + mover.h / 2) < (target.y + target.h / 2) ? 1 : -1;
                        target.y += inter.y * dir;
                    }
                    resolvePush(target, all, movedSet);
                }
            });
        }

        function syncDOM() {
            rectangles.forEach(r => {
                r.el.style.left = `${r.x}px`;
                r.el.style.top = `${r.y}px`;
                r.el.style.width = `${r.w}px`;
                r.el.style.height = `${r.h}px`;
            });
        }

        function applyInertia() {
            let stillMoving = false;
            rectangles.forEach(r => {
                if (r === activeRect) return;
                if (Math.abs(r.vx) < MIN_VELOCITY && Math.abs(r.vy) < MIN_VELOCITY) {
                    r.vx = 0; r.vy = 0; return;
                }
                stillMoving = true;
                const snapshot = rectangles.map(orig => ({ x: orig.x, y: orig.y }));
                r.x += r.vx;
                r.y += r.vy;
                resolvePush(r, rectangles);
                if (isStateInvalid(rectangles)) {
                    rectangles.forEach((orig, idx) => {
                        orig.x = snapshot[idx].x;
                        orig.y = snapshot[idx].y;
                    });
                    r.vx = 0; r.vy = 0;
                } else {
                    r.vx *= FRICTION;
                    r.vy *= FRICTION;
                }
            });
            syncDOM();
            if (stillMoving) requestAnimationFrame(applyInertia);
        }

        function createRectElement(data) {
            const div = document.createElement('div');
            div.className = 'rectangle';
            div.style.width = `${data.w}px`;
            div.style.height = `${data.h}px`;
            div.style.backgroundColor = `hsl(${Math.floor(Math.random() * 360)}, 65%, 50%)`;
            
            data.vx = 0;
            data.vy = 0;

            div.addEventListener('pointerdown', (e) => {
                activeRect = data;
                const rect = div.getBoundingClientRect();
                const containerRect = canvas.getBoundingClientRect();
                
                offset.x = e.clientX - rect.left;
                offset.y = e.clientY - rect.top;
                
                lastX = data.x;
                lastY = data.y;
                lastMoveTime = Date.now();
                dragDistance = 0;
                
                data.vx = 0;
                data.vy = 0;

                longPressTimer = setTimeout(() => {
                    if (dragDistance < 10) { 
                        selectedRect = data;
                        actionModal.style.display = 'flex';
                        div.releasePointerCapture(e.pointerId);
                        activeRect = null;
                        div.classList.remove('dragging');
                    }
                }, LONG_PRESS_DURATION);

                div.setPointerCapture(e.pointerId);
                div.classList.add('dragging');
                e.stopPropagation();
            });

            div.addEventListener('pointermove', (e) => {
                if (!activeRect || activeRect !== data) return;

                const containerRect = canvas.getBoundingClientRect();
                const now = Date.now();
                const dt = now - lastMoveTime;
                
                const snapshot = rectangles.map(r => ({ x: r.x, y: r.y }));

                let nextX = e.clientX - containerRect.left - offset.x;
                let nextY = e.clientY - containerRect.top - offset.y;

                dragDistance += Math.sqrt(Math.pow(nextX - lastX, 2) + Math.pow(nextY - lastY, 2));
                if (dragDistance > 10) {
                    clearTimeout(longPressTimer);
                }

                if (dt > 0) {
                    const newVx = (nextX - lastX);
                    const newVy = (nextY - lastY);
                    data.vx = data.vx * 0.3 + newVx * 0.7;
                    data.vy = data.vy * 0.3 + newVy * 0.7;
                }

                data.x = nextX;
                data.y = nextY;

                resolvePush(data, rectangles);

                if (isStateInvalid(rectangles)) {
                    rectangles.forEach((r, idx) => {
                        r.x = snapshot[idx].x;
                        r.y = snapshot[idx].y;
                    });
                    data.vx = 0;
                    data.vy = 0;
                }

                lastX = data.x;
                lastY = data.y;
                lastMoveTime = now;

                syncDOM();
            });

            div.addEventListener('pointerup', () => {
                clearTimeout(longPressTimer);
                if (activeRect) {
                    activeRect.el.classList.remove('dragging');
                    activeRect = null;
                    requestAnimationFrame(applyInertia);
                }
            });

            data.el = div;
            canvas.appendChild(div);
            syncDOM();
        }

        enlargeBtn.addEventListener('click', () => {
            if (!selectedRect) return;
            const factor = 1.05;
            const oldW = selectedRect.w;
            const oldH = selectedRect.h;
            
            selectedRect.w *= factor;
            selectedRect.h *= factor;

            if (isStateInvalid(rectangles)) {
                selectedRect.w = oldW;
                selectedRect.h = oldH;
                showToast("אין מספיק מקום פנוי להגדלה!");
            } else {
                syncDOM();
            }
            actionModal.style.display = 'none';
            selectedRect = null;
        });

        shrinkBtn.addEventListener('click', () => {
            if (!selectedRect) return;
            const factor = 0.95;
            selectedRect.w *= factor;
            selectedRect.h *= factor;
            syncDOM();
            actionModal.style.display = 'none';
            selectedRect = null;
        });

        confirmDeleteBtn.addEventListener('click', () => {
            if (selectedRect) {
                rectangles = rectangles.filter(r => r !== selectedRect);
                selectedRect.el.remove();
                selectedRect = null;
                updateCounter();
            }
            actionModal.style.display = 'none';
        });

        closeModalBtn.addEventListener('click', () => {
            selectedRect = null;
            actionModal.style.display = 'none';
        });

        function addRectangle() {
            const canvasW = canvas.clientWidth;
            const canvasH = canvas.clientHeight;
            if (canvasW === 0 || canvasH === 0) return;

            for (let i = 0; i < PLACEMENT_ATTEMPTS; i++) {
                const w = Math.floor(Math.random() * (MAX_SIZE - MIN_SIZE)) + MIN_SIZE;
                const h = Math.floor(Math.random() * (MAX_SIZE - MIN_SIZE)) + MIN_SIZE;
                const x = Math.floor(Math.random() * (canvasW - w));
                const y = Math.floor(Math.random() * (canvasH - h));
                const candidate = { x, y, w, h };
                
                let collision = false;
                for (let r of rectangles) {
                    if (hasOverlap(candidate, r)) { collision = true; break; }
                }

                if (!collision) {
                    createRectElement(candidate);
                    rectangles.push(candidate);
                    updateCounter();
                    return; 
                }
            }
            showToast("אין מקום פנוי למלבן חדש!");
        }

        addBtn.addEventListener('click', addRectangle);
        clearBtn.addEventListener('click', () => {
            canvas.innerHTML = '';
            rectangles = [];
            updateCounter();
        });

        window.onload = () => {
            updateCounter();
            setTimeout(addRectangle, 100);
        };

        window.addEventListener('resize', () => {
            rectangles.forEach(r => {
                const canvasW = canvas.clientWidth;
                const canvasH = canvas.clientHeight;
                r.x = Math.max(0, Math.min(r.x, canvasW - r.w));
                r.y = Math.max(0, Math.min(r.y, canvasH - r.h));
            });
            syncDOM();
        });
    </script>
</body>
</html>
