<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SolidStack - עולם פיזיקלי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            overflow: hidden;
            touch-action: none;
            background-color: #f0f2f5;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
        }
        header {
            height: 60px;
        }
        .shape {
            position: absolute;
            left: 0;
            top: 0;
            cursor: grab;
            will-change: transform;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transform-origin: center;
        }
        .shape-triangle {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border: none !important;
        }
        #modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(2px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .sensor-active {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Super Compact Toolbar -->
    <header class="fixed top-0 inset-x-0 z-50 bg-white/95 backdrop-blur-sm border-b border-gray-200 pointer-events-auto flex items-center h-[60px]">
        <div class="flex items-center w-full px-1 sm:px-4 justify-between overflow-hidden">
            
            <!-- RIGHT: Reset & Sensor -->
            <div class="flex items-center gap-1 sm:gap-2 flex-shrink-0">
                <button id="reset-btn" title="איפוס" class="bg-red-50 hover:bg-red-100 text-red-600 w-8 h-8 sm:w-auto sm:px-3 sm:py-1.5 rounded-lg text-[10px] font-extrabold border border-red-100 flex items-center justify-center">
                    <span class="sm:hidden text-lg">🔄</span>
                    <span class="hidden sm:inline">איפוס</span>
                </button>
                <button id="sensor-btn" class="bg-gray-50 text-gray-600 w-8 h-8 rounded-lg flex items-center justify-center border border-gray-200 text-base">🧭</button>
            </div>

            <!-- MIDDLE: Sliders (Scaled down for mobile) -->
            <div class="flex items-center gap-2 sm:gap-4 flex-grow justify-center px-1">
                <div class="flex flex-col items-center w-full max-w-[60px] sm:max-w-[90px]">
                    <label class="text-[8px] text-gray-400 font-bold uppercase truncate">כבידה</label>
                    <input type="range" id="gravity-slider" min="0" max="0.20" step="0.01" value="0.10" class="w-full h-1 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600">
                </div>
                <div class="flex flex-col items-center w-full max-w-[60px] sm:max-w-[90px]">
                    <label class="text-[8px] text-gray-400 font-bold uppercase truncate">חיכוך</label>
                    <input type="range" id="friction-slider" min="0" max="1" step="0.01" value="0.50" class="w-full h-1 bg-gray-100 rounded-lg appearance-none cursor-pointer accent-gray-500">
                </div>
            </div>

            <!-- LEFT: Rotation & Add (Now strictly visible) -->
            <div class="flex items-center gap-1 sm:gap-3 flex-shrink-0">
                <div class="flex items-center gap-0.5">
                    <input type="checkbox" id="rotation-toggle" class="w-3.5 h-3.5 accent-blue-600">
                    <label for="rotation-toggle" class="text-[9px] sm:text-xs text-gray-500 font-bold">סובב</label>
                </div>
                <div class="flex items-center gap-1">
                    <button id="add-rect-btn" class="bg-blue-600 text-white w-8 h-8 sm:w-9 sm:h-9 rounded-lg flex items-center justify-center shadow-sm active:scale-90">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" stroke-width="3"/></svg>
                    </button>
                    <button id="add-circle-btn" class="bg-indigo-600 text-white w-8 h-8 sm:w-9 sm:h-9 rounded-lg flex items-center justify-center shadow-sm active:scale-90">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-width="3"/></svg>
                    </button>
                </div>
            </div>

        </div>
    </header>

    <div id="game-container"></div>

    <!-- Context Modal -->
    <div id="modal-overlay">
        <div class="bg-white rounded-3xl p-3 shadow-2xl border border-gray-100 flex items-center gap-2">
            <button onclick="modifyActiveShape('scale', 1.1)" class="w-12 h-12 flex items-center justify-center bg-gray-50 hover:bg-blue-50 active:scale-90 rounded-xl text-xl">➕</button>
            <button onclick="modifyActiveShape('scale', 0.9)" class="w-12 h-12 flex items-center justify-center bg-gray-50 hover:bg-blue-50 active:scale-90 rounded-xl text-xl">➖</button>
            <div class="w-px h-6 bg-gray-200 mx-1"></div>
            <button onclick="modifyActiveShape('delete')" class="w-12 h-12 flex items-center justify-center bg-red-50 text-red-600 active:scale-90 rounded-xl text-xl">🗑️</button>
            <div class="w-px h-6 bg-gray-200 mx-1"></div>
            <button onclick="closeModal()" class="w-12 h-12 flex items-center justify-center text-gray-400 text-xl">✕</button>
        </div>
    </div>

    <script>
        /** PHYSICS & BOUNDARY CONSTANTS **/
        const HEADER_HEIGHT = 60; 
        let GRAVITY_STRENGTH = 0.10; 
        let gravityX = 0;
        let gravityY = 0.10;
        
        let frictionSliderVal = 0.50;
        let currentBounce = 0.2; 
        let currentLinearFriction = 0.97;
        let currentAngularFriction = 0.92;

        const ITERATIONS = 3;           
        const SLEEP_THRESHOLD = 0.05;   
        const MAX_VA = 10;              
        const SLOP = 0.5;               

        const container = document.getElementById('game-container');
        const gravitySlider = document.getElementById('gravity-slider');
        const frictionSlider = document.getElementById('friction-slider');
        const rotationToggle = document.getElementById('rotation-toggle');
        const sensorBtn = document.getElementById('sensor-btn');
        const addRectBtn = document.getElementById('add-rect-btn');
        const addCircleBtn = document.getElementById('add-circle-btn');
        const resetBtn = document.getElementById('reset-btn');
        const modalOverlay = document.getElementById('modal-overlay');

        let shapes = [];
        let activeShape = null; 
        let draggingShape = null;
        let dragOffset = { x: 0, y: 0 };
        let lastMousePos = { x: 0, y: 0 };
        let longPressTimer = null;
        let canRotate = false; 
        let sensorsActive = false;

        function updatePhysicsParams() {
            currentBounce = 0.9 * (1 - frictionSliderVal);
            currentLinearFriction = 1.0 - (frictionSliderVal * 0.15);
            currentAngularFriction = 1.0 - (frictionSliderVal * 0.2);
        }
        updatePhysicsParams();

        function createShape(forcedType = null) {
            const type = forcedType || 'rect';
            const size = 50 + Math.random() * 30; // Slightly smaller base size for mobile
            const width = type === 'rect' ? size * (0.8 + Math.random() * 0.4) : size;
            const height = size;
            const colors = ['bg-blue-500', 'bg-red-500', 'bg-green-500', 'bg-yellow-500', 'bg-purple-500', 'bg-pink-500', 'bg-indigo-500', 'bg-orange-500', 'bg-teal-500', 'bg-cyan-500'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            let startX, startY;
            let attempts = 0;
            let overlap = true;

            while (overlap && attempts < 50) {
                startX = Math.random() * (window.innerWidth - width);
                startY = HEADER_HEIGHT + 20 + Math.random() * 80;
                overlap = false;
                for (let s of shapes) {
                    const dx = (s.x + s.width/2) - (startX + width/2);
                    const dy = (s.y + s.height/2) - (startY + height/2);
                    if (Math.sqrt(dx*dx + dy*dy) < (size + s.size) / 1.6) { overlap = true; break; }
                }
                attempts++;
            }

            const el = document.createElement('div');
            el.className = `shape ${color} ${type === 'circle' ? 'rounded-full' : 'rounded-xl'}`;
            el.style.width = `${width}px`;
            el.style.height = `${height}px`;
            container.appendChild(el);

            const shape = {
                id: Math.random().toString(36).substr(2, 5),
                el, type, x: startX, y: startY,
                vx: 0, vy: 0, va: 0, angle: 0,
                width, height, size: (width + height) / 2,
                mass: (width * height) / 100,
                isDragging: false
            };

            el.addEventListener('mousedown', (e) => startDrag(e, shape));
            el.addEventListener('touchstart', (e) => startDrag(e, shape), {passive: false});
            shapes.push(shape);
        }

        function startDrag(e, shape) {
            if (modalOverlay.style.display === 'flex') return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            draggingShape = shape;
            shape.isDragging = true;
            dragOffset.x = clientX - shape.x;
            dragOffset.y = clientY - shape.y;
            lastMousePos = { x: clientX, y: clientY };
            clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
                if (draggingShape === shape) { stopDrag(); openModal(shape); }
            }, 500);
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, {passive: false});

        function handleMove(e) {
            if (!draggingShape) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            draggingShape.vx = (clientX - lastMousePos.x);
            draggingShape.vy = (clientY - lastMousePos.y);
            let newX = clientX - dragOffset.x;
            let newY = clientY - dragOffset.y;
            newX = Math.max(0, Math.min(newX, window.innerWidth - draggingShape.width));
            newY = Math.max(HEADER_HEIGHT, Math.min(newY, window.innerHeight - draggingShape.height));
            draggingShape.x = newX;
            draggingShape.y = newY;
            lastMousePos = { x: clientX, y: clientY };
            if (Math.abs(draggingShape.vx) > 3 || Math.abs(draggingShape.vy) > 3) clearTimeout(longPressTimer);
        }

        window.addEventListener('mouseup', stopDrag);
        window.addEventListener('touchend', stopDrag);

        function stopDrag() {
            if (draggingShape) { draggingShape.isDragging = false; draggingShape = null; }
            clearTimeout(longPressTimer);
        }

        function openModal(shape) { activeShape = shape; modalOverlay.style.display = 'flex'; }
        function closeModal() { modalOverlay.style.display = 'none'; activeShape = null; }

        function modifyActiveShape(action, value) {
            if (!activeShape) return;
            if (action === 'delete') {
                container.removeChild(activeShape.el);
                shapes = shapes.filter(s => s !== activeShape);
                closeModal();
            } else if (action === 'scale') {
                activeShape.width *= value; activeShape.height *= value;
                activeShape.size = (activeShape.width + activeShape.height) / 2;
                activeShape.el.style.width = `${activeShape.width}px`;
                activeShape.el.style.height = `${activeShape.height}px`;
            }
        }

        function resolveCollisions() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            for (let i = 0; i < ITERATIONS; i++) {
                for (let j = 0; j < shapes.length; j++) {
                    const s1 = shapes[j];
                    if (s1.x < 0) { s1.x = 0; s1.vx *= -currentBounce; }
                    if (s1.x + s1.width > screenW) { s1.x = screenW - s1.width; s1.vx *= -currentBounce; }
                    if (s1.y < HEADER_HEIGHT) { s1.y = HEADER_HEIGHT; s1.vy *= -currentBounce; }
                    if (s1.y + s1.height > screenH) { 
                        s1.y = screenH - s1.height; s1.vy *= -currentBounce; s1.vx *= currentLinearFriction; 
                        if (canRotate) s1.va *= (currentAngularFriction * 0.9); 
                    }
                    for (let k = j + 1; k < shapes.length; k++) {
                        const s2 = shapes[k];
                        const dx = (s1.x + s1.width / 2) - (s2.x + s2.width / 2);
                        const dy = (s1.y + s1.height / 2) - (s2.y + s2.height / 2);
                        const minWidth = (s1.width + s2.width) / 2;
                        const minHeight = (s1.height + s2.height) / 2;
                        if (Math.abs(dx) < minWidth && Math.abs(dy) < minHeight) {
                            const overlapX = minWidth - Math.abs(dx);
                            const overlapY = minHeight - Math.abs(dy);
                            if (overlapX > SLOP || overlapY > SLOP) {
                                if (overlapX < overlapY) {
                                    const dir = dx > 0 ? 1 : -1;
                                    const sep = overlapX / (s1.isDragging || s2.isDragging ? 1 : 2);
                                    if (!s1.isDragging) s1.x += sep * dir;
                                    if (!s2.isDragging) s2.x -= sep * dir;
                                    const avgVx = (s1.vx + s2.vx) / 2;
                                    s1.vx = avgVx + dir * currentBounce; s2.vx = avgVx - dir * currentBounce;
                                    if (canRotate) {
                                        const torque = (dy / minHeight) * (s1.vx - s2.vx) * 0.05;
                                        s1.va = Math.max(-MAX_VA, Math.min(MAX_VA, s1.va + torque));
                                        s2.va = Math.max(-MAX_VA, Math.min(MAX_VA, s2.va - torque));
                                    }
                                } else {
                                    const dir = dy > 0 ? 1 : -1;
                                    const sep = overlapY / (s1.isDragging || s2.isDragging ? 1 : 2);
                                    if (!s1.isDragging) s1.y += sep * dir;
                                    if (!s2.isDragging) s2.y -= sep * dir;
                                    const avgVy = (s1.vy + s2.vy) / 2;
                                    s1.vy = avgVy + dir * currentBounce; s2.vy = avgVy - dir * currentBounce;
                                    if (canRotate) {
                                        const torque = (dx / minWidth) * (s1.vy - s2.vy) * 0.05;
                                        s1.va = Math.max(-MAX_VA, Math.min(MAX_VA, s1.va + torque));
                                        s2.va = Math.max(-MAX_VA, Math.min(MAX_VA, s2.va - torque));
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        function update() {
            shapes.forEach(s => {
                if (s.isDragging) return;
                s.vx += gravityX; s.vy += gravityY;
                s.vx *= currentLinearFriction; s.vy *= currentLinearFriction;
                if (canRotate) {
                    s.va *= currentAngularFriction;
                    if (Math.abs(s.va) < 0.01) s.va = 0;
                    s.angle += s.va;
                } else { s.va = 0; s.angle = 0; }
                if (Math.abs(s.vx) < SLEEP_THRESHOLD) s.vx = 0;
                if (Math.abs(s.vy) < SLEEP_THRESHOLD && Math.abs(s.vy) < Math.abs(gravityY) * 2) s.vy = 0;
                s.x += s.vx; s.y += s.vy;
            });
            resolveCollisions();
            shapes.forEach(s => { s.el.style.transform = `translate3d(${s.x}px, ${s.y}px, 0) rotate(${s.angle}deg)`; });
            requestAnimationFrame(update);
        }

        async function toggleSensors() {
            if (sensorsActive) {
                sensorsActive = false;
                sensorBtn.classList.remove('bg-blue-600', 'text-white', 'sensor-active');
                gravityX = 0; gravityY = GRAVITY_STRENGTH;
                return;
            }
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') return;
                } catch (err) { return; }
            }
            sensorsActive = true;
            sensorBtn.classList.add('bg-blue-600', 'text-white', 'sensor-active');
            window.addEventListener('deviceorientation', (e) => {
                if (!sensorsActive) return;
                gravityX = (e.gamma / 45) * GRAVITY_STRENGTH;
                gravityY = (e.beta / 45) * GRAVITY_STRENGTH;
            });
        }

        gravitySlider.addEventListener('input', (e) => {
            GRAVITY_STRENGTH = parseFloat(e.target.value);
            if (!sensorsActive) { gravityX = 0; gravityY = GRAVITY_STRENGTH; }
        });
        frictionSlider.addEventListener('input', (e) => {
            frictionSliderVal = parseFloat(e.target.value);
            updatePhysicsParams();
        });
        rotationToggle.addEventListener('change', (e) => {
            canRotate = e.target.checked;
            if (!canRotate) shapes.forEach(s => { s.va = 0; s.angle = 0; });
        });
        sensorBtn.addEventListener('click', toggleSensors);
        addRectBtn.addEventListener('click', () => createShape('rect'));
        addCircleBtn.addEventListener('click', () => createShape('circle'));
        resetBtn.addEventListener('click', () => {
            shapes.forEach(s => container.removeChild(s.el));
            shapes = [];
        });

        requestAnimationFrame(update);
    </script>
</body>
</html>
