<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SolidStack - עולם פיזיקלי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            overflow: hidden;
            touch-action: none;
            background-color: #f0f2f5;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
        }
        /* The Header area should be visually distinct */
        header {
            height: 64px; /* Fixed height for physics boundaries */
        }
        .shape {
            position: absolute;
            left: 0;
            top: 0;
            cursor: grab;
            will-change: transform;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transform-origin: center;
        }
        .shape-triangle {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border: none !important;
        }
        #modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(2px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Compact One-Line Header -->
    <header class="fixed top-0 inset-x-0 z-50 bg-white shadow-sm border-b border-gray-200 px-3 flex items-center justify-center pointer-events-auto">
        <div class="flex items-center gap-4 sm:gap-8 w-full max-w-2xl justify-between">
            
            <!-- Group: Reset and Gravity -->
            <div class="flex items-center gap-3">
                <button id="reset-btn" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-extrabold transition-colors border border-red-100 whitespace-nowrap">
                    איפוס
                </button>

                <div class="flex flex-col items-center min-w-[70px] sm:min-w-[100px]">
                    <label class="text-[9px] text-gray-400 font-bold uppercase mb-0.5">כבידה <span id="gravity-val">0.10</span></label>
                    <input type="range" id="gravity-slider" min="0" max="0.20" step="0.01" value="0.10" class="w-full h-1 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600">
                </div>
            </div>

            <!-- Group: Rotation and Add -->
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-1.5">
                    <input type="checkbox" id="rotation-toggle" class="w-4 h-4 accent-blue-600 cursor-pointer">
                    <label for="rotation-toggle" class="text-xs text-gray-500 font-bold cursor-pointer">סיבוב</label>
                </div>

                <button id="add-btn" class="bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
            </div>

        </div>
    </header>

    <div id="game-container"></div>

    <!-- Context Modal - Icons Only -->
    <div id="modal-overlay">
        <div class="bg-white rounded-3xl p-3 shadow-2xl border border-gray-100 flex items-center gap-2">
            <button onclick="modifyActiveShape('scale', 1.1)" class="w-14 h-14 flex items-center justify-center bg-gray-50 hover:bg-blue-50 rounded-2xl text-2xl">➕</button>
            <button onclick="modifyActiveShape('scale', 0.9)" class="w-14 h-14 flex items-center justify-center bg-gray-50 hover:bg-blue-50 rounded-2xl text-2xl">➖</button>
            <div class="w-px h-8 bg-gray-200 mx-1"></div>
            <button onclick="modifyActiveShape('delete')" class="w-14 h-14 flex items-center justify-center bg-red-50 text-red-600 rounded-2xl text-2xl">🗑️</button>
            <div class="w-px h-8 bg-gray-200 mx-1"></div>
            <button onclick="closeModal()" class="w-14 h-14 flex items-center justify-center text-gray-400 text-2xl">✕</button>
        </div>
    </div>

    <script>
        /** PHYSICS & BOUNDARY CONSTANTS **/
        const HEADER_HEIGHT = 64; // Matches header height in CSS
        let GRAVITY = 0.10; 
        const FRICTION = 0.97;          
        const ANGULAR_FRICTION = 0.92;  
        const ITERATIONS = 3;           
        const BOUNCE = 0.15;            
        const SLEEP_THRESHOLD = 0.05;   
        const MAX_VA = 10;              
        const SLOP = 0.5;               

        const container = document.getElementById('game-container');
        const gravitySlider = document.getElementById('gravity-slider');
        const gravityVal = document.getElementById('gravity-val');
        const rotationToggle = document.getElementById('rotation-toggle');
        const addBtn = document.getElementById('add-btn');
        const resetBtn = document.getElementById('reset-btn');
        const modalOverlay = document.getElementById('modal-overlay');

        let shapes = [];
        let activeShape = null; 
        let draggingShape = null;
        let dragOffset = { x: 0, y: 0 };
        let lastMousePos = { x: 0, y: 0 };
        let longPressTimer = null;
        let canRotate = false; 

        const randomColor = () => {
            const colors = ['bg-blue-500', 'bg-red-500', 'bg-green-500', 'bg-yellow-500', 'bg-purple-500', 'bg-pink-500', 'bg-indigo-500', 'bg-orange-500', 'bg-teal-500', 'bg-cyan-500'];
            return colors[Math.floor(Math.random() * colors.length)];
        };

        function createShape() {
            const types = ['rect', 'circle', 'triangle'];
            const type = types[Math.floor(Math.random() * types.length)];
            const size = 60 + Math.random() * 40;
            const width = type === 'rect' ? size * (0.8 + Math.random() * 0.4) : size;
            const height = size;
            const color = randomColor();

            let startX, startY;
            let attempts = 0;
            let overlap = true;

            while (overlap && attempts < 100) {
                startX = Math.random() * (window.innerWidth - width);
                // Ensure spawn is below the header
                startY = HEADER_HEIGHT + 20 + Math.random() * 100;
                overlap = false;
                for (let s of shapes) {
                    const dx = (s.x + s.width/2) - (startX + width/2);
                    const dy = (s.y + s.height/2) - (startY + height/2);
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < (size + s.size) / 1.5) { overlap = true; break; }
                }
                attempts++;
            }

            const el = document.createElement('div');
            el.className = `shape ${color} ${type === 'circle' ? 'rounded-full' : (type === 'rect' ? 'rounded-2xl' : 'shape-triangle')}`;
            el.style.width = `${width}px`;
            el.style.height = `${height}px`;
            container.appendChild(el);

            const shape = {
                id: Math.random().toString(36).substr(2, 5),
                el, type, x: startX, y: startY,
                vx: 0, vy: 0, va: 0, angle: 0,
                width, height, size: (width + height) / 2,
                mass: (width * height) / 100,
                isDragging: false
            };

            el.addEventListener('mousedown', (e) => startDrag(e, shape));
            el.addEventListener('touchstart', (e) => startDrag(e, shape), {passive: false});

            shapes.push(shape);
        }

        function startDrag(e, shape) {
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            draggingShape = shape;
            shape.isDragging = true;
            dragOffset.x = clientX - shape.x;
            dragOffset.y = clientY - shape.y;
            lastMousePos = { x: clientX, y: clientY };

            clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
                if (draggingShape === shape) { stopDrag(); openModal(shape); }
            }, 500);
        }

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, {passive: false});

        function handleMove(e) {
            if (!draggingShape) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            draggingShape.vx = (clientX - lastMousePos.x);
            draggingShape.vy = (clientY - lastMousePos.y);

            let newX = clientX - dragOffset.x;
            let newY = clientY - dragOffset.y;

            // Clamping drag within boundaries including the header
            newX = Math.max(0, Math.min(newX, window.innerWidth - draggingShape.width));
            newY = Math.max(HEADER_HEIGHT, Math.min(newY, window.innerHeight - draggingShape.height));

            draggingShape.x = newX;
            draggingShape.y = newY;

            lastMousePos = { x: clientX, y: clientY };
            if (Math.abs(draggingShape.vx) > 3 || Math.abs(draggingShape.vy) > 3) clearTimeout(longPressTimer);
        }

        window.addEventListener('mouseup', stopDrag);
        window.addEventListener('touchend', stopDrag);

        function stopDrag() {
            if (draggingShape) { draggingShape.isDragging = false; draggingShape = null; }
            clearTimeout(longPressTimer);
        }

        function openModal(shape) { activeShape = shape; modalOverlay.style.display = 'flex'; }
        function closeModal() { modalOverlay.style.display = 'none'; activeShape = null; }

        function modifyActiveShape(action, value) {
            if (!activeShape) return;
            if (action === 'delete') {
                container.removeChild(activeShape.el);
                shapes = shapes.filter(s => s !== activeShape);
            } else if (action === 'scale') {
                activeShape.width *= value;
                activeShape.height *= value;
                activeShape.size = (activeShape.width + activeShape.height) / 2;
                activeShape.el.style.width = `${activeShape.width}px`;
                activeShape.el.style.height = `${activeShape.height}px`;
            }
            closeModal();
        }

        function resolveCollisions() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            for (let i = 0; i < ITERATIONS; i++) {
                for (let j = 0; j < shapes.length; j++) {
                    const s1 = shapes[j];
                    
                    // Boundaries
                    if (s1.x < 0) { s1.x = 0; s1.vx *= -BOUNCE; }
                    if (s1.x + s1.width > screenW) { s1.x = screenW - s1.width; s1.vx *= -BOUNCE; }
                    
                    // Header Boundary (Top)
                    if (s1.y < HEADER_HEIGHT) { 
                        s1.y = HEADER_HEIGHT; 
                        s1.vy *= -BOUNCE; 
                    }
                    
                    // Floor Boundary (Bottom)
                    if (s1.y + s1.height > screenH) { 
                        s1.y = screenH - s1.height; 
                        s1.vy *= -BOUNCE; 
                        s1.vx *= FRICTION; 
                        if (canRotate) s1.va *= 0.8; 
                    }

                    for (let k = j + 1; k < shapes.length; k++) {
                        const s2 = shapes[k];
                        const dx = (s1.x + s1.width / 2) - (s2.x + s2.width / 2);
                        const dy = (s1.y + s1.height / 2) - (s2.y + s2.height / 2);
                        const minWidth = (s1.width + s2.width) / 2;
                        const minHeight = (s1.height + s2.height) / 2;

                        if (Math.abs(dx) < minWidth && Math.abs(dy) < minHeight) {
                            const overlapX = minWidth - Math.abs(dx);
                            const overlapY = minHeight - Math.abs(dy);

                            if (overlapX > SLOP || overlapY > SLOP) {
                                if (overlapX < overlapY) {
                                    const dir = dx > 0 ? 1 : -1;
                                    const sep = overlapX / (s1.isDragging || s2.isDragging ? 1 : 2);
                                    if (!s1.isDragging) s1.x += sep * dir;
                                    if (!s2.isDragging) s2.x -= sep * dir;
                                    const avgVx = (s1.vx + s2.vx) / 2;
                                    s1.vx = avgVx + dir * BOUNCE;
                                    s2.vx = avgVx - dir * BOUNCE;
                                    if (canRotate) {
                                        const torque = (dy / minHeight) * (s1.vx - s2.vx) * 0.05;
                                        s1.va = Math.max(-MAX_VA, Math.min(MAX_VA, s1.va + torque));
                                        s2.va = Math.max(-MAX_VA, Math.min(MAX_VA, s2.va - torque));
                                    }
                                } else {
                                    const dir = dy > 0 ? 1 : -1;
                                    const sep = overlapY / (s1.isDragging || s2.isDragging ? 1 : 2);
                                    if (!s1.isDragging) s1.y += sep * dir;
                                    if (!s2.isDragging) s2.y -= sep * dir;
                                    const avgVy = (s1.vy + s2.vy) / 2;
                                    s1.vy = avgVy + dir * BOUNCE;
                                    s2.vy = avgVy - dir * BOUNCE;
                                    if (canRotate) {
                                        const torque = (dx / minWidth) * (s1.vy - s2.vy) * 0.05;
                                        s1.va = Math.max(-MAX_VA, Math.min(MAX_VA, s1.va + torque));
                                        s2.va = Math.max(-MAX_VA, Math.min(MAX_VA, s2.va - torque));
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        function update() {
            shapes.forEach(s => {
                if (s.isDragging) return;
                s.vy += GRAVITY;
                s.vx *= FRICTION;
                s.vy *= FRICTION;
                if (canRotate) {
                    s.va *= ANGULAR_FRICTION;
                    if (Math.abs(s.va) < 0.01) s.va = 0;
                    s.angle += s.va;
                } else { s.va = 0; s.angle = 0; }
                if (Math.abs(s.vx) < SLEEP_THRESHOLD) s.vx = 0;
                if (Math.abs(s.vy) < SLEEP_THRESHOLD && Math.abs(s.vy) < 0.1) s.vy = 0;
                s.x += s.vx; s.y += s.vy;
            });
            resolveCollisions();
            shapes.forEach(s => {
                s.el.style.transform = `translate3d(${s.x}px, ${s.y}px, 0) rotate(${s.angle}deg)`;
            });
            requestAnimationFrame(update);
        }

        gravitySlider.addEventListener('input', (e) => {
            GRAVITY = parseFloat(e.target.value);
            gravityVal.textContent = GRAVITY.toFixed(2);
        });
        rotationToggle.addEventListener('change', (e) => {
            canRotate = e.target.checked;
            if (!canRotate) shapes.forEach(s => { s.va = 0; s.angle = 0; });
        });
        addBtn.addEventListener('click', createShape);
        resetBtn.addEventListener('click', () => {
            shapes.forEach(s => container.removeChild(s.el));
            shapes = [];
        });

        requestAnimationFrame(update);
    </script>
</body>
</html>
