<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 80%;
            max-width: 400px;
        }
        .timer {
            font-size: 5rem;
            font-weight: 700;
            margin: 1.5rem 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            font-variant-numeric: tabular-nums;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 2rem;
        }
        .reset {
            grid-column: span 2;
        }
        button {
            font-size: 1.2rem;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #6e8efb;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:active {
            transform: scale(0.95);
        }
        button:disabled {
            background: rgba(255, 255, 255, 0.5);
            color: #999;
            cursor: not-allowed;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }
        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
        .modal button {
            flex: 1;
            color: white;
            padding: 0.8rem;
        }
        .confirm {
            background: #6e8efb;
        }
        .cancel {
            background: #fb6e6e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer" id="timer">0:00</div>
        <div class="buttons">
            <button id="startBtn">Start</button>
            <button id="pauseBtn" disabled>Pause</button>
            <button id="resetBtn" class="reset">Reset</button>
        </div>
    </div>

    <div class="modal" id="resetModal">
        <div class="modal-content">
            <h2 style="color: #333; margin-top: 0;">Reset Timer?</h2>
            <p style="color: #666;">Are you sure you want to reset the timer?</p>
            <div class="modal-buttons">
                <button class="cancel" id="cancelReset">Cancel</button>
                <button class="confirm" id="confirmReset">Reset</button>
            </div>
        </div>
    </div>

    <script>
        let seconds = 0;
        let minutes = 0;
        let timerId = null;
        
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resetModal = document.getElementById('resetModal');
        const confirmResetBtn = document.getElementById('confirmReset');
        const cancelResetBtn = document.getElementById('cancelReset');

        function updateDisplay() {
            timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerId) return;
            
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            timerId = setInterval(() => {
                seconds++;
                if (seconds >= 60) {
                    seconds = 0;
                    minutes++;
                }
                if (minutes >= 60) {
                    clearInterval(timerId);
                    timerId = null;
                    startBtn.disabled = true;
                    pauseBtn.disabled = true;
                }
                updateDisplay();
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }

        function showResetModal() {
            resetModal.style.display = 'flex';
        }

        function hideResetModal() {
            resetModal.style.display = 'none';
        }

        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            seconds = 0;
            minutes = 0;
            updateDisplay();
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            hideResetModal();
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', showResetModal);
        confirmResetBtn.addEventListener('click', resetTimer);
        cancelResetBtn.addEventListener('click', hideResetModal);
    </script>
</body>
</html>
