<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>מחשבון דופק ונשימה מקצועי</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --primary-text: #ffffff;
            --accent-glow: #00d2ff;
            --accent-mint: #3ae374;
            --accent-danger: #ff4d4d;
            --accent-gold: #fffa65;
            --card-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--primary-text);
            height: 100vh;
            height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* מניעת גלילה לחלוטין */
            touch-action: manipulation;
        }

        /* Header Area - מצומצם למינימום ההכרחי */
        .header {
            flex: 0 0 12vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .timer-display {
            font-size: clamp(2.5rem, 6vh, 4rem);
            font-weight: 900;
            color: var(--accent-glow);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .subtitle {
            font-size: clamp(0.6rem, 1.5vh, 0.8rem);
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* Main Dashboard Area - גמיש אך ניתן לכיווץ */
        .main-content {
            flex: 1 1 18vh;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .results-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 380px;
        }

        .count-area {
            flex: 1;
            text-align: center;
            border-right: 1px solid var(--glass-border);
            padding-right: 8px;
        }

        .count-label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            display: block;
        }

        .number-box {
            font-size: clamp(1.8rem, 5vh, 2.5rem);
            font-weight: 900;
            color: var(--accent-mint);
        }

        .calculations-stack {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .calc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            border-radius: 8px;
        }

        .calc-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .calc-value {
            font-size: clamp(1rem, 2.2vh, 1.3rem);
            font-weight: 900;
            color: var(--accent-glow);
        }

        /* Numpad Container - גובה קבוע אך נמוך יותר */
        .numpad-container {
            flex: 0 0 45vh;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px 20px 0 0;
            padding: 10px;
            display: flex;
            align-items: center;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
        }

        .numpad button {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: white;
            padding: clamp(8px, 2.5vh, 18px) 0;
            font-size: clamp(1.2rem, 3.5vh, 1.8rem);
            border-radius: 12px;
            font-weight: 600;
        }

        .numpad button:active {
            background: var(--accent-glow);
            color: #000;
            transform: scale(0.95);
        }

        .numpad .btn-clear { color: var(--accent-danger); background: rgba(255, 77, 77, 0.1); }
        .numpad .btn-back { color: rgba(255, 255, 255, 0.3); }

        /* Controls Area - תמיד גלוי למטה */
        .controls {
            flex: 0 0 25vh;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }

        .control-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            border: none;
            border-radius: 14px;
            padding: clamp(10px, 2.2vh, 16px);
            font-size: clamp(0.9rem, 2vh, 1.1rem);
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-start { background: var(--accent-mint); color: #0b2010; }
        .btn-pause { background: var(--accent-gold); color: #202000; }
        
        /* כפתור איפוס - בולט, גדול ותופס את כל הרוחב */
        .btn-reset {
            background-color: var(--accent-danger);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4);
            width: 100%;
            margin-top: 2px;
        }

        .btn-reset:active:not(:disabled) {
            transform: scale(0.98);
            filter: brightness(0.8);
        }

        .btn:disabled { 
            opacity: 0.2; 
            filter: grayscale(1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #111;
            padding: 25px;
            border-radius: 24px;
            width: 80%;
            max-width: 300px;
            text-align: center;
            border: 1px solid var(--glass-border);
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btns button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
        }

        @keyframes pulse-glow {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .timer-running {
            animation: pulse-glow 1.5s infinite ease-in-out;
            color: var(--accent-mint) !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="timer-display" id="timer">00:00</div>
        <div class="subtitle">זמן מדידה ⏱️</div>
    </div>

    <div class="main-content">
        <div class="results-card">
            <div class="count-area">
                <span class="count-label">ספירה 🔢</span>
                <div class="number-box" id="numberBox">00</div>
            </div>
            <div class="calculations-stack">
                <div class="calc-item">
                    <span class="calc-label">קצב (X2)</span>
                    <span class="calc-value" id="calcX2">0</span>
                </div>
                <div class="calc-item">
                    <span class="calc-label">קצב (X4)</span>
                    <span class="calc-value" id="calcX4">0</span>
                </div>
            </div>
        </div>
    </div>

    <div class="numpad-container">
        <div class="numpad">
            <button onclick="appendNumber(1)">1</button>
            <button onclick="appendNumber(2)">2</button>
            <button onclick="appendNumber(3)">3</button>
            <button onclick="appendNumber(4)">4</button>
            <button onclick="appendNumber(5)">5</button>
            <button onclick="appendNumber(6)">6</button>
            <button onclick="appendNumber(7)">7</button>
            <button onclick="appendNumber(8)">8</button>
            <button onclick="appendNumber(9)">9</button>
            <button class="btn-clear" onclick="clearInput()">C</button>
            <button onclick="appendNumber(0)">0</button>
            <button class="btn-back" onclick="backspace()">⌫</button>
        </div>
    </div>

    <div class="controls">
        <div class="control-row">
            <button class="btn btn-start" id="startBtn">התחל ▶️</button>
            <button class="btn btn-pause" id="pauseBtn" disabled>השהה ⏸️</button>
        </div>
        <button class="btn btn-reset" id="resetBtn">איפוס נתונים 🧼</button>
    </div>

    <div class="modal" id="resetModal">
        <div class="modal-content">
            <h2 style="color: var(--accent-danger); margin-bottom: 10px;">לאפס הכל? 🧼</h2>
            <div class="modal-btns">
                <button style="background: rgba(255,255,255,0.1); color: white;" id="cancelReset">ביטול</button>
                <button style="background: var(--accent-danger); color: white;" id="confirmReset">אישור</button>
            </div>
        </div>
    </div>

    <script>
        let timerId = null;
        let elapsedTime = 0; 
        let startTime = 0;
        let numericInput = "";

        const timerDisplay = document.getElementById('timer');
        const numberBox = document.getElementById('numberBox');
        const calcX2Display = document.getElementById('calcX2');
        const calcX4Display = document.getElementById('calcX4');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resetModal = document.getElementById('resetModal');
        const confirmResetBtn = document.getElementById('confirmReset');
        const cancelResetBtn = document.getElementById('cancelReset');

        function updateTimerDisplay() {
            const totalSeconds = Math.floor(elapsedTime / 1000);
            const mins = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerId) return;
            startTime = Date.now() - elapsedTime;
            timerId = setInterval(() => {
                elapsedTime = Date.now() - startTime;
                updateTimerDisplay();
            }, 100);
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            timerDisplay.classList.add('timer-running');
        }

        function stopTimer() {
            clearInterval(timerId);
            timerId = null;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            timerDisplay.classList.remove('timer-running');
        }

        function updateNumberBox() {
            numberBox.textContent = numericInput.padStart(2, '0');
            const val = parseInt(numericInput) || 0;
            calcX2Display.textContent = (val * 2);
            calcX4Display.textContent = (val * 4);
        }

        function appendNumber(num) {
            if (numericInput.length >= 2) return;
            numericInput += num;
            updateNumberBox();
        }

        function clearInput() {
            numericInput = "";
            updateNumberBox();
        }

        function backspace() {
            numericInput = numericInput.slice(0, -1);
            updateNumberBox();
        }

        function resetAll() {
            stopTimer();
            elapsedTime = 0;
            numericInput = "";
            updateTimerDisplay();
            updateNumberBox();
            resetModal.style.display = 'none';
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', stopTimer);
        resetBtn.addEventListener('click', () => resetModal.style.display = 'flex');
        confirmResetBtn.addEventListener('click', resetAll);
        cancelResetBtn.addEventListener('click', () => resetModal.style.display = 'none');

        updateTimerDisplay();
    </script>
</body>
</html>
