<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מחשבון דופק ונשימה עליז</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            --primary-text: #4a4a4a;
            --accent-sunny: #ffd93d;
            --accent-teal: #4ecdc4;
            --accent-coral: #ff6b6b;
            --card-bg: rgba(255, 255, 255, 0.9);
            --btn-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--primary-text);
            height: 100vh;
            height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Header / Timer Area */
        .header {
            padding: 25px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 3px solid var(--accent-sunny);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .timer-display {
            font-size: clamp(3.5rem, 12vh, 5rem);
            font-weight: 900;
            color: var(--accent-coral);
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 600;
            color: #888;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* Main Dashboard Area */
        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .results-card {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 32px rgba(255, 107, 107, 0.2);
            border: 2px solid white;
        }

        .count-area {
            flex: 1;
            text-align: center;
            border-right: 2px dashed #eee;
            padding-right: 15px;
        }

        .count-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .number-box {
            font-size: 3rem;
            font-weight: 900;
            color: var(--accent-teal);
            text-shadow: 1px 1px 0px white;
        }

        .calculations-stack {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .calc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 15px;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #f0f0f0;
        }

        .calc-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #666;
        }

        .calc-value {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--accent-coral);
        }

        /* Numpad Area */
        .numpad-container {
            background: white;
            border-radius: 35px 35px 0 0;
            padding: 15px 15px 5px 15px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .numpad button {
            background: #fff5f5;
            border: 2px solid transparent;
            color: var(--primary-text);
            padding: 18px 0;
            font-size: 1.6rem;
            border-radius: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .numpad button:active {
            background: var(--accent-sunny);
            transform: scale(0.92);
            border-color: white;
        }

        .numpad .btn-clear { color: var(--accent-coral); background: #fff0f0; }
        .numpad .btn-back { color: #aaa; }

        /* Control Area */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
            background: white;
        }

        .btn {
            border: none;
            border-radius: 20px;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--btn-shadow);
        }

        .btn-start {
            background-color: var(--accent-teal);
            color: white;
        }

        .btn-pause {
            background-color: var(--accent-sunny);
            color: var(--primary-text);
        }

        .btn-reset {
            background-color: transparent;
            color: #ccc;
            grid-column: span 2;
            padding: 10px;
            font-size: 0.85rem;
            box-shadow: none;
            text-decoration: underline;
        }

        .btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn:disabled {
            opacity: 0.4;
            filter: grayscale(1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 107, 107, 0.4);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 35px;
            border-radius: 35px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        .modal-btns {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .modal-btns button {
            flex: 1;
            padding: 15px;
            border-radius: 18px;
            border: none;
            font-weight: 800;
            cursor: pointer;
        }

        /* Pulse Animation when running */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .timer-running {
            animation: pulse 1s infinite ease-in-out;
            color: var(--accent-coral) !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="timer-display" id="timer">00:00</div>
        <div class="subtitle">זמן מדידה ⏱️</div>
    </div>

    <div class="main-content">
        <div class="results-card">
            <div class="count-area">
                <span class="count-label">ספירה 🔢</span>
                <div class="number-box" id="numberBox">00</div>
            </div>
            <div class="calculations-stack">
                <div class="calc-item">
                    <span class="calc-label">קצב (X2)</span>
                    <span class="calc-value" id="calcX2">0</span>
                </div>
                <div class="calc-item">
                    <span class="calc-label">קצב (X4)</span>
                    <span class="calc-value" id="calcX4">0</span>
                </div>
            </div>
        </div>
    </div>

    <div class="numpad-container">
        <div class="numpad">
            <button onclick="appendNumber(1)">1</button>
            <button onclick="appendNumber(2)">2</button>
            <button onclick="appendNumber(3)">3</button>
            <button onclick="appendNumber(4)">4</button>
            <button onclick="appendNumber(5)">5</button>
            <button onclick="appendNumber(6)">6</button>
            <button onclick="appendNumber(7)">7</button>
            <button onclick="appendNumber(8)">8</button>
            <button onclick="appendNumber(9)">9</button>
            <button class="btn-clear" onclick="clearInput()">C</button>
            <button onclick="appendNumber(0)">0</button>
            <button class="btn-back" onclick="backspace()">⌫</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-start" id="startBtn">התחל ▶️</button>
        <button class="btn btn-pause" id="pauseBtn" disabled>השהה ⏸️</button>
        <button class="btn btn-reset" id="resetBtn">איפוס נתונים</button>
    </div>

    <div class="modal" id="resetModal">
        <div class="modal-content">
            <h2 style="color: var(--accent-coral); margin-bottom: 10px;">לאפס הכל? 🧼</h2>
            <p style="color: #888;">האם אתה בטוח שברצונך למחוק את כל הנתונים?</p>
            <div class="modal-btns">
                <button style="background: #f1f3f5; color: #888;" id="cancelReset">ביטול</button>
                <button style="background: var(--accent-coral); color: white;" id="confirmReset">אישור</button>
            </div>
        </div>
    </div>

    <script>
        let timerId = null;
        let elapsedTime = 0; 
        let startTime = 0;
        let numericInput = "";

        const timerDisplay = document.getElementById('timer');
        const numberBox = document.getElementById('numberBox');
        const calcX2Display = document.getElementById('calcX2');
        const calcX4Display = document.getElementById('calcX4');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resetModal = document.getElementById('resetModal');
        const confirmResetBtn = document.getElementById('confirmReset');
        const cancelResetBtn = document.getElementById('cancelReset');

        function updateTimerDisplay() {
            const totalSeconds = Math.floor(elapsedTime / 1000);
            const mins = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerId) return;
            startTime = Date.now() - elapsedTime;
            timerId = setInterval(() => {
                elapsedTime = Date.now() - startTime;
                updateTimerDisplay();
            }, 100);
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            timerDisplay.classList.add('timer-running');
        }

        function stopTimer() {
            clearInterval(timerId);
            timerId = null;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            timerDisplay.classList.remove('timer-running');
        }

        function updateNumberBox() {
            numberBox.textContent = numericInput.padStart(2, '0');
            const val = parseInt(numericInput) || 0;
            calcX2Display.textContent = (val * 2);
            calcX4Display.textContent = (val * 4);
        }

        function appendNumber(num) {
            if (numericInput.length >= 2) return;
            numericInput += num;
            updateNumberBox();
        }

        function clearInput() {
            numericInput = "";
            updateNumberBox();
        }

        function backspace() {
            numericInput = numericInput.slice(0, -1);
            updateNumberBox();
        }

        function resetAll() {
            stopTimer();
            elapsedTime = 0;
            numericInput = "";
            updateTimerDisplay();
            updateNumberBox();
            resetModal.style.display = 'none';
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', stopTimer);
        resetBtn.addEventListener('click', () => resetModal.style.display = 'flex');
        confirmResetBtn.addEventListener('click', resetAll);
        cancelResetBtn.addEventListener('click', () => resetModal.style.display = 'none');

        updateTimerDisplay();
    </script>
</body>
</html>
