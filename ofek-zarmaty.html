<style>
  :root{
    --bg:#000;
    --surface:#1b1b1d;
    --surface-2:#262628;
    --surface-3:#323236;
    --accent:#5b9bf8;
    --accent-dim:#2f4d78;
    --text:#fff;
    --text-2:#9a9aa0;
    --text-3:#6a6a70;
    --radius:16px;
    --radius-sm:11px;
    --nav-h:76px;
    --maxw:1100px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Heebo",-apple-system,"Segoe UI",Arial,sans-serif;
    font-size:16px;
    line-height:1.5;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(0,0,0,.88);
    backdrop-filter:saturate(150%) blur(14px);
    padding:14px 0 10px;
  }
  .brandrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .brand{font-weight:900;font-size:20px;letter-spacing:-.2px}
  .brand span{color:var(--accent)}
  .count{margin-inline-start:auto;font-size:12px;color:var(--text-3);font-weight:500}

  .segmented{
    display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;
  }
  .segmented button{
    flex:1;padding:9px 6px;border-radius:999px;font-weight:700;font-size:15px;
    color:var(--text-2);transition:background .18s ease,color .18s ease;
  }
  .segmented button[aria-selected="true"]{background:var(--accent);color:#04101f}
  .segmented button[disabled]{color:var(--text-3);cursor:not-allowed}

  .searchwrap{position:relative;margin-top:12px}
  .searchwrap input{
    width:100%;background:var(--surface-2);border:0;border-radius:12px;
    padding:12px 44px 12px 14px;color:var(--text);font-size:15px;font-family:inherit;
  }
  .searchwrap input::placeholder{color:var(--text-3)}
  .searchwrap svg{
    position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;fill:none;stroke:var(--text-3);stroke-width:2;pointer-events:none;
  }

  /* ---------- sub header (inside a collection) ---------- */
  .subhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .backbtn{
    display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
    background:var(--surface-2);flex:none;
  }
  .backbtn svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:2.4}
  .subhead h1{margin:0;font-size:19px;font-weight:900;color:var(--accent);letter-spacing:-.2px}

  /* ---------- content ---------- */
  main{padding-top:18px}
  .sectitle{
    font-size:13px;font-weight:700;color:var(--text-3);letter-spacing:.4px;
    margin:26px 0 10px;
  }
  .sectitle:first-child{margin-top:0}

  .grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
  @media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
  @media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:359px){.grid{grid-template-columns:1fr}}

  .card{
    background:var(--surface);border-radius:var(--radius);overflow:hidden;
    display:flex;flex-direction:column;text-align:start;
    transition:transform .16s ease,background .16s ease;
  }
  .card:hover,.card:focus-visible{background:var(--surface-2);transform:translateY(-2px)}
  .thumb{
    aspect-ratio:1/1;position:relative;display:grid;place-items:center;overflow:hidden;
    background:linear-gradient(150deg,#1f2a3a,#0e1620);
  }
  .thumb.wide{aspect-ratio:16/9}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .glyph{font-size:40px;line-height:1;filter:saturate(1.1)}
  .thumb .ring{
    position:absolute;inset:14%;border:1.5px solid rgba(255,255,255,.14);border-radius:50%;
  }
  .play{
    position:absolute;inset-block-end:8px;inset-inline-start:8px;
    background:rgba(0,0,0,.65);border-radius:6px;padding:2px 7px;
    font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;
  }
  .play svg{width:10px;height:10px;fill:#fff}
  .cardbody{padding:11px 12px 13px}
  .cardtitle{font-size:14.5px;font-weight:700;line-height:1.35}
  .cardmeta{font-size:11.5px;color:var(--text-3);margin-top:5px;font-weight:500}
  .badge{
    display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;
    background:var(--accent-dim);color:#bcd8ff;margin-inline-start:6px;vertical-align:1px;
  }
  .badge.warn{background:#4a3a1c;color:#f0cd8a}

  .empty{
    text-align:center;color:var(--text-3);padding:56px 20px;font-size:15px;
  }
  .empty strong{display:block;color:var(--text-2);font-weight:700;margin-bottom:6px;font-size:17px}

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:fixed;inset-inline:0;bottom:0;z-index:50;
    background:rgba(18,18,20,.96);backdrop-filter:blur(14px);
    border-top:1px solid #232326;
    display:flex;padding:8px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottomnav div{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:11px;font-weight:600;color:var(--text-3);
  }
  .bottomnav div.on{color:var(--text);font-weight:700}
  .bottomnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- detail sheet ---------- */
  .sheet{
    position:fixed;inset:0;z-index:60;background:#000;
    display:flex;flex-direction:column;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .sheet.open{opacity:1;pointer-events:auto}
  .sheet .close{
    align-self:flex-start;margin:16px;display:grid;place-items:center;
    width:40px;height:40px;
  }
  .sheet .close svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
  .sheetbody{padding:8px 26px 40px;max-width:640px;width:100%;margin:0 auto}
  .sheetbody h2{font-size:33px;font-weight:900;margin:22px 0 14px;line-height:1.2;letter-spacing:-.5px}
  .sheetbody p{color:var(--text-2);font-size:17px;margin:0 0 22px;line-height:1.45}
  .sheetdate{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:14.5px;margin-bottom:26px}
  .sheetdate svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
  .openlink{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    background:var(--accent);color:#04101f;font-weight:700;font-size:19px;
    padding:17px;border-radius:14px;transition:filter .15s ease;
  }
  .openlink:hover{filter:brightness(1.08)}
  .openlink svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2}
  .note{
    margin-top:18px;background:#1d1a12;border:1px solid #3a3018;border-radius:12px;
    padding:12px 14px;color:#e0c68f;font-size:13.5px;line-height:1.5;
  }

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .card:hover{transform:none}
  }
</style>
</head>

/* ---------- flatten for search & counters ---------- */
function itemsOf(col){
  return col.items || col.groups.reduce((a,g)=>a.concat(g.items),[]);
}
const ALL = {};
for(const tab in DATA){
  ALL[tab] = DATA[tab].reduce((a,c)=>a.concat(itemsOf(c).map(i=>Object.assign({_col:c.title}, i))), []);
}

/* ---------- rendering ---------- */
const view = document.getElementById("view");
const countEl = document.getElementById("count");
let tab = "guides";
let open = null;   // open collection id, or null

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function thumbHTML(it, wide){
  if(it.kind === "video"){
    return '<div class="thumb'+(wide?" wide":"")+'">'+
      '<img loading="lazy" src="'+it.thumb+'" alt="" onerror="this.remove()">'+
      '<span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Video</span></div>';
  }
  return '<div class="thumb'+(wide?" wide":"")+'"><span class="ring"></span><span class="glyph">'+it.glyph+'</span></div>';
}

function cardHTML(it, idx, key){
  const meta = it.kind==="pdf" ? "PDF" : it.kind==="link" ? "קישור" : "סרטון";
  const warn = it.note ? '<span class="badge warn">לבדיקה</span>' : "";
  return '<button class="card" data-open="'+key+':'+idx+'">'+
    thumbHTML(it, it.kind==="video")+
    '<div class="cardbody"><div class="cardtitle">'+esc(it.title)+warn+'</div>'+
    '<div class="cardmeta">'+meta+(it.sub&&it.kind!=="video"?" · "+esc(it.sub.slice(0,42)):"")+'</div></div></button>';
}

function collectionCardHTML(col){
  const n = itemsOf(col).length;
  return '<button class="card" data-col="'+col.id+'">'+
    '<div class="thumb"><span class="ring"></span><span class="glyph">'+col.glyph+'</span></div>'+
    '<div class="cardbody"><div class="cardtitle">'+esc(col.title)+'</div>'+
    '<div class="cardmeta">'+n+' פריטים</div></div></button>';
}

function render(){
  const q = document.getElementById("q").value.trim();

  /* search across the whole tab */
  if(q){
    const hits = ALL[tab].filter(i =>
      i.title.includes(q) || (i.sub||"").includes(q) || i._col.includes(q));
    countEl.textContent = hits.length + " תוצאות";
    view.innerHTML = hits.length
      ? '<div class="grid">'+hits.map((it,i)=>cardHTML(it,i,"search")).join("")+'</div>'
      : '<div class="empty"><strong>אין תוצאות</strong>נסה מילה אחרת, או נקה את החיפוש כדי לחזור לרשימה.</div>';
    window._search = hits;
    return;
  }

  /* inside a collection */
  if(open){
    const col = DATA[tab].find(c=>c.id===open);
    if(!col){ open=null; return render(); }
    const items = itemsOf(col);
    countEl.textContent = items.length + " פריטים";
    let html = '<div class="subhead"><button class="backbtn" data-back aria-label="חזרה">'+
      '<svg viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></svg></button>'+
      '<h1>'+esc(col.title)+'</h1></div>';
    if(col.sub) html += '<div class="sectitle" style="margin:0 0 18px">'+esc(col.sub)+'</div>';
    if(col.groups){
      col.groups.forEach((g,gi)=>{
        html += '<div class="sectitle">'+esc(g.name)+'</div><div class="grid">'+
          g.items.map((it,i)=>cardHTML(it,i,"g"+gi)).join("")+'</div>';
      });
    } else {
      html += '<div class="grid">'+col.items.map((it,i)=>cardHTML(it,i,"i")).join("")+'</div>';
    }
    view.innerHTML = html;
    return;
  }

  /* collection index */
  const cols = DATA[tab];
  countEl.textContent = ALL[tab].length + " פריטים";
  view.innerHTML = cols.length
    ? '<div class="grid">'+cols.map(collectionCardHTML).join("")+'</div>'
    : '<div class="empty"><strong>אין כאן תוכן עדיין</strong>כשיגיעו טפסים, הם יופיעו בלשונית הזאת.</div>';
}

/* ---------- detail sheet ---------- */
const sheet = document.getElementById("sheet");
let lastFocus = null;

function openSheet(it){
  lastFocus = document.activeElement;
  document.getElementById("sheetTitle").textContent = it.title;
  document.getElementById("sheetDesc").textContent = it.sub || "";
  document.getElementById("sheetDate").textContent = "נוסף ב-" + ADDED;
  document.getElementById("sheetLink").href = it.url;
  const note = document.getElementById("sheetNote");
  if(it.note){ note.textContent = it.note; note.hidden = false; }
  else note.hidden = true;
  sheet.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("sheetClose").focus();
}
function closeSheet(){
  sheet.classList.remove("open");
  document.body.style.overflow = "";
  if(lastFocus) lastFocus.focus();
}

function resolve(key, idx){
  if(key === "search") return window._search[idx];
  const col = DATA[tab].find(c=>c.id===open);
  if(key === "i") return col.items[idx];
  return col.groups[+key.slice(1)].items[idx];
}

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest("button[data-tab]");
  if(!b || b.disabled) return;
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected", x===b));
  tab = b.dataset.tab; open = null;
  document.getElementById("q").value = "";
  render(); window.scrollTo({top:0});
});

view.addEventListener("click", e=>{
  const back = e.target.closest("[data-back]");
  if(back){ open = null; render(); window.scrollTo({top:0}); return; }
  const c = e.target.closest("[data-col]");
  if(c){ open = c.dataset.col; render(); window.scrollTo({top:0}); return; }
  const o = e.target.closest("[data-open]");
  if(o){
    const [key, idx] = o.dataset.open.split(":");
    openSheet(resolve(key, +idx));
  }
});

document.getElementById("q").addEventListener("input", render);
document.getElementById("sheetClose").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){
    if(sheet.classList.contains("open")) closeSheet();
    else if(open){ open = null; render(); }
  }
});

render();
</script>
